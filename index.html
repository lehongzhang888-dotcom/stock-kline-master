特的安全边际是三维的：即使估值出错（价格安全边际）、即使业务出问题（业务安全边际）、即使管理层犯错（管理层安全边际），投资仍然安全。三重安全垫叠加，才是巴菲特敢重仓的底气。","highlights":[{"text":"核心：安全边际=价格+业务+管理层三重保险","color":"gold"},{"text":"规则：三重安全垫叠加才敢重仓","color":"green"}]}]},{"title":"第3章·浮存金与资本配置","level":"推荐","points":[{"t":"浮存金的魔法","c":"保险浮存金=今天收保费明天才赔付。巴菲特用别人的零成本甚至负成本资金投资，复利效应放大千倍。","detail":"伯克希尔的核心秘密不是选股能力——是浮存金。如果你有1000亿美元零成本资金哪怕只赚5%就是50亿。GEICO的浮存金从1967年的2000万增长到如今的千亿级别。巴菲特比所有人都更深刻理解'资本来源决定投资策略'——他的长期持有风格正是因为浮存金给了他无限耐心。","highlights":[{"text":"核心：浮存金=零成本资金=复利倍增器","color":"gold"},{"text":"洞察：资本来源决定投资策略的基因","color":"purple"}]},{"t":"资本配置的三条路","c":"留存利润有三种用途：①再投资扩张（ROE>15%才值得）②收购（1+1>2）③回购（股价低于内在价值时最佳）。巴菲特优先回购。","detail":"巴菲特说CEO们面对这三个选项时选择④：乱并购做大规模提高自己薪酬。而真正为股东创造价值：再投资ROE要高、收购价格要合理、回购要在低估时。其中回购是最被低估的工具——公司在50美分买入自己的1美元，不动一刀一枪就帮所有股东赚了100%。","highlights":[{"text":"核心：资本配置三板斧：再投资/并购/回购","color":"gold"},{"text":"规则：低估时回购=用50美分买1美元","color":"green"}]}]},{"title":"第4章·管理层评估与公司治理","level":"推荐","points":[{"t":"管理层的三个标准","c":"①能力：历史业绩是否持续优于行业？②诚信：是否坦诚面对错误？③股东导向：是把股东当合伙人还是冤大头？","detail":"巴菲特最看重第三条——'股东导向'。他读年报先看致股东信：CEO谈自己功劳多还是谈业务风险多？把问题归咎外部还是承认失误？薪酬是否与业绩挂钩？巴菲特说：'和一个你不信任的管理层合伙做生意，就像和一个你不爱的人结婚。'","highlights":[{"text":"核心：管理层三标准=能力+诚信+股东导向","color":"gold"},{"text":"规则：先读致股东信判断人品再读财务数据","color":"green"}]},{"t":"回购的艺术与陷阱","c":"低估时回购=股东福音。高估时回购=价值毁灭。用债务回购=自杀。大量增发期权然后回购抵消=欺骗。","detail":"巴菲特在2010年代大规模回购伯克希尔股票，因为股价低于内在价值。但他也多次警告：很多公司管理层在股价高估时回购是为了推高EPS让自己期权行权。判断标准：回购是否让每股内在价值增加？如果公司内在价值100元、股价80元，回购让剩余股东的内在价值增加——这就是好的回购。","highlights":[{"text":"核心：低估回购=创造价值，高估回购=毁灭价值","color":"gold"},{"text":"警示：用评估回购动机判断管理层人品","color":"red"}]}]},{"title":"第5章·市场先生与逆向思维","level":"必修","points":[{"t":"市场先生是你的仆人","c":"市场先生每天来报一个买卖价——有时极度乐观报价极高，有时悲观至极报价极低。你的工作：在他报价极低时买、极高时卖，其余时间不理他。","detail":"2008年金融危机，巴菲特在《纽约时报》发文'我正在买入美国'——所有人恐惧到极点时他出手。2020年3月疫情崩盘，伯克希尔持有1400亿美元现金却没有大举买入——因为估值还不够极端。市场先生的报价本身不是风险，你被他牵着走才是真正的风险。","highlights":[{"text":"核心：利用市场先生而非被他利用","color":"gold"},{"text":"操作：极低买+极高卖+其余不理","color":"green"}]},{"t":"别人贪婪时恐惧，恐惧时贪婪","c":"这句名言的核心不是逆大众——是逆定价错误的极端。不是所有大众看好的都要卖，只有当价格远超价值时才卖。","detail":"巴菲特强调：如果所有人都看好一家公司且估值合理，没问题——持有。只有当所有人都看好且估值疯狂时，才是卖出信号。1969年巴菲特解散合伙基金就是因为'我找不到任何符合标准的低估股票'——整个市场都定价过高。这是逆向投资的真谛：逆向的是定价而非方向。","highlights":[{"text":"核心：逆向的是定价错误而非简单的逆大众","color":"gold"},{"text":"警示：普通人恐惧时真正恐惧的只有定价错误","color":"red"}]}]}],"knowledge_cards":[{"t":"护城河五维度评估法","c":"①品牌护城河：消费者是否愿意为品牌溢价买单？可口可乐盲测中偏好与品牌认知差距越大护城河越宽。②转换成本：客户更换供应商的成本是否高于产品本身？银行/软件/支付系统转换成本极高。③网络效应：每新增一个用户是否增加所有用户的价值？Visa/微信/Facebook是典型案例。④规模优势：规模是否带来单位成本持续下降？沃尔玛/亚马逊的物流规模。⑤特许经营权：是否有政府授予的独家经营权或专利壁垒？评估：≥2条突出=宽护城河，0条=无护城河不投。","type":"rule"},{"t":"巴菲特的股东盈余公式","c":"股东盈余=净利润+折旧摊销-维持性资本支出。区别于会计利润——只计算企业真正可以分配给股东的现金。维持性资本支出是维持当前盈利能力必须的投入（不是扩张投入）。若股东盈余持续增长且资本支出少=优秀企业。DCF估值基于股东盈余而非净利润：内在价值=未来10年股东盈余的折现值+终值。折现率取长期国债利率+适当风险溢价（通常8-10%）。","type":"formula"}],"quotes":["别人贪婪时我恐惧，别人恐惧时我贪婪。","以合理的价格买一家伟大的公司，远胜于以低廉的价格买一家普通的公司。"],"practice":["护城河五维度打分练习","年报致股东信的管理层人品分析"]},{"id":"b24","title":"穷查理宝典","author":"Charlie Munger","category":"投资哲学","stage":5,"diff":4,"hours":14,"summary":"查理·芒格的智慧箴言录。多元思维模型、逆向思维、人类误判心理学、能力圈——投资智慧的集大成者。","chapters":[{"title":"第1章·多元思维模型：跨学科格栅","level":"必修","points":[{"t":"锤子与钉子——单一学科的危险","c":"手里只有锤子的人看什么都是钉子。只用经济学思维分析投资=只看到1/7的真相。核心学科：心理/经济/物理/生物/历史/数学/哲学。","detail":"芒格的核心洞见：现实世界的问题不会按照学科边界整齐排列。一个投资问题可能是60%心理学+30%经济学+10%生物学。只用金融学分析投资就像只用一把锤子修整座房子。芒格的解决方案：掌握各学科最核心的思维模型——物理学的临界质量、生物学的进化、心理学的激励——然后用格栅串联。","highlights":[{"text":"核心：单一学科=单一工具=看窄世界","color":"gold"},{"text":"方法：掌握7大学科核心模型交叉使用","color":"green"}]},{"t":"七大核心思维模型","c":"①复利（数学）②激励（心理学）③供需（经济学）④进化（生物学）⑤反馈系统（物理学）⑥概率（统计学）⑦历史周期。每决策从每学科各问一题。","detail":"数学：这事复利效应是正向还是反向？心理学：所有参与者的激励是什么？经济学：供需何时逆转？生物学：这家公司在生态位中有何独特优势？物理学：临界点在哪？统计学：各种结果的概率分布？历史：历史上类似情况如何收场？七个问题问完，决策质量远超只问'PE多少'。","highlights":[{"text":"核心：每决策从七学科各问一题","color":"gold"},{"text":"规则：七问答不出=认知不足=不投","color":"green"}]}]},{"title":"第2章·逆向思维：反过来想","level":"必修","points":[{"t":"如果我知道会死在哪，我永远不去那","c":"解决问题不是想怎么做会成功——是想怎么做一定会失败然后逐一避免。正向思维想赢，逆向思维先想怎么不会输。","detail":"芒格讲过一个农夫的故事：'如果我知道我会死在哪里，我就永远不去那个地方。'在投资中翻译为：先列出所有会让你亏光的行为——高杠杆、单押一只、追热门、不止损、情绪交易——然后制定规则确保自己永远不做这些事。当你避开了所有必死之路，剩下的路通向成功。","highlights":[{"text":"核心：先想怎么死，然后永远绕开","color":"gold"},{"text":"方法：列出亏光清单→制定规则→绝不违反","color":"green"}]},{"t":"失败归因比成功归因更有价值","c":"研究成功案例容易幸存者偏差。研究失败案例——所有破产的公司在崩溃前有什么共同特征——认知更普适。","detail":"芒格和巴菲特花大量时间研究失败的收购和破产的企业。'我们不研究为什么成功——我们研究为什么失败，然后避开。'所有金融灾难前都有共同信号：过度杠杆、管理层自负、商业模式被颠覆但管理层不承认。逆向研究让你建立了比正向研究更可靠的风险雷达。","highlights":[{"text":"核心：研究失败>研究成功——规避幸存者偏差","color":"gold"},{"text":"方法：归纳所有失败案例的崩溃前共同信号","color":"purple"}]}]},{"title":"第3章·人类误判心理学：25种心理倾向","level":"必修","points":[{"t":"对投资危害最大的5种心理误判","c":"①被剥夺超级反应（亏损厌恶）②社会认同倾向（从众）③过度乐观倾向④确认偏误⑤奖励/惩罚超级反应。每次交易前逐条检查。","detail":"芒格详细拆解了25种人类天生心理倾向，每种都会在无意识中影响决策。'被剥夺超级反应'让你亏1万的痛苦≈赚2万的快乐，所以你不止损。'社会认同'让你在所有人都买的时候跟着买——这正是泡沫的心理学根源。关键认知：这些不是弱点——是大脑出厂设置。你只能管理它，不能消除它。","highlights":[{"text":"核心：25种心理误判是大脑出厂设置","color":"gold"},{"text":"警示：只能管理不能消除——每次交易前逐条对照检查","color":"red"}]},{"t":"激励机制——最重要的力量","c":"芒格说'永远不要低估激励的力量'。任何商业分析的第一步：弄清楚所有参与者的利益结构。谁在什么情况下赚什么钱？","detail":"芒格最经典的格言：'如果你要说服别人，诉诸利益而非理性。'在投资中——管理层的期权激励会让他们在股价高估时回购（推高EPS→行权），基金经理的年度排名激励会让他们追涨杀跌，分析师的佣金激励会让他们唱多不唱空。理解激励机制你就理解了大部分看似非理性的行为。","highlights":[{"text":"核心：激励机制解释一切看似非理性的行为","color":"gold"},{"text":"方法：分析所有参与方→找出利益结构→预测行为","color":"green"}]}]},{"title":"第4章·能力圈与投资检查清单","level":"推荐","points":[{"t":"能力圈的边界是谦虚的边界","c":"芒格和巴菲特一生只投了他们能理解的少数行业。'我们有三个篮子：进、出、太难——大多数公司进'太难'篮。'","detail":"芒格说：'如果你有很强的能力圈，你比那些智商170但能力圈为零的人做得好得多。'关键是诚实判断：这事我到底懂不懂？不要因为别人赚了钱就觉得自己也应该懂。他和巴菲特错过了亚马逊和Google，但芒格说：'我们不后悔——后悔的是在能力圈外做决策。'","highlights":[{"text":"核心：能力圈=诚实地知道边界在哪","color":"gold"},{"text":"规则：大多数公司应该进'太难'篮","color":"green"}]},{"t":"投资检查清单：芒格的飞行员思维","c":"芒格模仿飞行员的起飞前检查清单，任何投资都要逐条对照。不是限制创造性——是确保不遗漏致命问题。","detail":"飞行员每次起飞前都要对照检查清单，即使是飞了30年的老手。因为人是会疲劳会遗忘的。芒格的投资检查清单包括：护城河？管理层人品？估值有安全边际吗？反身性风险？心理误判？竞争格局变化？每项都打勾才扣扳机。'聪明人用检查清单不是因为笨——是因为知道自己的大脑会偷懒。'","highlights":[{"text":"核心：检查清单=对抗大脑偷懒的外挂","color":"gold"},{"text":"方法：逐条打勾→全部通过→才扣扳机","color":"green"}]}]},{"title":"第5章·普世智慧：芒格的生活哲学","level":"推荐","points":[{"t":"反过来想，要得到X先研究如何得到非X","c":"想幸福？先研究如何让生活悲惨然后避免。想财富？先研究如何破产然后不做。芒格式的终极智慧。","detail":"芒格在毕业典礼上做过一个经典演讲：'如何确保过上痛苦的人生'——吸毒、嫉妒、怨恨、不可靠、不学习。然后说：'现在我告诉了你们如何确保痛苦——你们只要反过来做就能幸福。'这就是芒格式的幽默+深刻：用一个出乎意料的角度让真理变得无法忘记。","highlights":[{"text":"核心：想得到X先研究如何得到非X然后反向操作","color":"gold"},{"text":"方法：用出乎意料的角度让深刻真理无法忘记","color":"purple"}]},{"t":"阅读改变命运","c":"芒格说'我这辈子没见过哪个聪明人不每天阅读'。孩子都叫他'一本长了两条腿的书'。","detail":"芒格每天阅读500页以上，从历史到物理到生物到心理学。他说：'通过阅读，你可以和已故的最聪明的人对话——这是人类独有的超能力。'阅读产生复利效应：读得越多，理解得越快，新信息和旧知识连接越多，思维格栅越密。不阅读的人=放弃了人类最重要的进化优势。","highlights":[{"text":"核心：每天阅读=和已故最聪明的人对话","color":"gold"},{"text":"方法：跨学科阅读→知识连接→思维格栅加密","color":"purple"}]}]}],"knowledge_cards":[{"t":"芒格人类误判心理学25条（投资前五条自查清单）","c":"每次重大投资决策前必须逐条检查：①被剥夺超级反应——是否因为不想认亏而在拖延止损？②社会认同倾向——是否因为大家都在买所以想跟？③过度乐观倾向——是否高估了未来的增长率？④确认偏误——是否只看了支持买入的信息？⑤奖励/惩罚超级反应——管理层激励是否在驱动他们做对股东不利的事？五条全通过=心理误判风险可控。五条中任何一条亮红灯=暂停交易冷静24小时再决定。这五条是25条中对投资危害最大的子集。","type":"rule"},{"t":"多元思维模型七学科格栅","c":"①数学：复利、概率、决策树——评估复合增长和各种结果的分布。②心理学：激励、误判、社会认同——理解市场参与者和自己的行为。③经济学：供需、比较优势、规模效应——分析企业的竞争地位。④物理学：临界质量、反馈系统——判断趋势何时加速或逆转。⑤生物学：进化、生态位、自然选择——理解商业竞争的本质。⑥历史：周期、繁荣崩溃——从过去的模式中寻找当前相似性。⑦哲学：第一性原理、逆向思维——追本溯源不盲从。","type":"concept"}],"quotes":["反过来想，总是反过来想。","我这一生见过的最聪明的人，没有一个不是每天都在阅读的。"],"practice":["误判心理学五条自查训练","七学科格栅决策练习"]},{"id":"b25","title":"投资最重要的事","author":"Howard Marks","category":"投资哲学","stage":5,"diff":3,"hours":12,"summary":"橡树资本创始人Howard Marks的备忘录精华。第二层思维、市场钟摆、风险三层理解、周期定位——为卓越投资绩效而写的哲学框架。","chapters":[{"title":"第1章·第二层思维：比别人多想一步","level":"必修","points":[{"t":"第一层 vs 第二层思维","c":"第一层：'好公司，买！'第二层：'好公司但人人知道→估值已反映→应该卖！'专业与业余的分界线不在知识量而在思考深度。","detail":"第一层思维人人都想得到——好行业好公司前景好=买。但第二层思维问：所有人都这么想了，这个'好'已经定价了没有？如果现在价格里已包含所有好消息，买了也赚不到超额收益。三个自检问题：①大多数人怎么看？②我的观点有什么不同？③为什么我比大多数人正确？答不出③=不行动。","highlights":[{"text":"核心：第二层思维=多想一步定价是否已反映","color":"gold"},{"text":"规则：答不出'为什么我比别人正确'=不行动","color":"green"}]},{"t":"第二层思维的实战应用","c":"好公司+高估值=糟糕投资。差公司+极低估值=可能好投资。关键不是公司好坏——是价格是否反映了所有已知信息。","detail":"Marks指出最常犯的错误：把好公司和好投资混为一谈。腾讯是好公司，但在700元买入的人至今亏损；很多钢铁股是差公司，但在行业底部买入的人赚了几倍。投资回报取决于你支付的价格与价值之间的差距——与公司'好坏'无必然关系。第二层思维就是要穿透'好公司'的标签看到价格。","highlights":[{"text":"核心：好公司≠好投资，关键看价格","color":"gold"},{"text":"警示：最危险=好公司+高估值","color":"red"}]}]},{"title":"第2章·理解市场周期与钟摆","level":"必修","points":[{"t":"钟摆永远在两个极端之间摆动","c":"市场永远在过度乐观和过度悲观之间摆动，极少在中点停留。钟摆靠近极端时速度最慢、靠近中点时速度最快。","detail":"Marks的投资生涯中观察到：人的情绪钟摆从中点到极端的速度比物理钟摆更快——因为贪婪和恐惧会自我强化。识别钟摆位置的信号：①媒体头条（乐观/恐慌）②新基金发行量（狂热/冰点）③融资融券余额④估值百分位⑤'这次不一样'的论调出现频率。≥3个极端信号=钟摆正在极端区域。","highlights":[{"text":"核心：钟摆永远在贪婪与恐惧间摆动","color":"gold"},{"text":"规则：≥3个极端信号=钟摆靠近极端=准备逆向","color":"green"}]},{"t":"周期定位：知道你在哪比预测去哪更重要","c":"不预测拐点何时到来——只判断当前在周期的哪个位置。周期底部附近买入>拐点精准买入。","detail":"Marks坦白说他无法预测市场拐点——也没有人能。但他的方法是周期定位：判断当前是'过热'还是'过冷'。过热时降低风险暴露但不清仓（因为不知道泡沫还能吹多大）；过冷时逐步加仓但不一把梭（因为不知道恐慌还要跌多久）。'我们不预测我们定位。'这是Marks最核心的实战智慧。","highlights":[{"text":"核心：知道在哪比预测去哪重要100倍","color":"gold"},{"text":"方法：不预测拐点→判断冷热→渐进调仓","color":"blue"}]}]},{"title":"第3章·风险控制的三层理解","level":"必修","points":[{"t":"三层递进：波动→永久损失→机会","c":"第一层：风险=波动（教科书定义）。第二层：风险=永久性本金亏损（Marks定义）。第三层：风险被充分定价时=最大机会。","detail":"Marks批判了金融学的风险定义：波动不是风险——价格跌了能涨回来的不是真正的风险。真正的风险只有一个：永久性本金损失。更深刻的是第三层认知：当所有人都恐惧、风险溢价极高时（如2008年底），市场价格已经把最坏情况都反映进去了——这时候反而是风险最小、机会最大的时候。","highlights":[{"text":"核心：风险=永久性损失而非波动","color":"gold"},{"text":"洞察：所有人恐惧时风险最大→其实是机会最大","color":"purple"}]},{"t":"风险的反直觉特征","c":"当感觉风险最低时（市场平稳上涨）反而是风险积累最快时。当感觉风险最高时（崩盘）反而是风险释放最充分时。","detail":"2007年市场一片祥和，没有人觉得有风险——Marks这时候开始减持。2008年雷曼倒闭后所有人都觉得世界要完——Marks开始大举买入。风险像冰山：露出水面的部分越小（感知风险低）=水面下的部分越大（实际风险高）。风险不能被消除——只能被转移或转化。","highlights":[{"text":"核心：感知风险与实际风险永远反向运动","color":"gold"},{"text":"警示：最安全的时候最危险，最危险的时候最安全","color":"red"}]}]},{"title":"第4章·逆向投资与耐心等待","level":"推荐","points":[{"t":"在别人不敢买的时候买","c":"超额收益的来源只有两个：①你看到了别人没看到的②你在别人不敢行动的时候行动了。","detail":"Marks强调：'如果你和别人做一样的事，你就只能得到和别人一样的结果。'超额收益必然来自与众不同的行为——在恐慌时买入、在狂热时卖出。但难点不在于知道这一点——在于真的去做。因为逆向投资时，你的所有本能都在尖叫'别买'——而你要逆本能而行。","highlights":[{"text":"核心：超额收益=看到别人没看到+做到别人不敢做","color":"gold"},{"text":"警示：逆向投资的痛苦来自对抗本能","color":"red"}]},{"t":"耐心是最被低估的投资技能","c":"Marks说'没有好机会就坐着等——什么都不做比被迫做点什么强100倍'。","detail":"大多数投资错误不是因为做了错误的投资——是因为在应该等待的时候做了投资。2005-2007年，橡树资本持有大量现金，被别人嘲笑'不作为'。但正是这些现金让他们在2008年危机中有弹药大举买入。巴菲特说投资就像棒球——你可以永远不挥棒，没有人会判你三振出局。","highlights":[{"text":"核心：耐心等待=最重要的进攻性武器","color":"gold"},{"text":"规则：没有好球不挥棒，没人会三振你","color":"green"}]}]},{"title":"第5章·寻找便宜货与价值创造","level":"推荐","points":[{"t":"便宜货的共同特征","c":"①不受欢迎/被忽视②有基本面问题但非致命③被'指数效应'或'卖出压力'压低④无人关注、分析师不覆盖。","detail":"Marks识别便宜货的方法：市场过度反应的领域。比如：被迫卖出（基金清盘/爆仓）、监管强制减持、ESG黑名单导致的机构禁买。这些情况下价格被非基本面因素压低——便宜不是公司不好，是暂时没人买。一旦压力源消失，价格会回归。关键是判断问题是暂时性的还是永久性的。","highlights":[{"text":"核心：便宜货=非基本面因素造成的暂时低价","color":"gold"},{"text":"方法：判断问题是暂时性还是永久性","color":"green"}]},{"t":"价值投资的防守属性","c":"防御型投资不是不承担风险——是在风险-收益不对称对你有利时才承担风险。Marks风格=牛市跟上、熊市远超。","detail":"Marks的投资哲学精华：'我们在牛市中可能略逊于大盘——但熊市中大幅跑赢，长周期复利下来远超。'这是一道简单数学题：亏50%需要赚100%回本。所以防止大亏比追求大赚重要得多。Marks的目标不是成为年度冠军——是30年内不要有任何一年大亏。复利的核心是不要中断。","highlights":[{"text":"核心：防御=牛市跟上+熊市远超=长跑冠军","color":"gold"},{"text":"公式：亏50%需赚100%回本→防止大亏>追求大赚","color":"blue"}]}]}],"knowledge_cards":[{"t":"第二层思维三问检验法","c":"每次投资决策前必须书面回答：①当前市场主流观点是什么？（如实记录大多数人怎么看）②我的观点与主流有什么不同？（必须明确差异，相同则无超额收益）③我有什么依据证明我的观点比主流更正确？（必须列举事实/数据/逻辑而非直觉）。三问全部清晰作答方可行动。第三问尤其关键——如果答不出'为什么我比市场更正确'，说明你没有信息优势或分析优势，此时交易=赌博。这是区分业余与专业投资的核心思维工具。","type":"rule"},{"t":"市场温度计——周期定位五信号","c":"极冷信号（买入）：①融资余额处于三年最低②新基金发行失败频现③成交量为峰值20%以下④PE处于10年10%分位⑤'股市完了'论调泛滥。极热信号（卖出）：①融资余额创历史新高②新基金秒光百亿规模③成交量持续天量④PE处于10年90%分位⑤'这次不一样'论调盛行。≥3条极冷=分步加仓至满仓；≥3条极热=分步减仓至30%仓位。不追求精准抄底逃顶，只判断冷热区间。","type":"formula"}],"quotes":["你不能预测未来，但你可以为未来做准备。","在投资中，最重要的不是买什么，而是花多少钱买。"],"practice":["第二层思维三问每日训练","市场温度计五信号每周评估"]},{"id":"b26","title":"金融炼金术","author":"George Soros","category":"投资哲学","stage":5,"diff":5,"hours":16,"summary":"索罗斯的哲学巨著——提出反身性理论，证明金融市场中参与者的偏见会影响基本面本身，形成自我强化的繁荣-萧条循环。量子基金实战日记同步验证。","chapters":[{"title":"第1章·反身性理论：价格与基本面的双向反馈","level":"必修","points":[{"t":"反身性的核心定义","c":"传统经济学：价格被动反映基本面。反身性：价格主动改变基本面→改变后的基本面又影响价格→形成正反馈或负反馈循环。","detail":"索罗斯用反身性否定了有效市场假说。举例：一家公司股价上涨→可以用更高估值融资并购→并购后利润增长→验证了股价上涨→吸引更多人买入→再涨。基本面本身被价格改变了。这不是非理性的——是理性的参与者在一个非完美的系统中做出理性决策，却导致了非线性的结果。","highlights":[{"text":"核心：价格↔基本面双向因果=反身性","color":"gold"},{"text":"洞察：反身性否定了'价格永远正确'的有效市场论","color":"purple"}]},{"t":"认知函数与操纵函数","c":"认知函数：参与者根据对现状的理解做决策。操纵函数：参与者的决策改变现状。两者相互交织永远无法分离。","detail":"这是反身性理论最严谨的数学表达。认知函数y=f(x)：参与者对世界的认知y取决于世界的状态x。操纵函数x=Φ(y)：世界的状态x被参与者的行动y改变。两个函数同时运行彼此交错——你永远无法获得客观的'基本面'，因为你的观察这个行为本身就在改变基本面。","highlights":[{"text":"核心：认知↔操纵交缠=无法获取客观基本面","color":"gold"},{"text":"推论：所有市场定价都包含了参与者的偏见","color":"purple"}]}]},{"title":"第2章·繁荣-萧条序列：泡沫八阶段模型","level":"必修","points":[{"t":"泡沫八阶段全景","c":"①未被认知的趋势②开始加速③成功验证④偏差扩大⑤现实无法支撑⑥拐点时刻⑦自我强化的下跌⑧全面崩溃回归。","detail":"每个泡沫都遵循相同的剧本：第一幕（①②③）——趋势悄然启动，少数人发现，赚钱效应扩散，越来越多人加入。第二幕（④⑤）——价格远远脱离基本面，'这次不一样'成为主流叙事，聪明人开始质疑但被嘲笑。第三幕（⑥⑦⑧）——某个催化剂刺破泡沫，反身性反向运作，下跌自我强化，最终崩溃到低于合理价值。索罗斯做空英镑时就是识别到了阶段⑤→⑥的拐点。","highlights":[{"text":"核心：每个泡沫都走八阶段剧本","color":"gold"},{"text":"策略：阶段②③做多最肥美，⑤⑥该跑路","color":"green"}]},{"t":"拐点时刻——最重要的识别","c":"泡沫不是因为坏消息而崩溃——是因为好消息不足以支撑更高的价格。当超级利好只带来微涨时=拐点已至。","detail":"索罗斯的实战智慧：不是去预测拐点什么时候来——而是识别拐点是否已经来了。确认信号：①超级好消息→价格只微涨或不涨②媒体和公众的狂热达到极致③质疑者彻底闭嘴④'永恒牛市'论调成主流。当这些信号出现，索罗斯会开始建立反向头寸——不是一次性满仓做空，而是先小仓试探等确认。","highlights":[{"text":"核心：特大好消息不涨=拐点将至","color":"gold"},{"text":"操作：确认拐点先小仓试探等验证后加仓","color":"green"}]}]},{"title":"第3章·信贷与监管周期：索罗斯的宏观框架","level":"必修","points":[{"t":"信贷周期是反身性的主战场","c":"银行放贷标准=最核心的反身性变量。经济好→银行放松放贷→经济更好→再放松→过热→坏账→收紧→衰退→再放松。","detail":"索罗斯认为信贷周期是反身性最强的地方——因为银行的行为直接改变了借款人的偿付能力。银行放贷时企业有钱投资→经济好→银行贷款质量好→放更多→企业更多投资→更好。但一旦开始收紧，企业没钱→经济下滑→贷款变坏账→更要收紧→加速下滑。信贷周期的拐点比经济周期更早也更猛烈。","highlights":[{"text":"核心：信贷周期=反身性最强的战场","color":"gold"},{"text":"方法：盯住银行放贷标准=预判经济拐点","color":"green"}]},{"t":"监管摆动与反身性","c":"金融危机→加强监管→金融压抑→放松监管→金融创新→过度创新→新危机→再加强。索罗斯：监管和市场永远在猫鼠游戏中相互塑造。","detail":"1980年代储贷危机后加强监管→1990年代监管放松→2000年代金融创新大爆发（CDO/CDS）→2008年危机后多德-弗兰克法案→2018年放松→未来某次危机。每一次的监管是针对上一次危机量身定做的，而下一场危机一定来自新监管框架的盲区。理解监管周期=理解下一场危机将在何处爆发。","highlights":[{"text":"核心：监管和市场永远在相互塑造","color":"gold"},{"text":"洞察：下次危机一定来自新监管框架的盲区","color":"purple"}]}]},{"title":"第4章·量子基金实验日记：1985-1986实盘验证","level":"推荐","points":[{"t":"实时实验——把理论放到市场中检验","c":"索罗斯在1985年8月-1986年11月每天记录自己的交易决策和宏观判断，用反身性框架预测并验证了美元/日元、石油、美国国债的重大拐点。","detail":"1985年9月广场协议前，索罗斯做出了最大胆的押注：做空美元。他的分析不是技术面也不是传统基本面——是反身性。美元过度强势→美国贸易逆差恶化→政治压力→汇率干预→美元下跌自我强化。他在日记中记录：'这个头寸基于反身性——美元正在进入自我强化的下跌循环。'量子基金那一年回报率超过120%。","highlights":[{"text":"核心：1985年做空美元=反身性实战经典","color":"gold"},{"text":"验证：广场协议后美元暴跌=反身性框架成功预测","color":"green"}]},{"t":"日记中的教训：错的代价","c":"索罗斯在日记中也记录了多次判断错误。关键不是不犯错——是识别错误后快速修正。'我之所以富有，是因为我知道自己什么时候错了。'","detail":"在实验日记中，索罗斯多次改变对石油价格的看法——从看多到看空到再看多。每次变化的理由都清楚记录。这不是立场摇摆——是反身性框架的核心优势：当基本面被价格改变时，你的判断也必须改变。传统投资者固守'基本面'不放，而索罗斯说：'如果情况变了我就变，这有什么可羞耻的？'","highlights":[{"text":"核心：反身性要求随时修正判断","color":"gold"},{"text":"警示：固执=反身性框架的头号大忌","color":"red"}]}]},{"title":"第5章·反身性的现代案例与交易应用","level":"推荐","points":[{"t":"比特币：反身性的完美教材","c":"比特币价格上涨→媒体报道→更多人买入→再涨→机构入场→再涨→国家入场？每一轮上涨都改变'比特币是什么'的基本面叙事。","detail":"索罗斯2017年说：'比特币是典型的泡沫。'但他没有说的是：反身性框架下，泡沫的持续时间可以远超你的想象。比特币的'基本面'是什么？是网络安全性、用户数、使用场景——而这些每一个都随着价格上涨而改善。这是最纯粹的反身性：价格本身就是基本面的最大组成部分。","highlights":[{"text":"案例：比特币=价格即基本面的终极反身性","color":"gold"},{"text":"教训：反身性泡沫的持续时间可以远超想象","color":"purple"}]},{"t":"反身性框架的实战三步法","c":"①识别：当前是否存在反身性过程（价格与基本面互相强化）？②定位：处于八阶段中哪一阶段？③行动：2-3阶段做多5-6阶段做空。","detail":"不是所有市场都存在反身性——大多数时候价格确实围绕价值波动（近乎均衡）。但在某些时刻（信贷扩张/技术革命/制度变革），反身性开始活跃。索罗斯的智慧是：大多数时候不交易，只在反身性活跃时下重注。三步法中第一步最关键——错误地将非反身性市场当作反身性来交易=灾难。","highlights":[{"text":"核心：大多数时候不交易，只在反身性活跃时下重注","color":"gold"},{"text":"步骤：识别反身性→定位阶段→下重注","color":"green"}]}]}],"knowledge_cards":[{"t":"反身性泡沫八阶段识别表","c":"阶段①未被认知的趋势：少数先行者发现趋势，大多数人无视。②加速期：趋势被更多人认可，价格开始加速。③成功验证：价格上升验证了看多逻辑，怀疑者开始转向。④偏差扩大：价格远超任何合理估值，'这次不一样'成为主流叙事。⑤现实无法支撑：基本面开始跟不上价格步伐，先行者悄悄撤离。⑥拐点：重大利好无法推高价格，市场情绪微妙转变。⑦自我强化下跌：价格下跌引发恐慌，恐慌引发更多卖出，反身性反向运作。⑧全面崩溃：价格跌破合理价值，最终回到或低于均衡。实战：②③阶段做多，⑤⑥阶段做空/离场。","type":"concept"},{"t":"索罗斯的试错-修正仓位管理","c":"索罗斯不追求一开始就重仓正确。初始头寸为计划总仓位的20-30%。若市场方向验证预判（价格向有利方向运动+基本面变化验证逻辑），则每验证一次加仓20-30%。若市场方向与预判相反，立即平仓重新评估——'先退出再看，看不清就等'。最终可能仓位远超100%（通过杠杆），但全部基于逐次验证而非一次性押注。这套方法的哲学：承认自己可能错，用市场当裁判，对了才加大赌注。与金字塔加仓的区别：索罗斯依据的是反身性逻辑验证而非价格本身。","type":"rule"}],"quotes":["我之所以富有，是因为我知道自己什么时候错了。","市场总是错的，因为参与者对未来的判断本身就塑造了未来。"],"practice":["反身性八阶段案例复盘","试错-修正仓位管理模拟"]},{"id":"b27","title":"原则","author":"Ray Dalio","category":"投资哲学","stage":5,"diff":3,"hours":14,"summary":"桥水基金创始人Ray Dalio的人生与工作原则。全天候策略、经济机器模型、激进透明、可信度加权决策、痛苦+反思=进步——不仅是一套投资体系，更是一套人生操作系统。","chapters":[{"title":"第1章·拥抱现实并应对现实","level":"必修","points":[{"t":"现实是中性的——痛苦来自抗拒而非现实本身","c":"Dalio的起点原则：现实像重力——你抱怨它不会让重力消失。接受现实、理解规律、按规律行事。","detail":"Dalio说：'做一个超级现实主义者'。这听起来冷酷但实际是终极务实。市场不会关心你的仓位、你的希望、你的亏损——它只运行自己的规律。你越快接受'市场永远是老大哥'这个现实，就越快从受害者心态转变为适应者心态。适应者存活、抱怨者淘汰——这是进化的铁律。","highlights":[{"text":"核心：现实是重力——抗拒无效理解有用","color":"gold"},{"text":"心态：从受害者变为适应者=进化的第一步","color":"purple"}]},{"t":"进化是宇宙最强大的力量","c":"Dalio的进化观：一切事物要么适应进化要么消亡。个人、公司、策略——不持续进化就等于在等死。","detail":"Dalio把进化论应用于一切：桥水的策略永远在迭代——不是每年改一次而是每天都在微调。全天候策略从1996年的版本到今天已经迭代了几百次。他说：'如果你回顾一年前的自己，不觉得当时的自己是傻瓜，说明你没有进步。'这个标准残酷但有效——迫使你不断自我超越。","highlights":[{"text":"核心：不持续进化=慢性自杀","color":"gold"},{"text":"标准：一年前的自己不觉得傻=没进步","color":"purple"}]}]},{"title":"第2章·激进透明与可信度加权决策","level":"必修","points":[{"t":"激进透明——桥水最独特的原则","c":"所有会议录音、所有讨论公开、任何人都可以挑战任何人。没有'顾及面子'——真相高于和谐。","detail":"桥水的文化被称为'全世界最奇怪的公司文化'。Dalio的逻辑：投资决策的质量决定回报，而决策质量取决于信息质量。如果人们不敢说真话（怕得罪老板、怕丢面子），信息质量就低=决策就烂=亏钱。所以激进透明不是道德选择——是投资回报率的计算：高质量信息输入→高质量决策→高回报。","highlights":[{"text":"核心：激进透明=高质量信息输入=高投资回报","color":"gold"},{"text":"公式：怕得罪人=信息失真=决策烂=亏钱","color":"red"}]},{"t":"可信度加权——不是所有意见都平等","c":"每人在其领域有'可信度评分'。决策时参考所有意见但按可信度加权：专家意见权重10、新手意见权重1。","detail":"Dalio发明了一套'棒球卡'系统——给每位员工打分，记录他们在不同领域的判断准确率。讨论宏观经济时，做对过3次以上预测的宏观分析师意见权重10；第一次发言的实习生产品经理意见权重1。'民主不是一人一票——是可信度加权投票。'这避免了两个极端：独裁（老板说了算）和民粹（谁声音大谁说了算）。","highlights":[{"text":"核心：可信度加权=专家权重>新手权重","color":"gold"},{"text":"方法：棒球卡系统=实时记录每个人的决策准确率","color":"green"}]}]},{"title":"第3章·错误日志与痛苦+反思=进步","level":"必修","points":[{"t":"痛苦+反思=进步——Dalio最重要的公式","c":"每次犯错→感受痛苦→反思原因→写出改进规则→严格执行→再次犯错→再次痛苦→再次反思→循环螺旋上升。","detail":"Dalio在1982年错判美国经济崩溃公开认错——这是他人生最大的痛苦也是最大的转折。从那天起他建立了错误日志制度：每一次错误都被分类、归因、归档。痛苦不是坏事——痛苦+反思=一次升级。痛苦+不反思=白白受苦。大多数人跳过反思步骤——所以大多数人重复同样的错误。","highlights":[{"text":"核心：痛苦+反思=进步，痛苦+不反思=白受苦","color":"gold"},{"text":"方法：每次错误→记录→归因→写规则→执行","color":"green"}]},{"t":"错误日志——桥水的核心操作系统","c":"所有错误都被记录到共享日志中，所有人都能看到。不是追责——是把错误变成组织的学习资产。","detail":"普通公司把错误藏起来（丢人），桥水把错误晒出来（学习）。错误日志让一个团队里每个人都能从别人的错误中学习——1个人犯的错让100个人都学到。Dalio说：'问题就像解谜——找到问题的根源就是找到了升级系统的密码。'桥水的错误日志累计超过10万条，每一条都是免费的学习素材。","highlights":[{"text":"核心：错误日志=组织的集体学习资产","color":"gold"},{"text":"方法：1人犯错100人学习=学习效率100倍","color":"blue"}]}]},{"title":"第4章·经济机器与全天候策略","level":"必修","points":[{"t":"经济机器——Dalio的宏观理解框架","c":"经济=无数交易的集合。三股驱动力：①生产率增长（长期向上）②短期债务周期（5-8年）③长期债务周期（50-75年）。","detail":"Dalio的30分钟动画'经济机器是怎样运行的'被数亿人观看——因为它用极简的方式拆解了复杂系统。核心逻辑：生产率决定长期趋势线，两个债务周期围绕趋势线上下波动。理解了你处在哪个周期的哪个位置，你就理解了资产价格的未来方向。2008年桥水提前预判危机正是因为识别到了长期债务周期的顶峰。","highlights":[{"text":"核心：经济=生产率+短期债务周期+长期债务周期","color":"gold"},{"text":"方法：识别三个周期各自的位置=判断资产方向","color":"green"}]},{"t":"全天候策略——在任何环境下都不崩溃","c":"股票30%+长期国债40%+中期国债15%+黄金7.5%+大宗商品7.5%。每季度再平衡。四大经济环境（增长/衰退/通胀/通缩）各有一种资产表现好。","detail":"Dalio设计全天候不是为了追求最高回报——是为了追求'永不崩溃'。传统60/40组合在通胀环境下股债双杀。全天候通过风险平价（而非资本平价）配置——不是每类资产放同样多的钱，而是每类资产承担同样的风险。这意味着债券占比大（波动小用更多钱对冲），黄金和商品占比小但作用关键（通胀对冲）。","highlights":[{"text":"核心：全天候=风险平价而非资本平价","color":"gold"},{"text":"理念：不追求最高回报——追求永不崩溃","color":"purple"}]}]},{"title":"第5章·人与文化：打造极致团队","level":"推荐","points":[{"t":"人是第一位的——比策略更重要","c":"Dalio说：'给我一个平庸的策略配上一流的执行团队，远超一流的策略配上平庸的团队。'","detail":"桥水的招聘过程极其严格——录取率不到1%。Dalio要找的不是最聪明的人，而是'最擅长从错误中学习的人'。因为聪明人在投资界多如牛毛，但真正能从错误中快速成长并保持开放心态的人凤毛麟角。桥水用性格测试+多次面试+试用期来筛选。核心寻找特质：'知道你不知道什么并坦然承认。'","highlights":[{"text":"核心：一流的执行团队>一流的策略","color":"gold"},{"text":"招聘标准：最擅长从错误中学习>最聪明","color":"green"}]},{"t":"有意义的工作和有意义的人际关系","c":"Dalio认为这两者是不可分割的。只有激进的坦诚才能建立真正信任的团队。而真正信任的团队才能做出最好的投资决策。","detail":"桥水成功的秘密武器不是经济模型——是文化。当所有人都可以毫无顾忌地指出别人的错误时（包括Dalio本人被实习生怼），思考的质量指数级提升。但这个文化极其难复制——因为它要求所有人都极度理性、不ego、把真相放在自我之前。Dalio承认：很多人才离开桥水正是因为无法适应这种'残酷的坦诚'。","highlights":[{"text":"核心：文化=最深的护城河也最难复制","color":"gold"},{"text":"警示：激进透明不适合所有人——筛选比培养更重要","color":"red"}]}]}],"knowledge_cards":[{"t":"全天候策略风险平价配置","c":"全天候配置=股票30%+长期国债40%+中期国债15%+黄金7.5%+大宗商品7.5%。核心理念是风险平价（Risk Parity）：不是每类资产投相同金额，而是每类资产承担相同风险。债券波动低→配置更多（55%），股和商品波动高→配置更少（37.5%和15%）。每季度再平衡一次。覆盖四大宏观环境：增长利好股票、衰退利好债券、通胀利好黄金/大宗、通缩利好债券。年化收益6-8%+波动<10%+极端回撤<20%。目标是任何单一宏观环境都不会击穿组合。","type":"formula"},{"t":"Dalio错误日志五步法","c":"①发生了什么？（客观描述错误——不评价不辩解）②根本原因是什么？（至少问5个'为什么'追溯到根源）③如果是系统性问题——修改系统规则；如果是个人失误——制定个人检查清单。④将改进方案写下来并通知所有相关人员。⑤设置触发检查点（如每周回顾）确保新规则得到执行。关键原则：错误日志不是用来追责的——是用来升级操作系统的。同样的错误出现两次=系统没有升级到位。","type":"rule"}],"quotes":["痛苦+反思=进步。","拥抱现实并应对现实，做一个超级现实主义者。"],"practice":["创建个人错误日志体系","全天候组合季度再平衡练习"]},{"id":"b28","title":"专业投机原理","author":"Victor Sperandeo","category":"交易系统","stage":3,"diff":3,"hours":14,"summary":"Sperandeo连续12年盈利无一亏损月。123法则+2B法则是最经典的趋势反转判断工具。","chapters":[{"title":"第1章·123法则","level":"必修","points":[{"t":"三步判断反转","c":"①趋势线被突破②不再创新高低③突破前一个回调低/高点。三步全满足=反转概率>80%。","detail":"不预测反——等反转自己走出来再确认。第一步警告二步怀疑三步确认。很多人错在第一步就急做反向。","highlights":[{"text":"核心：等反转走出来再确认不预判","color":"gold"},{"text":"方法：三步判断反转——反复练习","color":"blue"}]}]},{"title":"第2章·2B法则","level":"必修","points":[{"t":"假突破反转","c":"价短暂突破前高/低后迅速反转=主力陷阱。诱多出货或诱空吸筹——反向交易。","detail":"123+2B同时出现=最强反转信号可重仓。仅2B=半仓试单。仅趋势线突破=观望。","highlights":[{"text":"核心：2B=主力陷阱→反向交易","color":"gold"},{"text":"方法：假突破反转——反复练习","color":"blue"}]}]},{"title":"第3章·趋势线与盈亏比","level":"推荐","points":[{"t":"趋势线画法","c":"连接两个连续回调低/高点。触及越多越有效。角度不能超45度。","detail":"太陡趋势线不可持续。跌破需收盘确认。趋势线角度判断趋势健康度。","highlights":[{"text":"规则：趋势线角度30-45度=健康","color":"green"}]},{"t":"最小3:1盈亏比","c":"潜在回报至少潜在风险3倍才入场。即使胜率40%盈亏比3:1期望=0.6(正期望)。","detail":"胜率80%但盈亏比0.5期望=0.2。盈亏比比胜率重要得多。","highlights":[{"text":"公式：期望=胜率×盈-(1-胜率)×亏","color":"gold"},{"text":"方法：最小3:1盈亏比——反复练习","color":"blue"}]}]},{"title":"第4章·资金管理法则","level":"必修","points":[{"t":"2%单笔风险上限","c":"任何单笔交易亏损不超过总资金2%。连续亏损20次仍存活——2%是生存底线不可突破。","detail":"2%不是建议是铁律。连续10次亏损仅亏18%——正常回撤。5%单笔=10次亏50%=回本需100%。活下去才有机会。","highlights":[{"text":"铁律：单笔永远不超过2%","color":"gold"},{"text":"警示：5%/笔=10次亏50%=回本需100%","color":"red"}]},{"t":"风险敞口总量控制","c":"所有持仓总风险敞口≤6%。单月回撤≥10%强制暂停——复盘月内每笔交易后再入场。","detail":"6%总敞口=最多3个2%仓位同时运行。月亏10%=休息30天+逐笔复盘+验证系统未失效方可恢复。机制保护你免受情绪化连续交易。","highlights":[{"text":"规则：总敞口≤6%+月亏10%强制暂停","color":"green"}]}]},{"title":"第5章·交易心理学","level":"推荐","points":[{"t":"四种致命情绪","c":"恐惧→不敢入场错过机会。贪婪→满仓杠杆赌反转。希望→亏损死扛不认错。愤怒→报复性交易加倍损失。","detail":"Sperandeo：情绪是交易的头号敌人。识别情绪信号：手抖=仓位太大、不想看盘=方向错了、急于翻本=停手。建立情绪日记每天记录交易时的心理状态。","highlights":[{"text":"核心：识别情绪信号比识别技术信号更重要","color":"gold"},{"text":"方法：建立情绪日记——每天记录交易心理","color":"blue"}]}]}],"knowledge_cards":[{"t":"123法则市场哲学","c":"123法则的核心哲学：不预测反转——等反转自己走出来再确认。第一步警告(趋势线破)、第二步怀疑(不创新高/低)、第三步确认(突破前高低)。三步全满足=趋势已变不需要预测。这个框架的深层智慧在于承认我们无法精确预测拐点——但可以在趋势变化后第一时间识别。","type":"concept"},{"t":"123+2B决策矩阵","c":"123+2B同时出现=最强反转信号可重仓(70%+仓位)。仅123满足=正常仓位(50%仓位)。仅2B=半仓试单(25%仓位)。仅趋势线突破=观望不行动(0%仓位)。信号叠加越多持仓越大——信号减少持仓递减。这是仓位与信号质量挂钩的经典范式。","type":"rule"}],"quotes":["交易的唯一目的是赚钱，不是证明自己正确。","市场就像一条河流——你无法改变它的方向，只能跟随它。"],"practice":["每天复盘画出3只标的的123与2B信号","用半年交易数据验证盈亏比3:1的期望公式"]},{"id":"b29","title":"股票魔法师","author":"Mark Minervini","category":"选股策略","stage":4,"diff":3,"hours":12,"summary":"Minervini连续三年美国投资大赛冠军3万倍收益。SEPA策略+VCP形态+趋势模板。","chapters":[{"title":"第1章·SEPA五要素","level":"必修","points":[{"t":"趋势→基本面→催化剂→买点→风控","c":"五个要素全部满足才考虑交易——任一项缺失=放弃。","detail":"有先后顺序：先看趋势定方向→基本面定质量→催化剂定时机→买点定盈亏比→风控保生存。","highlights":[{"text":"核心：五要素缺一不可","color":"gold"},{"text":"方法：趋势→基本面→催化剂→买点→风控——反复练习","color":"blue"}]}]},{"title":"第2章·VCP波动收缩","level":"必修","points":[{"t":"弹簧压缩形态","c":"至少3次波动收缩+每次比前次小25-50%+最后振幅<10%+底量<均量50%+突破量>均量1.5倍。","detail":"VCP=弹簧压缩蓄能。收缩越紧爆发越强。收缩点突破=最佳买点——止损窄利润空间大。","highlights":[{"text":"核心：VCP=弹簧压缩收缩越紧爆发越强","color":"gold"},{"text":"方法：弹簧压缩形态——反复练习","color":"blue"}]}]},{"title":"第3章·趋势模板","level":"推荐","points":[{"t":"7条筛选标准","c":"股价>150/200日线+150>200+200日上涨≥1月+>52周低30%+在52周高25%内+RS>70。全满足=入选。","detail":"趋势模板=过滤器——不符合的任何股票不看。每天收盘30分钟完成自选股检查。","highlights":[{"text":"规则：趋势模板=硬性过滤器","color":"green"}]}]},{"title":"第4章·卖出纪律","level":"必修","points":[{"t":"止损与止盈规则","c":"止损：跌破买入日最低价或亏损超7-8%无条件离场。止盈：涨20%后卖一半利润锁定成本归零交易。","detail":"Minervini止损铁律：买入日最低价=止损线——跌破=判断错误立即离场。涨20%=卖1/2仓位让剩余仓位零成本持有——心理优势巨大可安心等大行情。","highlights":[{"text":"铁律：跌破买入日最低价=无条件离场","color":"gold"},{"text":"策略：涨20%卖1/2=零成本持仓","color":"green"}]},{"t":"技术卖出信号","c":"放量长上影+跌破10日线+连续3日不创新高+RSI顶背离——任一项触发=减仓2+项=清仓。","detail":"卖出比买入难10倍。买入有无限候选卖出只有手中持仓。预设卖出条件不临场决策。每周五检查持仓：仍满足趋势模板？继续持有——否则减仓或清仓。","highlights":[{"text":"核心：卖出比买入难10倍——预设条件不临场决策","color":"gold"},{"text":"方法：技术卖出信号——反复练习","color":"blue"}]}]},{"title":"第5章·仓位集中与轮动","level":"推荐","points":[{"t":"4-8只核心持仓","c":"总持仓不超过8-12只核心4-8只。每只初始10-25%。最强2-3只=金字塔加仓对象——弱者淘汰换强者。","detail":"集中持有最佳标的≠分散持有平庸标的。每月评估排名——前3名加仓后3名减持。仓位向最强标的集中让利润奔跑。轮动是持续盈利的核心机制。","highlights":[{"text":"核心：集中最佳而非分散平庸","color":"gold"},{"text":"方法：每月排名——强者加仓弱者淘汰","color":"blue"}]}]}],"knowledge_cards":[{"t":"SEPA策略哲学","c":"SEPA=Specific Entry Point Analysis(精确买点分析)。其核心不是选好股票——是在最好的时机以最好的价格买最好的股票。五要素过滤链：趋势过滤→基本面过滤→催化剂过滤→买点过滤→风控过滤。任何一环不满足=不交易。这解决了多数交易者的问题：知道买什么但不知道什么时候买。","type":"concept"},{"t":"VCP量化标准","c":"①至少3次波动收缩(Tight→Tighter→Tightest)②每次收缩幅度比前次小25-50%③最后一次收缩振幅<10%④底部成交量<50日均量50%⑤突破时成交量>50日均量1.5倍⑥收缩周期2-6周。六条全部满足=高胜率VCP突破买点。收缩越紧爆发越强。","type":"rule"}],"quotes":["坚持你的策略比找到好的策略难100倍。","超级表现股总在无人关注时开始上涨，在人尽皆知时见顶。"],"practice":["每周用趋势模板筛选全市场自选股","在历史图表中找出10个标准VCP形态训练识别"]},{"id":"b30","title":"期货市场技术分析","author":"John Murphy","category":"技术分析","stage":2,"diff":3,"hours":18,"summary":"技术分析百科全书级教材。CFA考试指定参考书。覆盖均线、震荡指标、OBV、持仓量、市场间分析。","chapters":[{"title":"第1章·移动平均线系统","level":"必修","points":[{"t":"均线实战核心","c":"单均线=价格在线上多头。双均线=金叉买入。三均线=多头排列最强。均线方向>位置。","detail":"均线向上时价破均线可能是买点(回调买入)。均线向下时价破均线可能是卖点(反弹卖出)。","highlights":[{"text":"核心：均线方向比位置更重要","color":"gold"},{"text":"方法：均线实战核心——反复练习","color":"blue"}]}]},{"title":"第2章·MACD与RSI","level":"必修","points":[{"t":"MACD背离最强","c":"价创新高DIF不创新高=顶背离卖出。价创新低DIF不创新低=底背离买入。周线>日线。","detail":"零轴附近背离信号更强。两次背离>一次。背离+趋势线突破=最强组合。","highlights":[{"text":"核心：MACD背离=最可靠反转信号","color":"gold"},{"text":"方法：MACD背离最强——反复练习","color":"blue"}]}]},{"title":"第3章·成交量与市场间分析","level":"推荐","points":[{"t":"OBV能量潮","c":"OBV与价同步=健康。OBV不跟=背离。OBV的走势比数值更重要。","detail":"OBV的背离是最可靠量价信号之一。量在价先。","highlights":[{"text":"规则：OBV背离=最可靠量价信号","color":"green"}]},{"t":"跨市场联动","c":"美元↑→商品↓。债券收益率↑→股票承压。黄金↑→通胀预期↑。","detail":"单一市场看不够——跨市场联动提供全局视角。","highlights":[{"text":"核心：跨市场联动=全局视角","color":"gold"},{"text":"方法：跨市场联动——反复练习","color":"blue"}]}]},{"title":"第4章·期货的三大独特性","level":"必修","points":[{"t":"连续性合约的陷阱","c":"期货有到期日——主力合约换月产生跳空。连续图=拼接数据≠真实可交易价格。分析主连+关注升贴水结构。","detail":"主力合约换月时价差可达3-5%。用连续图回测=高估收益低估回撤——因为跳空在实际交易中不可捕捉。必须用实际合约而非拼接数据进行策略验证。升水市场=正向(远月>近月)贴水市场=反向。","highlights":[{"text":"警示：连续图回测=高估收益——跳空不可交易","color":"red"},{"text":"规则：分析主连合约+关注升贴水结构","color":"green"}]},{"t":"杠杆与双向交易","c":"10倍杠杆=10%波动=本金翻倍或归零。裸做空=无限风险(理论上亏损无上限)。杠杆×持仓量×波动率=实际风险敞口。","detail":"期货最大危险：杠杆让人忽视实际风险敞口。1手原油=1000桶×$70=$70000面值——10%保证金=$7000但风险按$70000计算。双向交易=无论牛熊都有机会但要控制裸空头寸规模。","highlights":[{"text":"核心：杠杆×持仓量×波动率=真实风险敞口","color":"gold"},{"text":"警示：杠杆与双向交易不可忽视","color":"red"}]}]},{"title":"第5章·期货综合实战框架","level":"推荐","points":[{"t":"四维分析体系","c":"①趋势(均线方向)②动量(MACD/RSI背离)③量仓(成交量+持仓量配合)④市场间(美元/利率/相关商品)。四维共振=高胜率信号。","detail":"单一维度信号=40-50%胜率。二维共振=50-60%。三维=60-70%。四维同时共振=70%+。持仓量增加+价格上涨=多头主动(强)。持仓量增加+价格下跌=空头主动(强)。持仓量减少=趋势减弱。","highlights":[{"text":"核心：四维共振=胜率从40%→70%+","color":"gold"},{"text":"规则：持仓量增减=多空力量验证关键","color":"green"}]}]}],"knowledge_cards":[{"t":"期货连续性的本质","c":"期货与股票最大区别：合约有到期日。主力合约换月产生非交易跳空——连续图是拼接数据而非真实价格序列。升水(Contango)市场=远月>近月(持有成本>便利收益)。贴水(Backwardation)=近月>远月(现货紧张)。升贴水结构反映供需基本面——是股票技术分析完全不具备的额外信息维度。","type":"concept"},{"t":"持仓量分析法则","c":"持仓量(Open Interest)=市场参与度。四种经典组合：①价涨+量增+仓增=多头趋势健康(加仓)②价涨+量缩+仓减=上涨乏力(减仓)③价跌+量增+仓增=空头趋势健康(持有空头)④价跌+量缩+仓减=下跌衰竭(获利了结)。持仓量的变化方向比绝对数值更重要。量仓配合分析是期货独有的优势。","type":"rule"}],"quotes":["技术分析的本质是通过历史价格研究群体心理。","期货市场最大的优势——你可以双向交易，但最大的危险也在于此。"],"practice":["建立四维分析评分表每日更新3个品种","对比连续合约与主力合约的信号差异写笔记"]},{"id":"b31","title":"金融怪杰","author":"Jack Schwager","category":"交易系统","stage":4,"diff":2,"hours":14,"summary":"Schwager采访17位顶级交易员。他们的方法各不相同但纪律和心态惊人一致。","chapters":[{"title":"第1章·大师们的共同点","level":"必修","points":[{"t":"17位大师共同特质","c":"都曾亏光过+极度自律+明确系统+严格执行止损+风控放首位+不预测只跟随。","detail":"方法各不相同(基本面/技术面/宏观)——但执行方式惊人一致。证明：方法不是关键执行力是关键。","highlights":[{"text":"核心：执行力>方法——17位大师证明","color":"gold"},{"text":"方法：17位大师共同特质——反复练习","color":"blue"}]}]},{"title":"第2章·Paul Tudor Jones","level":"推荐","points":[{"t":"1987年黑色星期一","c":"崩盘前判断市场会跌但当天仍在做多。发现错误立即反手做空——当天赚1亿美元。","detail":"判断正确≠立即正确。发现错误立即纠正的能力比预测能力更值钱。","highlights":[{"text":"核心：发现错误立即纠正>预测正确","color":"gold"},{"text":"方法：1987年黑色星期一——反复练习","color":"blue"}]}]},{"title":"第3章·Ed Seykota趋势跟踪哲学","level":"推荐","points":[{"t":"系统化趋势跟踪","c":"Seykota将客户$5000变成$1500万——靠系统化趋势跟踪而非预测。规则编程化执行消除情绪干扰。","detail":"Seykota名言：Everyone gets what they want from the market(每个人从市场得到他真正想要的)。有些人想要刺激——他们得到频繁交易和亏损。有些人想要利润——他们得到纪律和长期盈利。","highlights":[{"text":"核心：系统化执行消除情绪干扰","color":"gold"},{"text":"洞见：你从市场得到你真正想要的","color":"purple"}]},{"t":"趋势跟踪的精髓","c":"截断亏损让利润奔跑——八个字概括所有盈利策略。止损要快盈利要慢——与人性完全相反所以难执行。","detail":"趋势跟踪=60%小亏20%小赚20%大赚。20%大赚覆盖所有小亏产生净利润。核心不是提高胜率——是确保每笔大赚不被过早截断。Seykota用移动止损跟随趋势绝不预设目标价。","highlights":[{"text":"核心：60%小亏+20%小赚+20%大赚=正期望","color":"gold"},{"text":"方法：趋势跟踪的精髓——反复练习","color":"blue"}]}]},{"title":"第4章·顶级交易员的共同风控","level":"必修","points":[{"t":"五道风控防线","c":"①单笔≤2%②日亏≤5%暂停③周亏≤10%停一周④月亏≤15%停一月⑤年亏≤25%重新评估系统。五道防线层层保护。","detail":"17位大师无一例外都有明确风控规则——系统可能不同但底线惊人一致。风控不是让你赚更多——是确保你活到系统发挥正期望的那一天。没有风控的系统像一个没有刹车的高速赛车。","highlights":[{"text":"铁律：五道防线层层保护——缺一不可","color":"gold"},{"text":"警示：没有风控=没有刹车的高速赛车","color":"red"}]}]}],"knowledge_cards":[{"t":"交易系统中的正期望","c":"正期望值是区分赌博和交易的唯一标准。计算公式：E=(胜率×均盈)-(败率×均亏)。胜率30%+均盈3+均亏1=0.3×3-0.7×1=0.2正期望。胜率80%+均盈0.5+均亏1=0.8×0.5-0.2×1=0.2正期望。两种系统都能赚钱但心理体验完全不同——选择与你心理匹配的系统比追求高胜率更重要。","type":"concept"},{"t":"17位大师共同止损原则","c":"①止损≤总资金2%（硬约束不可突破）②止损在入场前设定（不在盘中临时决定）③止损触发后等30分钟冷静再考虑重新入场④连续3次止损=当天停止交易⑤月度亏损≥6%=当月停止交易全面复盘。这五条规则被所有17位大师采纳——不分交易风格和技术流派。","type":"rule"}],"quotes":["市场不在乎你是谁，它永远按照自己的方式运行。","每个人从市场得到他真正想要的——不是他嘴上说的。"],"practice":["列出5条自己交易系统的正期望值证据","对照大师的止损规则检查自己的风控缺口"]},{"id":"b32","title":"新金融怪杰","author":"Jack Schwager","category":"交易系统","stage":4,"diff":2,"hours":14,"summary":"采访外汇、期权、系统化交易等细分领域顶尖高手。比前作更多元化技术化。","chapters":[{"title":"第1章·外汇之王Lipschutz","level":"推荐","points":[{"t":"从12000到数亿","c":"市场永远是对的——但你的交易理由可能也是对的只是时机不对。判断+时机缺一不可。","detail":"区分判断正确和时机正确。判断一只股会涨是对的但入场先跌30%心态崩溃——在真正涨前止损。","highlights":[{"text":"核心：判断正确≠时机正确——两者缺一不可","color":"gold"},{"text":"方法：从12000到数亿——反复练习","color":"blue"}]}]},{"title":"第2章·系统化交易","level":"推荐","points":[{"t":"机械+人为最优","c":"机械系统=无情绪+可回测+可复制处理80%日常。人为=处理20%特殊情况。","detail":"纯粹机械系统：市场结构性变化导致失效。纯粹主观：情绪干扰严重。最优=系统为主人为监督。","highlights":[{"text":"规则：系统处理80%常规人为处理20%异常","color":"green"}]}]},{"title":"第3章·行为金融陷阱","level":"必修","points":[{"t":"四大认知偏差","c":"①确认偏差：只看支持自己观点的信息②近期偏差：过度权重最近事件③锚定效应：纠结买入价④处置效应：过早止盈过晚止损。","detail":"认知偏差是系统化交易最大的隐性敌人。克服方法：①写交易日记暴露偏差②回测客观数据不凭记忆③预设出场条件④定期复盘。Schwager发现最成功的交易员都有系统化克服偏差的机制。","highlights":[{"text":"核心：认知偏差是隐性敌人——用系统克服","color":"gold"},{"text":"方法：写交易日记+预设条件+定期复盘","color":"blue"}]}]},{"title":"第4章·多时间框架与多策略","level":"推荐","points":[{"t":"三时段协同","c":"周线定方向(战略)日线选时机(战术)小时线精准入场(执行)。三时段同向=重仓。方向冲突=观望或轻仓。","detail":"多数散户只看一个时间框架——如同只用一只眼看三维世界。周线多头+日线回调+小时线突破回调高点=完美入场。不同时间段不同角色不可混淆。","highlights":[{"text":"规则：三时段同向=重仓,冲突=观望","color":"green"}]},{"t":"策略组合思维","c":"单策略有失效周期。2-3个低相关策略组合=平滑曲线提高夏普率。趋势跟踪+均值回归=互补黄金组合。","detail":"趋势策略在震荡市亏钱均值回归在趋势市亏钱——两者组合=任一市场环境都有盈利策略。关键是策略间相关性<0.3。相关性>0.5=伪分散。定期评估各策略表现。","highlights":[{"text":"核心：趋势+均值回归=互补黄金组合","color":"gold"},{"text":"方法：策略组合思维——反复练习","color":"blue"}]}]}],"knowledge_cards":[{"t":"系统化交易的优势边界","c":"系统化交易的本质：将决策从情绪中剥离。优势：可回测验证、可复制执行、可量化优化。劣势：市场结构性变化时系统可能失效（过拟合）、黑天鹅事件超越系统设计范围。最优方案：80%机械执行+20%人为监督。系统负责处理常规市场——人为负责识别系统性变化和极端事件。","type":"concept"},{"t":"系统化交易核心原则","c":"①规则可编程执行（不能有模糊判断）②风险预先定义（每笔交易前已知最大亏损）③系统整体正期望值（回测验证）④至少经历一轮完整牛熊周期回测⑤实盘从最小仓位开始验证6个月。满足以上五条的才可投入实盘。任何一条不满足的系统都只是纸上谈兵。","type":"rule"}],"quotes":["交易系统就像汽车——即使最好的车也需要好司机。","在这个行业中，你可以做对一切仍然亏钱——这就是风险的本质。"],"practice":["写出交易计划——80%机械规则+20%人为判断","记录一周内所有因情绪违反规则的交易并标注偏差类型"]},{"id":"b33","title":"黑天鹅","author":"Nassim Taleb","category":"投资哲学","stage":6,"diff":4,"hours":14,"summary":"真正改变世界的是罕见不可预测影响巨大的黑天鹅。正态分布建模=致命。","chapters":[{"title":"第1章·极端斯坦","level":"必修","points":[{"t":"平均vs极端","c":"平均斯坦(身高体重)=正态分布适用。极端斯坦(财富金融)=少数极端值决定一切正态分布失效。","detail":"1987黑色星期一2008危机COVID——每个都是正态认为几亿年一遇。用正态管风险=玩俄罗斯轮盘。","highlights":[{"text":"核心：金融市场=极端斯坦","color":"gold"},{"text":"方法：平均vs极端——反复练习","color":"blue"}]}]},{"title":"第2章·杠铃策略","level":"必修","points":[{"t":"90/10配置","c":"90%极度安全(国债现金)10%极度冒险(期权风投)。中间全避开=有限下行+无限上行。","detail":"90%保证不死10%博正黑天鹅。中等风险既不能保命也不暴富。永远不满仓永远不杠杆。","highlights":[{"text":"规则：杠铃=90/10=保命+暴富","color":"green"}]}]},{"title":"第3章·预测的荒谬性","level":"必修","points":[{"t":"为什么专家预测不如抛硬币","c":"Tetlock研究284位专家20年284000条预测——准确率≈黑猩猩随机扔飞镖。专家在极端事件预测上尤其糟糕。","detail":"越是复杂的系统预测越无意义。金融市场受无数变量交互影响——任何模型都是对现实的极端简化。塔勒布：预测者的真正功能不是预测——是用复杂术语让你相信他们知道一些他们不知道的事。","highlights":[{"text":"警示：284位专家20年预测≈随机飞镖","color":"red"},{"text":"洞见：预测者的功能是说服而非预测","color":"purple"}]},{"t":"火鸡问题","c":"火鸡被喂养1000天——每天确认人类善良。第1001天=感恩节=黑天鹅。历史数据越长越容易产生虚假安全感。","detail":"火鸡从历史数据得出的结论完全正确但致命。同理：连续10年牛市的数据让你确信股票永远涨——直到它不涨。安全感与真实安全性呈反向关系——越觉得安全越危险。","highlights":[{"text":"核心：安全感与真实安全性反相关","color":"gold"},{"text":"警示：火鸡问题不可忽视","color":"red"}]}]},{"title":"第4章·如何在黑天鹅中获益","level":"必修","points":[{"t":"做多波动率策略","c":"组合中配置1-5%虚值期权——平时小亏黑天鹅时100倍+回报。90%时间亏小钱10%时间赚大钱=正期望。","detail":"塔勒布的交易策略核心：持续购买便宜的虚值看跌/看涨期权。大多数到期归零但一次黑天鹅收益覆盖全部成本并巨赚。2008年Universa基金(塔勒布顾问)回报115%——同期标普跌37%。","highlights":[{"text":"策略：虚值期权=有限下行+黑天鹅无限上行","color":"green"},{"text":"实证：2008年+115% vs 标普-37%","color":"gold"}]},{"t":"构建反脆弱投资组合","c":"80%极度安全资产(短期国债黄金现金)+20%高风险高凸性资产(虚值期权风投)。中间地带资产=零配置。","detail":"中间地带=看似安全实则脆弱的资产(企业债高收益债银行理财)——黑天鹅来临时流动性枯竭价格暴跌。杠铃策略的根本逻辑：要么绝对安全要么绝对冒险——避开伪安全的中间地带。","highlights":[{"text":"核心：绝对安全+绝对冒险=避开伪安全中间","color":"gold"},{"text":"方法：构建反脆弱投资组合——反复练习","color":"blue"}]}]}],"knowledge_cards":[{"t":"极端斯坦vs平均斯坦","c":"平均斯坦(Mediocristan)：个体偏离均值有限——身高体重智商。极端斯坦(Extremistan)：少数极端值决定一切——财富金融图书销量。金融市场属于极端斯坦：一次黑天鹅事件的影响超过10年常规波动之和。用平均斯坦的工具(正态分布)管理极端斯坦的风险=用渔网捕鲸——工具与对象根本错配。","type":"concept"},{"t":"杠铃策略配置法","c":"①80-90%配置极度安全资产：短期国债+黄金+现金（不追求收益只追求生存）②10-20%配置高风险高凸性资产：虚值期权+风投+加密货币（有限下行+无限上行）③中间地带资产=0配置：企业债、银行理财、REITs等伪安全资产。杠铃策略的精髓：不在中间地带浪费资金——要么绝对安全要么绝对冒险。","type":"rule"}],"quotes":["不要试图预测黑天鹅，而要让你自己从不确定性中获益。","你永远不会知道未来会怎样——但你可以为任何未来做好准备。"],"practice":["用Excel模拟10000次随机投资结果观察幸存者分布","计算自己组合在黑天鹅下的最大可能亏损上限"]},{"id":"b34","title":"反脆弱","author":"Nassim Taleb","category":"投资哲学","stage":6,"diff":4,"hours":14,"summary":"有些系统在压力波动混乱中反而变强——反脆弱。构建反脆弱投资组合。","chapters":[{"title":"第1章·脆弱vs反脆弱","level":"必修","points":[{"t":"三种状态","c":"脆弱=波动受损坚韧=波动不变反脆弱=波动获益。好系统=反脆弱的。","detail":"市场波动加大反而赚更多=反脆弱。只在牛市赚钱=脆弱。问：波动加大50%还能盈利？","highlights":[{"text":"核心：反脆弱=在波动中变强","color":"gold"},{"text":"方法：三种状态——反复练习","color":"blue"}]}]},{"title":"第2章·凸性效应","level":"推荐","points":[{"t":"损失有限+收益无限","c":"损失有限+收益无限=凸性(好)。做多=凸性裸做空=凹性。现金=终极反脆弱选择权。永远不all in。","detail":"保留可选择性。留余地在新信息出现后调整。","highlights":[{"text":"核心：可选择性=反脆弱核心","color":"gold"},{"text":"方法：损失有限+收益无限——反复练习","color":"blue"}]}]},{"title":"第3章·否定法与少即是多","level":"必修","points":[{"t":"通过减法变强","c":"反脆弱的核心方法：不去预测什么会成功——消除什么会致命。去掉脆弱性=自动反脆弱。饮食去掉糖>寻找超级食物。","detail":"投资应用：去掉杠杆→自动反脆弱。去掉单只重仓→自动分散。去掉频繁交易→自动降低成本。减少不如增加性感——但减法比加法有效得多。不求做对什么先求不做错什么。","highlights":[{"text":"核心：消除脆弱性=自动反脆弱","color":"gold"},{"text":"方法：去掉杠杆+分散+低频=反脆弱组合","color":"blue"}]}]},{"title":"第4章·林迪效应与时间检验","level":"推荐","points":[{"t":"老东西更长寿","c":"林迪效应：一本书已存活100年→预计再存活100年。新技术存活1年→预计再存活1年。越老的东西预期剩余寿命越长。","detail":"投资启示：已被验证100年的投资原则(安全边际分散长期持有)比最新量化策略更可能在未来继续有效。时间是终极过滤器——经得起时间检验的才是真知识。新策略需至少一个牛熊周期验证。","highlights":[{"text":"核心：经得起时间检验的才是真知识","color":"gold"},{"text":"规则：新策略需至少一个牛熊周期验证","color":"green"}]},{"t":"可选择性的数学优势","c":"可选择性=更多尝试+更低试错成本=更高找到凸性机会的概率。分散试错本身就是反脆弱策略。","detail":"风投模型=反脆弱：投100个各投$10万——99个归零亏$990万1个回报$1亿净赚$9010万。交易同理：多笔小仓位试错+少数大盈利覆盖全部成本。关键：每次试错成本必须可控。","highlights":[{"text":"核心：更多尝试+更低试错成本=更高成功概率","color":"gold"},{"text":"方法：可选择性的数学优势——反复练习","color":"blue"}]}]}],"knowledge_cards":[{"t":"反脆弱三元结构","c":"脆弱(Fragile)=波动受损：杠杆过度的投资组合、裸做空、集中重仓单一品种。坚韧(Robust)=波动不变：分散化的指数基金、多元化资产配置。反脆弱(Antifragile)=波动获益：持有虚值期权(波动越大越赚)、拥有现金可选权(暴跌后可抄底)、做多波动率策略。三类状态的判断标准：波动加大你的资产会发生什么？","type":"concept"},{"t":"反脆弱自检清单","c":"四个问题检验你的组合是否反脆弱：①如果波动率突然增加50%你的组合状态会更好还是更差？②如果发生从未见过的极端事件你有应对方案吗？③如果所有持仓同时下跌30%你还能继续交易吗？④你的策略在哪种市场环境中会失效？四条中有任何一条答案不乐观=组合存在致命脆弱性需要立即调整。","type":"rule"}],"quotes":["风会吹灭蜡烛，却能让火燃烧得更旺。","大自然最喜欢的是——那些在被打击后变得更强的事物。"],"practice":["用反脆弱四问检验自己的投资组合逐条回答","列出组合中所有伪安全资产并制定替换计划"]},{"id":"b35","title":"随机漫步的傻瓜","author":"Nassim Taleb","category":"交易心理","stage":1,"diff":2,"hours":10,"summary":"塔勒布处女作。揭示我们如何被随机性愚弄——把运气当能力、把噪音当信号。读完后对所有投资大师产生深刻怀疑。","chapters":[{"title":"第1章·幸存者偏差","level":"必修","points":[{"t":"猴子的故事","c":"1000只猴子投硬币总有一只连续10次正面——那只猴子认为自己有特殊能力。这就是很多投资大师的真相。","detail":"你只看到成功的幸存者，看不到失败的99%。某基金连续5年跑赢可能纯粹靠运气——初始1000只可能950只已消失。","highlights":[{"text":"核心：你只看到幸存者——看不到失败者","color":"gold"},{"text":"方法：猴子的故事——反复练习","color":"blue"}]}]},{"title":"第2章·噪音vs信号","level":"必修","points":[{"t":"区分方法","c":"有因果逻辑+持续时间长+可重复=信号。无因果+时间短+不可重复=噪音。","detail":"问自己：①为什么存在这个规律？②持续了多久？③反过来做会怎样？三个都答不上=噪音。","highlights":[{"text":"规则：信号=因果+时间+可重复","color":"green"}]}]},{"title":"第3章·被随机性愚弄","level":"推荐","points":[{"t":"生活中的随机性","c":"把运气当能力是人类最普遍的认知偏差。成功时归因于自己，失败时归因于运气——但往往相反。","detail":"塔勒布建议：对任何声称能预测市场的人保持根本性怀疑。没有人能持续预测——如果有，他已经是世界首富了。","highlights":[{"text":"思考：你崇拜的大师是实力还是运气？","color":"purple"},{"text":"方法：生活中的随机性——反复练习","color":"blue"}]}]},{"title":"第4章·概率思维的日常训练","level":"必修","points":[{"t":"替代历史思维","c":"每次看到结果问：有多少种其他可能的结果？如果重来1000次这个结果出现的概率是多少？训练自己用概率视角看世界。","detail":"塔勒布的核心思维工具：考虑已发生事件的所有可能替代路径。某基金经理连续3年跑赢——问：初始1000名基金经理中3年连续跑赢的概率分布？至少几个纯靠运气。替代路径思维=概率思维的基础训练。","highlights":[{"text":"方法：每次问——还有其他可能结果吗？","color":"blue"},{"text":"核心：概率思维=考虑所有替代路径","color":"gold"}]},{"t":"遍历性与时间概率","c":"遍历性：群体平均值≠个体长期结果。100人赌一次期望为正≠你赌100次期望为正——可能第50次就爆仓了。","detail":"经典谬误：某策略年化20%=每年安心取20%生活。错误——如果第1年亏30%你不仅没钱生活本金也缩水。时间序列风险(路径依赖)完全不同于截面风险。生存是第一位的。","highlights":[{"text":"警示：群体平均值≠个体长期结果","color":"red"},{"text":"核心：生存第一——考虑路径依赖风险","color":"gold"}]}]}],"knowledge_cards":[{"t":"幸存者偏差的数学","c":"假设10000名基金经理每人纯靠运气管理基金。期望50%跑赢基准。第一年5000人跑赢。第二年2500人。第三年1250人。第十年约10人连续跑赢。这10人会被媒体称为天才——但他们只是幸运的硬币投掷者。幸存者偏差让你只看到成功案例——看不到坟墓里的失败者。每次看到成功故事必问：初始样本有多大？失败者在哪里？","type":"concept"},{"t":"噪音过滤三步法","c":"①因果测试：这个规律有合理的因果逻辑吗？（无法解释因果=噪音概率大）②时间测试：这个规律持续了多久？（<1年=极可能是随机波动）③反转测试：反过来解释能说得通吗？（涨因为流动性放松——跌也因为流动性？=事后合理化）三步中任一步不通过=视为噪音放弃该信号。每天练习用三步法过滤一个市场观点。","type":"rule"}],"quotes":["我们更容易被随机性愚弄，而不是被复杂性愚弄。","如果你把一群猴子放在打字机前，总会有一只打出《哈姆雷特》——但这不意味着它会打出下一部。"],"practice":["每天用三步噪音过滤法分析一篇市场评论","列出最近3次把运气当能力的交易反思偏差"]},{"id":"b36","title":"价值","author":"张磊","category":"价值投资","stage":6,"diff":3,"hours":12,"summary":"高瓴资本创始人张磊投资哲学。长期主义+研究驱动+价值创造。","chapters":[{"title":"第1章·长期主义","level":"必修","points":[{"t":"流水不争先","c":"真大钱不靠短期交易——靠长期持有最优秀公司。高瓴平均持股7-10年。","detail":"寻找未来10-20年行业：消费升级医疗健康新能源企业服务先进制造。投进去不轻易出来。","highlights":[{"text":"核心：长期主义=10年持有","color":"gold"},{"text":"方法：流水不争先——反复练习","color":"blue"}]}]},{"title":"第2章·动态护城河","level":"推荐","points":[{"t":"创新能力=真护城河","c":"传统静态护城河在变革时代不可靠。柯达有最强胶片品牌——数码一出全没了。","detail":"只有持续创新企业有真正护城河。价值投资不是守旧——是找到能持续创造价值的企业。","highlights":[{"text":"核心：动态护城河=持续创新","color":"gold"},{"text":"方法：创新能力=真护城河——反复练习","color":"blue"}]}]},{"title":"第3章·研究驱动深度认知","level":"必修","points":[{"t":"研究≥3个月才决策","c":"高瓴团队对每家公司至少研究3个月以上才决策。深度研究=读财报+实地调研+访谈高管客户供应商+行业专家验证。","detail":"张磊：绝大多数人花在选股上的时间不如花在选餐馆上的时间。深度研究建立认知优势——当市场恐慌时你的认知让你敢于逆势加仓。信息人人可得洞察必须深挖。","highlights":[{"text":"核心：深度研究=认知优势=逆势加仓信心","color":"gold"},{"text":"警示：选股时间不如选餐馆时间=亏损根源","color":"red"}]},{"t":"第一性原理思维","c":"不问市场认为它值多少——问这个生意的本质价值是什么。穿透财务数据看到商业模式底层逻辑。","detail":"高瓴投京东时市场质疑其亏损。张磊看到：自建物流=不可复制的护城河+用户体验壁垒。本质判断超越当期财务——研究本质而非表象。问：如果这家公司明天私有化你愿意多少钱买下整个公司？","highlights":[{"text":"核心：穿透财务看到商业模式底层逻辑","color":"gold"},{"text":"方法：第一性原理思维——反复练习","color":"blue"}]}]},{"title":"第4章·价值创造者生态","level":"推荐","points":[{"t":"从发现价值到创造价值","c":"传统价值投资=发现低估买入等待回归。高瓴升级版=投后赋能帮助被投企业创造增量价值让蛋糕变大。","detail":"纯粹的财务投资者是价值的寄生虫。高瓴提供数字化赋能+管理升级+人才引进+战略梳理——把被投企业从1做到10。投资不是零和博弈是价值共创。交易者也应思考：你的入场为市场提供了什么？","highlights":[{"text":"洞见：投资不是零和博弈——是价值共创","color":"purple"},{"text":"核心：从发现价值→创造增量价值","color":"gold"}]}]}],"knowledge_cards":[{"t":"长期主义的底层逻辑","c":"长期主义不是简单的持有时间长——是选择被时间偏爱的商业模式。具有网络效应、规模效应、品牌护城河的企业——时间是其朋友而非敌人。每年竞争优势增强而非减弱。高瓴选择企业的核心标准：10年后这家公司比今天更强吗？如果答案是肯定的——短期波动都是噪音。现金流折现模型中90%价值在10年以后。","type":"concept"},{"t":"深度研究决策框架","c":"①企业所处行业赛道是否10年以上存在②是否行业前2-3名有定价权③管理层诚信且有企业家精神④预估持股周期至少5年⑤研究时间至少3个月以上涵盖至少一次季报周期⑥与企业上下游、客户、竞争对手交叉验证。六条全部满足才进入投资决策流程。任何一条存疑=继续研究或放弃。","type":"rule"}],"quotes":["流水不争先，争的是滔滔不绝。","在长期主义之路上，与伟大格局观者同行，做时间的朋友。"],"practice":["选一家公司做3个月深度研究跟踪写研究日志","用第一性原理重新评估你持仓中最大的一笔投资"]},{"id":"b37","title":"投资中最简单的事","author":"邱国鹭","category":"价值投资","stage":6,"diff":2,"hours":10,"summary":"高毅资产创始人20年浓缩。便宜是硬道理+定价权+胜而后战。","chapters":[{"title":"第1章·三好框架","level":"必修","points":[{"t":"好生意+好公司+好价格","c":"好生意：毛利率>30%ROE>15%自由现金流正。好公司：双增+管理层持股。好价格：PE<行业均值20%。","detail":"买入价格=你唯一保护。价格够低=犯错空间大。价格太高=必须永远对。把安全边际留足。","highlights":[{"text":"核心：三好=好生意+好公司+好价格","color":"gold"},{"text":"方法：好生意+好公司+好价格——反复练习","color":"blue"}]}]},{"title":"第2章·宁数月亮","level":"推荐","points":[{"t":"选龙头不选跟风","c":"行业第一第二不选小公司。龙头有定价权小公司被动接受价格。定价权=最强护城河。","detail":"能涨价而不流失客户=真护城河。茅台提价照样卖完——最强竞争力。","highlights":[{"text":"核心：定价权=最强护城河","color":"gold"},{"text":"方法：选龙头不选跟风——反复练习","color":"blue"}]}]},{"title":"第3章·安全边际量化","level":"必修","points":[{"t":"便宜是硬道理","c":"买入价决定最终收益的70%+。PE<历史均值30%以下+PB<2+股息率>3%=深度安全边际。价格够低=犯错空间大。","detail":"邱国鹭：再好的公司买贵了也赚不到钱。沃尔玛$100是好公司$30是伟大投资。安全边际给你三重保护：①估值修复收益②企业成长收益③估值下行的缓冲空间。永远留足安全边际。","highlights":[{"text":"核心：买入价决定最终收益70%+","color":"gold"},{"text":"规则：PE<历史均值30%+PB<2+股息率>3%","color":"green"}]},{"t":"三低一高选股法","c":"低PE+低PB+低PEG+高股息=四重安全边际。四项全部满足=深度价值+下行空间有限+上行空间打开。","detail":"邱国鹭用量化标准筛选A股：PE<15+PB<1.5+PEG<1+股息率>2%。这个组合历史上年化跑赢指数5-8%回撤更小。简单≠无效——简单且纪律执行=有效。复杂的模型往往过度拟合历史。","highlights":[{"text":"核心：简单≠无效——简单+纪律=有效","color":"gold"},{"text":"方法：三低一高选股法——反复练习","color":"blue"}]}]},{"title":"第4章·逆向投资的时机","level":"推荐","points":[{"t":"胜而后战","c":"不在行业低谷猜底——等龙头公司已经开始盈利改善再入场。等待确定性改善=放弃最低价换更高确定性。","detail":"邱国鹭在2013-2014白酒塑化剂危机后没有立即抄底——等贵州茅台盈利改善信号出现后才重仓。鱼头不吃吃鱼身——放弃底部10-15%涨幅换取更高确定性。耐心等待是最被低估的投资能力。","highlights":[{"text":"策略：放弃最低价换更高确定性=吃鱼身","color":"green"},{"text":"核心：耐心等待是最被低估的能力","color":"gold"}]},{"t":"人多的地方不去","c":"热门赛道+高估值+一致预期=危险组合。无人问津+低估值+分歧大=机会组合。逆向不是为反而反——是独立思考远离人群。","detail":"逆向投资最大障碍：从众压力。别人都在赚的时候你空仓=心理折磨。但回顾历史：每次一致性极端乐观后=大跌前兆。关键指标：新基金发行量激增+媒体天天报牛市=危险信号。","highlights":[{"text":"警示：新基金暴增+媒体天天牛市=危险信号","color":"red"},{"text":"核心：逆向=独立思考远离人群","color":"gold"}]}]}],"knowledge_cards":[{"t":"安全边际的数学意义","c":"安全边际不只是便宜——是概率优势。如果你估计企业内在价值100元但估值可能高估20%，那么以50元买入即使你的估值错误仍有安全空间。安全边际=为认知不足购买的保险。格雷厄姆公式：安全边际=1-(买入价÷保守估算的内在价值)。>30%=较大安全边际。投资第一课不是如何赚钱——是如何不亏钱。","type":"concept"},{"t":"三好选股量化清单","c":"好生意：毛利率>30%(有定价权)+ROE>15%(资本效率高)+自由现金流为正(真赚钱非纸面利润)。好公司：营收利润双增20%+(成长性)+管理层持股/增持(利益一致)+持续分红(现金流真实)。好价格：PE<行业均值20%+PB<行业均值+PEG<1。三好全部满足=深度价值买点。缺任一=等待更好时机。","type":"rule"}],"quotes":["投资应该是简单的事——好生意、好公司、好价格。","宁数月亮，不数星星——选龙头不选跟风。"],"practice":["用三好标准筛选当前全市场给出评分排序","记录逆向买入时的市场情绪数据建立逆向指标"]}],"stages":[{"id":"s1","name":"一阶·交易心智启蒙","icon":"🧠","sub":"建立正确的市场观","desc":"从利弗莫尔传奇到概率思维——先改造大脑再谈技术。这一阶段的所有内容都在回答一个问题：你凭什么能在这个市场上赚钱？","books":["b06","b17","b07","b35"]},{"id":"s2","name":"二阶·技术分析基石","icon":"📊","sub":"K线→趋势→形态→指标","desc":"按道氏理论→蜡烛图→形态学→指标体系的顺序，从最基础的价格语言学到完整的技术分析工具链。先看懂图再说交易。","books":["b09","b01","b02","b03","b30"]},{"id":"s3","name":"三阶·分析框架与系统","icon":"⚙️","sub":"从分析到执行的闭环","desc":"学了技术不等于会交易。这一阶段教你如何把技术工具整合成可执行的交易系统——三重滤网、海龟系统、123法则——从分析到下单的完整流程。","books":["b04","b05","b08","b28","b20","b13"]},{"id":"s4","name":"四阶·策略构建与风控","icon":"🎯","sub":"找到你的盈利模式","desc":"学会走路后开始学跑步。专精一种策略(突破/动量/形态选股)，建立日常流程，用金字塔加仓放大收益。从'不亏钱'进化到'赚钱'。","books":["b14","b19","b29","b12","b31","b32","b10"]},{"id":"s5","name":"五阶·市场微观与投资哲学","icon":"🔬","sub":"穿透表象看本质","desc":"威科夫追踪聪明钱、索罗斯反身性理解泡沫、芒格多元思维——从市场微观结构到宏观哲学，建立你自己的投资世界观。","books":["b11","b25","b26","b27","b24"]},{"id":"s6","name":"六阶·价值投资与复利人生","icon":"🏛️","sub":"从交易员到投资者","desc":"交易让你活着，投资让你富有。格雷厄姆安全边际、巴菲特护城河、塔勒布杠铃策略——最终目标是构建能穿越周期的长期财富体系。","books":["b15","b16","b23","b21","b22","b33","b34","b36","b37","b18"]}],"edges":[{"from":"b06","to":"b17","type":"相似","label":"交易心态"},{"from":"b07","to":"b35","type":"相似","label":"概率思维"},{"from":"b03","to":"b30","type":"相似","label":"形态+指标"},{"from":"b04","to":"b30","type":"相似","label":"完整框架"},{"from":"b08","to":"b28","type":"相似","label":"系统化"},{"from":"b21","to":"b22","type":"相似","label":"林奇体系"},{"from":"b31","to":"b32","type":"相似","label":"大师访谈"},{"from":"b15","to":"b16","type":"相似","label":"格雷厄姆"},{"from":"b33","to":"b34","type":"相似","label":"塔勒布系列"},{"from":"b01","to":"b03","type":"互补","label":"K线+形态"},{"from":"b05","to":"b14","type":"互补","label":"系统+流程"},{"from":"b08","to":"b13","type":"互补","label":"系统+资金"},{"from":"b13","to":"b14","type":"互补","label":"资金+执行"},{"from":"b20","to":"b28","type":"互补","label":"防守+进攻"},{"from":"b10","to":"b11","type":"互补","label":"波浪+供需"},{"from":"b23","to":"b24","type":"互补","label":"巴菲特+芒格"},{"from":"b25","to":"b24","type":"互补","label":"投资+思维"},{"from":"b36","to":"b37","type":"互补","label":"PE+本土"},{"from":"b01","to":"b02","type":"进阶","label":"基础→高级"},{"from":"b09","to":"b03","type":"进阶","label":"理论→形态"},{"from":"b06","to":"b19","type":"进阶","label":"传记→操盘"},{"from":"b03","to":"b04","type":"进阶","label":"形态→框架"},{"from":"b08","to":"b19","type":"进阶","label":"系统→纪律"},{"from":"b15","to":"b23","type":"进阶","label":"格雷厄姆→巴菲特"},{"from":"b16","to":"b23","type":"进阶","label":"格雷厄姆→巴菲特"},{"from":"b12","to":"b29","type":"进阶","label":"CANSLIM→SEPA"},{"from":"b34","to":"b35","type":"进阶","label":"反脆弱→随机"},{"from":"b06","to":"b07","type":"对立","label":"直觉vs概率"},{"from":"b08","to":"b29","type":"对立","label":"跟踪vs动量"},{"from":"b15","to":"b29","type":"对立","label":"价值vs动量"},{"from":"b25","to":"b23","type":"对立","label":"防御vs成长"},{"from":"b26","to":"b27","type":"对立","label":"反身性vs机器"},{"from":"b09","to":"b10","type":"奠基","label":"理论起点"},{"from":"b06","to":"b09","type":"奠基","label":"直觉→理论"},{"from":"b24","to":"b33","type":"奠基","label":"思维→风险"}]}
</script>
