<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KLineMaster · 交易理论大集合</title>
<style>
:root{--bg:#0a0e27;--card:#111640;--border:#1e2a4a;--text:#c8d0e0;--gold:#f0c040;--accent:#4da6ff;--green:#34d399;--red:#fb7185;--purple:#a78bfa;--muted:#6b7daa;--dim:#8899bb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.fb{padding:60px 20px;text-align:center}.fb h1{font-size:26px;color:var(--gold);margin-bottom:12px}.fb p{color:var(--dim);font-size:14px}
.dot{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:50%;margin:0 4px;animation:pl 1.2s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pl{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.app{display:none;max-width:1100px;margin:0 auto;padding:0 14px 40px}
.js-ready .fb{display:none}.js-ready .app{display:block}
.hd{padding:22px 0;text-align:center;border-bottom:1px solid var(--border);margin-bottom:16px}
.hd h1{font-size:30px;font-weight:800;color:var(--gold);letter-spacing:2px}
.hd .sub{color:var(--muted);font-size:13px;margin-top:2px}
.hd .sts{display:flex;justify-content:center;gap:22px;margin-top:10px;flex-wrap:wrap}
.si{text-align:center}.sn{font-size:22px;font-weight:800;color:var(--accent)}.sl{font-size:10px;color:var(--muted)}
.tbs{display:flex;gap:0;margin-bottom:16px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.tb{flex:1;padding:12px 6px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.2s;text-align:center}
.tb:hover{color:var(--text);background:rgba(255,255,255,.03)}.tb.on{color:var(--gold);background:rgba(240,192,64,.08)}
.tb .ti{display:block;font-size:18px;margin-bottom:1px}
.pn{display:none}.pn.show{display:block}

/* stage cards */
.sc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px;transition:.2s}
.sc:hover{border-color:var(--accent)}
.sc .si2{font-size:32px;margin-bottom:4px}.sc .sn2{font-size:18px;font-weight:800;color:var(--gold)}.sc .ss{font-size:12px;color:var(--accent);margin-bottom:4px}
.sc .sd{font-size:12px;color:var(--dim);margin-bottom:10px;line-height:1.6}
.sc .sbs{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(77,166,255,.12);color:var(--accent);border:1px solid rgba(77,166,255,.2);cursor:pointer;transition:.15s}
.chip:hover{background:rgba(77,166,255,.25)}.chip.read{background:rgba(52,211,153,.1);color:var(--green);border-color:rgba(52,211,153,.2)}
.sp{font-size:11px;color:var(--muted);margin-top:7px}.pb{height:3px;background:#1e2a4a;border-radius:2px;margin-top:2px;overflow:hidden}.pf{height:100%;background:var(--green);border-radius:2px;transition:.3s}

/* library */
.lc{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ls{flex:1;min-width:150px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px}
.ls:focus{outline:none;border-color:var(--accent)}
.lf{padding:9px 10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;cursor:pointer}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.bc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px;cursor:pointer;transition:.15s;position:relative}
.bc:hover{border-color:var(--accent);transform:translateY(-1px)}.bc.done{opacity:.5}
.bc .bt{font-size:14px;font-weight:700;color:var(--gold)}.bc .ba{font-size:11px;color:var(--muted);margin-bottom:4px}
.bc .bs{font-size:11px;color:var(--dim);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.bc .bm{display:flex;gap:10px;font-size:10px;color:var(--muted)}
.bc .bg{font-size:9px;padding:2px 7px;border-radius:8px;background:rgba(77,166,255,.12);color:var(--accent);position:absolute;top:10px;right:10px}
.bc .bp{font-size:9px;color:var(--green);margin-top:2px}

/* modal */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mc{background:var(--bg);border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.mh{position:sticky;top:0;background:var(--bg);padding:15px 18px;border-bottom:1px solid var(--border);z-index:10}
.mx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mx:hover{border-color:var(--red);color:var(--red)}
.mt{font-size:18px;font-weight:800;color:var(--gold)}.ms{font-size:11px;color:var(--accent);margin-top:2px}
.br{display:flex;gap:5px;align-items:center;font-size:10px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.br a{color:var(--accent);cursor:pointer}.br span{color:var(--dim)}
.stbs{display:flex;gap:0;margin-top:8px}
.stb{flex:1;padding:7px;border:none;background:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;text-align:center}
.stb.on{color:var(--gold);border-bottom-color:var(--gold)}
.mb{padding:10px 18px 18px}

/* chapters */
.ci{margin-bottom:1px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--card)}
.ch{padding:10px 14px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.15s}
.ch:hover{background:rgba(255,255,255,.03)}
.ch .cn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:#1a2040;color:var(--muted)}
.ch .cn.done{background:rgba(52,211,153,.15);color:var(--green)}
.ch .ct{flex:1;font-size:12px;font-weight:600}
.ch .cl{font-size:9px;padding:1px 6px;border-radius:6px;font-weight:600;margin-right:4px}
.ch .cl.must{background:rgba(240,192,64,.15);color:var(--gold)}
.ch .cl.rec{background:rgba(77,166,255,.12);color:var(--accent)}
.ch .cl.opt{background:rgba(107,125,170,.12);color:var(--muted)}
.ch .ca{font-size:10px;color:var(--muted);transition:.2s}.ch.open .ca{transform:rotate(180deg)}
.cb{display:none;padding:0 14px 10px 42px}.cb.open{display:block}
.pti{margin-bottom:8px}
.ptt{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.ptc{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:3px}
.ptd{font-size:11px;color:var(--text);line-height:1.6;margin-bottom:5px}
.hlb{border-left:3px solid;padding:5px 9px;margin:3px 0;border-radius:0 5px 5px 0;font-size:10px;line-height:1.5;background:rgba(255,255,255,.03)}
.hlb.g{border-color:var(--gold)}.hlb.b{border-color:var(--accent)}.hlb.r{border-color:var(--red)}.hlb.gr{border-color:var(--green)}.hlb.p{border-color:var(--purple)}

/* cards */
.kc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:7px}
.kt{display:inline-block;font-size:9px;padding:2px 7px;border-radius:6px;margin-bottom:4px;font-weight:600}
.kt.concept{background:rgba(77,166,255,.15);color:var(--accent)}.kt.rule{background:rgba(52,211,153,.15);color:var(--green)}.kt.formula{background:rgba(240,192,64,.15);color:var(--gold)}
.kn{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:3px}.kc p{font-size:11px;color:var(--dim);line-height:1.6}
.qt{background:rgba(240,192,64,.04);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 7px 7px 0;margin-bottom:5px;font-style:italic;font-size:11px;color:#d0c090}
.pi{font-size:10px;color:var(--dim);padding:2px 0 2px 12px;position:relative}.pi::before{content:"▸";position:absolute;left:0;color:var(--accent)}

/* graph */
.gc{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.gl{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--border);justify-content:center}
.li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--dim)}.ld{width:8px;height:8px;border-radius:50%}
.ge{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);justify-content:center;flex-wrap:wrap}
.ge .el{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600}
.el.similar{background:rgba(52,211,153,.12);color:var(--green)}
.el.complement{background:rgba(77,166,255,.12);color:var(--accent)}
.el.extends{background:rgba(240,192,64,.12);color:var(--gold)}
.el.contrast{background:rgba(251,113,133,.12);color:var(--red)}
.el.foundation{background:rgba(167,139,250,.12);color:var(--purple)}

/* progress */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.pw{height:6px;background:#1e2a4a;border-radius:3px;overflow:hidden;flex:1;min-width:100px}
.pwf{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:.3s}
.pp{font-size:16px;font-weight:800;color:var(--gold)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px}
.pr{display:flex;align-items:center;gap:6px;padding:8px 11px;background:var(--card);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:.1s;font-size:11px}
.pr:hover{border-color:var(--accent)}
.pr .pbar{flex:1;height:2px;background:#1e2a4a;border-radius:1px;overflow:hidden}.pr .pbf{height:100%;background:var(--green);border-radius:1px}
.pr .pps{font-size:9px;color:var(--muted);width:24px;text-align:right}
.rst{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;cursor:pointer;margin-top:8px}
.rst:hover{border-color:var(--red);color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:8px 18px;border-radius:18px;font-size:11px;color:var(--text);z-index:200;animation:ti .3s;pointer-events:none}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:600px){.hd h1{font-size:21px}.tb{padding:9px 3px;font-size:10px}.tb .ti{font-size:15px}.lg{grid-template-columns:1fr}.pg{grid-template-columns:1fr}}
</style></head>

<script type="application/json" id="dt">
{"books":[{"id":"b01","title":"日本蜡烛图技术","author":"Steve Nison","category":"K线技术","stage":2,"diff":2,"hours":14,"summary":"K线分析奠基之作。系统讲解50多种蜡烛图形态的识别方法和市场含义。","chapters":[{"title":"第1章·K线构成与读法","level":"必修","points":[{"t":"一根K线的故事","c":"阳=收盘>开盘(买方胜)。阴=收盘<开盘(卖方胜)。实体=力道。影线=曾到达后被推回。","detail":"每根K线=完整微型故事：开盘=多空起始位。最高=多头最远。最低=空头最远。收盘=最终胜负。","highlights":[{"text":"核心：每根K线=完整多空博弈故事","color":"gold"}]}]},{"title":"第2章·单K线反转信号","level":"必修","points":[{"t":"锤子线与上吊线","c":"实体小+下影极长+上影极短。跌末=锤子(看涨)。涨末=上吊(看跌)。次日K线验证必需。","detail":"锤子逻辑：空头打下去后多头强力拉回收盘在开盘附近→底部可能。上吊反之。必须等次日确认。","highlights":[{"text":"规则：次日K线验证必不可少","color":"green"}]},{"t":"十字星","c":"开盘=收盘多空均衡。趋势末端=反转信号。长腿十字星+大成交量=最强信号。","detail":"十字星越长腿说明多空争夺越激烈，反转力越大。配合成交量放大=重要反转点。","highlights":[{"text":"核心：十字星+趋势末端=反转信号","color":"gold"}]}]},{"title":"第3章·双K与三K反转","level":"必修","points":[{"t":"吞没形态","c":"第二根实体完全吞没第一根。看涨吞没=阴线后更大阳线。吞没力度越大信号越强。","detail":"强吞没：吞没线实体≥被吞没线1.5倍+在支撑位+放量。胜率>65%。","highlights":[{"text":"核心：吞没=多空力量质变","color":"gold"}]},{"t":"启明星与黄昏星","c":"大阴→跳空小K→大阳(收复50%+)=启明星(看涨)。大阳→跳空小K→大阴(跌入50%+)=黄昏星(看跌)。","detail":"三根K线讲述：空头强→多空僵持→多头反攻的完整故事。第三天必需深入第一天50%+。","highlights":[{"text":"规则：第三天深入第一天50%+信号才有效","color":"green"}]}]},{"title":"第4章·多指标共振","level":"推荐","points":[{"t":"K线+指标共振","c":"单K线胜率约55%→K线+RSI共振约70%→K线+RSI+均线共振约80%。共振越多仓位越大。","detail":"最强共振组合：K线反转+RSI超买超卖+布林带触及上下轨+均线支撑阻力。","highlights":[{"text":"规则：共振越多信号越强仓位越大","color":"green"}]}]}],"knowledge_cards":[{"t":"锤子线三要素","c":"①跌势末端②下影≥实体2倍③上影极短④有成交量⑤次日阳线确认。五条件全满足反转概率>70%。","type":"rule"},{"t":"吞没形态强弱","c":"强(胜率>65%)：1.5倍实体+支撑位+放量+覆盖前几根。弱(<40%)：盘整中+实体差距不大+无量。","type":"rule"}],"quotes":["蜡烛图比任何图表形式都能更快揭示市场心理变化。","一根K线讲述的是完整的多空博弈故事。"],"practice":["结合成交量验证","多时间框架确认"]},{"id":"b02","title":"日本蜡烛图技术新解","author":"Steve Nison","category":"K线技术","stage":2,"diff":3,"hours":12,"summary":"进阶版。深入三山/三川、反击线等高级反转信号，增加蜡烛图与西方技术指标结合。","chapters":[{"title":"第1章·三山/三川形态","level":"必修","points":[{"t":"三山(头肩顶)","c":"三次冲击同一阻力区失败形成三重顶。中间略高=头部，跌破颈线确认顶部反转。","detail":"多头三次进攻均被空头击退，每次回落低点形成颈线支撑。第三次反弹无力创新高后跌破颈线——所有买入者被套牢，卖压集中释放导致加速下跌，是最可靠的顶部反转信号之一。","highlights":[{"text":"三山=多头三次进攻均告失败，空头占据主导","color":"gold"},{"text":"跌破颈线=多空力量彻底逆转的分水岭","color":"red"}]},{"t":"颈线测量法","c":"头部到颈线的垂直距离=跌破颈线后的最小下跌目标。非精确价位，是最小目标区域。","detail":"最经典的形态目标测算方法。若头部100元、颈线90元，则距离10元，最小目标=90-10=80元。实际走势常超过此目标，到达目标区域后需结合其他信号判断是否平仓。","highlights":[{"text":"最小目标=颈线-(头部-颈线)，非精确价位","color":"gold"}]}]},{"title":"第2章·反击线与平头形态","level":"必修","points":[{"t":"反击线(遭遇线)","c":"跳空后当日被反向推回收盘于前日收盘附近。多头/空头反击成功，反映极端情绪快速逆转。","detail":"比刺透形态更强——跳空幅度更大意味着初始动能更极端，而当日完全回补说明这股动能瞬间衰竭。牛市反击线=跳空低开后收于前日收盘附近，是强力买入信号。","highlights":[{"text":"反击=跳空后反向推回=动能瞬间衰竭","color":"gold"}]},{"t":"平头顶/底叠加","c":"多次冲击同一价位失败形成平头。平头顶+看跌吞没=强烈卖出。平头底+锤子线=强烈买入。","detail":"单一信号可靠度约60%，两个独立信号叠加后可靠度升至80%以上。平头确认了关键阻力/支撑位，吞没或锤子确认了反转动能，双重验证大幅降低假信号概率。","highlights":[{"text":"平头+其他反转信号共振=胜率提升20-30%","color":"green"}]}]},{"title":"第3章·蜡烛图与西方指标融合","level":"推荐","points":[{"t":"蜡烛图+RSI背离","c":"看涨吞没+RSI底背离=双确认买入。锤子线+MACD金叉=高胜率反弹信号。共振提升胜率。","detail":"蜡烛图提供精确的入场时点，西方指标提供趋势方向和动量确认。两者结合弥补了蜡烛图易出假信号的弱点——只有当指标也支持反转时才入场，过滤掉70%的噪音信号。","highlights":[{"text":"蜡烛定时机+指标定方向=概率倍增","color":"blue"},{"text":"单一工具盲点靠多工具互补消除","color":"purple"}]},{"t":"成交量验证蜡烛信号","c":"所有反转蜡烛形态必须放量确认。看涨吞没缩量=不可靠反弹。锤子线放量=主力接盘。","detail":"成交量是蜡烛信号的判官。放量意味着大资金参与、方向真实；缩量意味着散户行为、方向不可持续。Nison强调：没有量配合的蜡烛形态，失败率超过50%。","highlights":[{"text":"无量的蜡烛信号=不可靠的噪音","color":"red"}]}]},{"title":"第4章·多时间框架蜡烛分析","level":"推荐","points":[{"t":"三周期共振法则","c":"周线定战略方向→日线找反转信号→小时线精确入场。三个周期蜡烛信号同向=最高胜率。","detail":"周线出现锤子线=大周期底部信号，日线出现看涨吞没=中周期确认，小时线突破=精确入场点。三重时间框架的蜡烛信号共振，是Nison体系中最强级别的交易信号。","highlights":[{"text":"周线锤子+日线吞没+小时突破=最强做多信号","color":"gold"}]}]}],"knowledge_cards":[{"t":"三山颈线测量公式","c":"头部最高点到颈线的垂直距离=突破后最小跌幅目标。不是精确价位而是最小目标区域，实际跌幅往往超过此值。到达目标后结合K线反转信号分批平仓。适用所有头肩类形态。","type":"formula"},{"t":"蜡烛+指标双重确认法则","c":"看涨蜡烛信号出现后，检查RSI是否底背离、MACD是否金叉、成交量是否放大。三者至少满足两项才入场。单一蜡烛形态胜率仅55-60%，双重确认可提升至75%以上。这是Nison进阶体系的核心——决不只靠一根K线做决策。","type":"rule"},{"t":"反击线识别要点","c":"牛市反击线：①前一根为长阴线②当日跳空低开③当日收于前日收盘附近④形成长阳实体。放量则信号更强。与刺透形态区别：反击线收盘更接近前日收盘，且跳空幅度更大，反映更剧烈情绪反转。","type":"concept"}],"quotes":["最好的交易信号来自多种技术工具的共振，而非单一形态。","成交量是所有蜡烛图信号的最终裁判——没有量，形态就是空壳。","学会识别反转蜡烛形态只是入门，学会等待确认信号才是进阶。"],"practice":["多指标共振策略","三周期蜡烛信号扫描","成交量确认复盘"]},{"id":"b03","title":"股市趋势技术分析","author":"Edwards/Magee","category":"技术分析","stage":2,"diff":3,"hours":20,"summary":"技术分析圣经。系统阐述趋势理论、支撑阻力、头肩、双重顶底、三角形等经典形态。","chapters":[{"title":"第1章·趋势与支撑阻力","level":"必修","points":[{"t":"趋势的本质定义","c":"上升趋势=高点不断抬高+低点不断抬高。下降趋势=高点不断降低+低点不断降低。结构不破坏则趋势延续。","detail":"健康上升趋势中，每次回调的低点必须比上一次回调的低点更高——这是趋势存活的底线。一旦低点不再抬高（形成更低低点），就是趋势可能转向的第一个预警信号，此时应提高警惕而非立即反向。","highlights":[{"text":"趋势=高点和低点的结构，不是主观感觉","color":"gold"}]},{"t":"支撑与阻力互换原则","c":"被突破的支撑变阻力，被突破的阻力变支撑。这是技术分析中最重要的形态原则，没有之一。","detail":"支撑被跌破后，原先在此买入的人全部被套——当价格反弹回该区域时，套牢者急于解套卖出，形成新的阻力。同理，阻力被突破后，突破者会在此区域护盘，形成新支撑。这一角色互换是判断突破有效性的核心逻辑。","highlights":[{"text":"支撑阻力互换=技术分析最重要的形态原则","color":"gold"},{"text":"突破后回踩原阻力变支撑=最佳加仓点","color":"green"}]}]},{"title":"第2章·头肩顶底形态","level":"必修","points":[{"t":"头肩顶完整结构","c":"左肩(放量上涨)→头部(量减创新高)→右肩(量更小反弹无力)→跌破颈线(必须放量)=确认反转。","detail":"成交量递减是最关键的验证：左肩量最大、头部量次之、右肩量最小——说明买盘逐步衰竭。颈线跌破时放量超过20日均量1.5倍则真突破概率超80%；缩量跌破则有50%概率是假突破，需等待反抽确认。","highlights":[{"text":"成交量递减=买盘衰竭，是头肩顶的内核","color":"gold"},{"text":"颈线突破+放量>1.5倍均量=真突破概率>80%","color":"green"}]},{"t":"头肩底——底部的镜像","c":"左肩(放量下跌)→头部(量缩创新低)→右肩(量增反弹)→突破颈线(放巨量)=确认底部反转。","detail":"头肩底与头肩顶的关键差异：底部突破颈线时成交量必须显著放大——这是主力进场的确凿证据。底部颈线常向上倾斜（头肩顶颈线通常水平或略向下），突破后回踩颈线是极佳加仓机会。","highlights":[{"text":"头肩底颈线突破必须放巨量=主力进场铁证","color":"green"}]}]},{"title":"第3章·三角形与旗形中继","level":"必修","points":[{"t":"对称三角形突破逻辑","c":"高点越来越低+低点越来越高→波动收敛后必然突破。上升三角形大概率向上、下降三角形大概率向下。","detail":"对称三角形是中性的——方向由突破决定。但上升三角形（水平上边+上升下边）反映买方在越来越高的位置接盘，突破向上概率约75%。三角形内成交量应递减，突破时放量确认。三角形宽度的60-75%处最易突破。","highlights":[{"text":"三角形收敛后必然突破，方向看突破价位","color":"gold"}]},{"t":"旗形——最可靠中继形态","c":"快速大幅运动后出现1-3周小幅反向整理，波动区间窄、成交量萎缩。整理结束原趋势恢复。","detail":"旗形是趋势中最值得交易的中继形态。旗杆长度可投影测量后续目标。关键特征：持续时间短(1-3周)、整理幅度小(不超过旗杆的38.2%)、成交量明显萎缩。旗形内反向交易是新手最常犯的错误——永远顺着旗杆方向做。","highlights":[{"text":"旗形=趋势中最可靠的中继形态，永远顺旗杆做","color":"green"}]}]},{"title":"第4章·双重顶底与矩形整理","level":"推荐","points":[{"t":"双重顶底的确认规则","c":"双顶=两次冲击同一阻力失败。需跌破中间谷底才确认——未破谷底前只是潜在双顶。量：右顶<左顶=可靠。","detail":"许多交易者看到两次冲高就急于做空，但真正确认是跌破中间谷底（颈线）之时。双顶形成期间右顶成交量明显小于左顶是最佳验证信号——说明第二次上攻时买方力量已衰竭。未破颈线的\"双顶\"可能只是矩形整理。","highlights":[{"text":"双顶确认=跌破中间谷底，未破前只是潜在形态","color":"gold"},{"text":"右顶量<左顶量=买方衰竭的最佳证据","color":"red"}]},{"t":"矩形——多空拉锯战","c":"价格在两条平行线间反复震荡。矩形内高抛低吸，突破后顺势追入。矩形越宽、持续时间越长，突破后行情越大。","detail":"矩形反映多空双方势均力敌的拉锯状态。区间内可做高抛低吸，但必须设止损在区间外。向上突破放量=真突破概率高；向下突破不一定需要放量——重力本身就会推动下跌。矩形高度投影=突破后最小目标。","highlights":[{"text":"矩形宽度=突破后最小目标距离","color":"blue"}]}]}],"knowledge_cards":[{"t":"头肩形态精确测量与确认","c":"头部到颈线垂直距离=最小目标跌幅/涨幅。真突破确认标准：①颈线外收盘②成交量>20日均量1.5倍③连续2日站稳颈线外。三项全满足确认概率>90%。假突破特征：缩量+当日拉回颈线内。","type":"formula"},{"t":"趋势跟踪四步法","c":"①画趋势线连接至少两个低点(上升)或高点(下降)②确认趋势线未被跌破③每次回调到趋势线附近寻找入场信号④趋势线被有效跌破(3%+连续2日)则离场。趋势线角度以30-45度为最佳，过陡则不可持续。","type":"rule"},{"t":"成交量-形态配合法则","c":"所有反转形态在突破关键颈线时必须放量确认，缩量突破大概率是假突破。中继形态(旗形/三角形)在整理期间应缩量，突破时放量。量价背离(价格新高但成交量递减)是趋势衰竭的最早期信号，应提前警惕。","type":"rule"}],"quotes":["趋势是你的朋友，直到它结束为止——识别趋势结束的信号比识别趋势本身更重要。","永远不要在支撑位买入，要等支撑位被测试并守住之后再买。","成交量是价格的燃料——没有燃料，任何运动都无法持续。"],"practice":["形态目标位测算练习","趋势线-成交量的双重验证","头肩形态颈线突破确认"]},{"id":"b04","title":"技术分析大全","author":"Martin Pring","category":"技术分析","stage":3,"diff":3,"hours":18,"summary":"Pring六维分析框架——趋势、动量、成交量、市场广度、情绪、周期。著名KST指标。","chapters":[{"title":"第1章·Pring六维分析框架","level":"必修","points":[{"t":"六个维度的协同逻辑","c":"趋势+动量+成交量+市场广度+情绪+周期六维共振。≥4个维度同向=高胜率入场信号。","detail":"单一维度都有盲区：趋势指标在盘整中反复打脸，动量指标在强趋势中过早离场，成交量可能被对倒操纵。六维框架的本质是用多维交叉验证消除单一维度的盲点——就像六盏灯同时亮起才确认方向。","highlights":[{"text":"六维共振=用多维交叉验证消除单一盲区","color":"gold"}]},{"t":"维度冲突时的处理原则","c":"趋势看多+动量看空=趋势可能进入修正，减仓不反手。趋势看空+动量看多=反弹做空机会。","detail":"维度冲突时，长期趋势维度权重最高——因为趋势是所有维度中最难逆转的。短期维度即使看多也不应逆趋势做多，而应视为趋势中的修正，等待修正结束顺应大趋势入场。","highlights":[{"text":"趋势维度权重最高，短期维度只调整仓位不改变方向","color":"green"}]}]},{"title":"第2章·KST动量指标深度解析","level":"必修","points":[{"t":"KST——多周期动量合成","c":"KST=四个不同周期ROC的加权合成。短周期捕捉快速转折，长周期确认趋势动量，合成后消除噪音。","detail":"KST(Know Sure Thing)是Pring独创的动量指标。其精妙之处在于将短、中、长、超长四个周期的变化率(ROC)加权合成一条线，短周期敏感捕捉转折、长周期稳健确认趋势——相当于内置了多时间框架分析。KST上穿信号线=买入。","highlights":[{"text":"KST=四周期动量合成，内置多时间框架","color":"blue"}]},{"t":"KST背离信号","c":"价格新高KST未新高=顶背离→减仓。价格新低KST未新低=底背离→关注反转。背离级别越大信号越强。","detail":"周线级别的KST顶背离是Pring体系中最强的卖出信号之一——反映长周期动量在衰竭。日线级别背离需要周线方向配合：日线底背离+周线KST向上=最佳做多信号；日线底背离+周线KST向下=只是反弹不是反转。","highlights":[{"text":"周线KST背离=最强级别的反转预警","color":"gold"}]}]},{"title":"第3章·市场广度与情绪指标","level":"必修","points":[{"t":"腾落线(AD Line)——上涨的质量裁判","c":"AD线=每日上涨家数-下跌家数的累计值。指数新高AD线未新高=顶背离→上涨由少数大盘股拉动。","detail":"指数创新高但AD线走平或下降，说明资金集中流向少数权重股，大部分股票实际上在下跌——这是牛市末期的典型特征。Pring将AD线视为市场内部健康的\"X光片\"，它揭示的是指数表面之下真实的市场宽度。","highlights":[{"text":"AD线=市场内部健康的X光片","color":"gold"}]},{"t":"VIX与逆向情绪指标","c":"VIX>30=恐慌→关注底部机会。VIX<15=过度安逸→警惕顶部。极端值才是有效信号，中间区域为噪音。","detail":"VIX在15-25区间震荡不提供有效信号。只有当VIX冲到30以上（恐慌）或跌到15以下（自满）时才有逆向交易价值。VIX尖峰+放量+反转K线=底部三确认。VIX持续走低+缩量上涨+顶背离=顶部预警。","highlights":[{"text":"VIX极端值才是信号，中间区域全是噪音","color":"red"}]}]},{"title":"第4章·周期理论与实战整合","level":"推荐","points":[{"t":"市场周期四阶段","c":"筑底→上涨→筑顶→下跌四阶段循环。每阶段对应不同策略：底部=分批建仓，上涨=持有加仓，顶部=减仓，下跌=空仓或做空。","detail":"Pring将经济周期与市场周期对应：债券见底→股票见底→商品见底→债券见顶→股票见顶→商品见顶。这一轮动顺序是六维框架中周期维度的核心。识别当前处于哪个阶段，决定了整体仓位和策略方向。","highlights":[{"text":"先识别周期阶段，再选择策略方向","color":"green"}]},{"t":"六维检查清单实战","c":"每日检查：①价格在200日线上/下？②KST方向？③成交量趋势？④AD线方向？⑤VIX位置？⑥周期阶段？≥4同向=执行。","detail":"将六维框架转化为可执行的每日检查清单，是Pring体系从理论到实战的关键一步。建议打印贴在交易桌前，每笔交易前逐项打勾。坚持一个月后你会发现，90%的亏损交易发生在少于4维共振的情况下。","highlights":[{"text":"每日六维打勾，少于4项同向不做","color":"purple"}]}]}],"knowledge_cards":[{"t":"六维共振完整检查清单","c":"①价格趋势：是否在200日均线上方且200日均线向上？②KST动量：KST是否上穿信号线或在信号线上方？③成交量：上涨放量下跌缩量？④市场广度：AD线与指数是否同步创新高？⑤VIX情绪：是否处于极端区域？⑥周期阶段：处于筑底/上涨/筑顶/下跌哪个阶段？满分6分，≥4分入场，≤2分空仓。","type":"rule"},{"t":"KST指标计算公式","c":"KST=ROC(10)×1 + ROC(15)×2 + ROC(20)×3 + ROC(30)×4，再取10日均线平滑。信号线=KST的5日均线。ROC=当日收盘价/N日前收盘价-1。四个周期分别对应短、中、长、超长趋势动量，权重递增反映长周期趋势的重要性更高。","type":"formula"},{"t":"多时间框架三周期原则","c":"长期(月线)：定战略方向——判断主要趋势和周期阶段。中期(周线)：定战术位置——在主要趋势中寻找次级回调的结束点。短期(日线)：定精确入场——在中周期到位后寻找K线反转信号。核心铁律：最短周期永远服从最长周期方向，绝不逆主要趋势交易。","type":"rule"}],"quotes":["技术分析是一门艺术，而非精确的科学——但通过多维度交叉验证，我们可以将概率大幅推向有利一方。","单一指标告诉你的只是一个视角，六个维度告诉你的才接近真相。","市场广度是价格的X光片——它揭示的是表面之下的真实健康状况。"],"practice":["六维共振每日检查","KST背离识别练习","AD线-指数背离判断"]},{"id":"b05","title":"以交易为生","author":"Alexander Elder","category":"交易心理","stage":3,"diff":2,"hours":12,"summary":"Elder博士将心理学与技术分析完美结合。三重滤网交易系统+2%和6%法则。","chapters":[{"title":"第1章·交易心理学——认识你的敌人","level":"必修","points":[{"t":"交易者最大的敌人是自己","c":"不是市场、不是庄家、不是信息劣势——是你内心的贪婪、恐惧和希望。三者构成三重亏损引擎。","detail":"Elder作为执业精神科医生，深刻洞察到：每个交易者内心都有一个疯狂的赌徒，他在亏损时怂恿你加仓翻本，在盈利时劝你早点落袋。识别这个内在赌徒的声音，学会在他出现时按下暂停键，是交易心理训练的第一步也是最关键一步。","highlights":[{"text":"最大敌人是内心的赌徒，识别他才能控制他","color":"gold"}]},{"t":"戒酒互助会(AA)模式应用于交易","c":"亏损成瘾与酗酒同源——都是冲动控制障碍。承认失控→寻求帮助→每日自省→帮助他人。","detail":"Elder将戒酒互助会的12步康复模式引入交易心理训练：①承认自己对亏损上瘾②相信有更高力量（交易系统）可以帮助你③每天做交易日志自省④当你能帮助其他交易者时，你自己的纪律也会加强。这个方法已被全球交易者社区验证有效。","highlights":[{"text":"亏损成瘾=冲动控制障碍，用AA模式戒断","color":"purple"}]}]},{"title":"第2章·三重滤网交易系统","level":"必修","points":[{"t":"三重滤网完整流程","c":"第一重(周线MACD)定多空方向→第二重(日线RSI)在回调中找入场区→第三重(小时线)精确击发。","detail":"与大多数交易者从日线直接入场不同，Elder要求先从更高时间框架开始。周线MACD柱线向上=只做多；然后等日线RSI跌到30以下（超卖）才是回调买入区；最后在小时线上找突破或反转信号精确入场。逆周线方向的交易绝对不做。","highlights":[{"text":"周线定方向→日线找回调→小时线入场，像狙击手瞄准","color":"green"}]},{"t":"滤网间的逻辑关系","c":"第一重滤掉逆势交易(最危险)。第二重滤掉追涨杀跌(最普遍)。第三重滤掉过早入场(最可惜)。","detail":"三重滤网每层解决一个核心问题：第一层保证你站在趋势正确的一边——这已经赢了一半；第二层保证你不是在贪婪驱动下追高，而是在恐惧造成的回调中冷静买入；第三层保证你的入场时机精确，减少持仓中的心理煎熬。","highlights":[{"text":"三层滤网=过滤贪婪、恐惧、急躁三种亏损源头","color":"blue"}]}]},{"title":"第3章·2%和6%资金管理法则","level":"必修","points":[{"t":"2%法则——单笔风险上限","c":"任何单笔交易的最大亏损不超过总资金的2%。10万账户→单笔最大亏损2000元。这决定了你的生存底线。","detail":"2%法则不是建议而是铁律。连续亏损10笔才亏20%，还有机会翻盘；若单笔亏10%，连续3笔就亏30%，需要赚43%才能回本。2%保护的是你继续留在牌桌上的权利。计算方式：仓位=(资金×2%)÷(入场价-止损价)。","highlights":[{"text":"2%=生存底线，连续亏10次还有80%本金","color":"gold"}]},{"t":"6%法则——月度亏损熔断","c":"当月累计亏损（含浮动亏损）达到总资金6%=立即停止所有交易，下月1号才能重新开始。","detail":"6%法则是2%法则的上级保护。即使每笔严格遵守2%，一个月连续亏损3笔=6%触发熔断。这阻止了交易者在连续亏损后情绪失控、报复性交易导致资金曲线断崖式下跌——这是业余与专业的分水岭。","highlights":[{"text":"6%月度熔断=阻止连续亏损后的情绪失控","color":"red"}]}]},{"title":"第4章·交易日志与自我复盘","level":"推荐","points":[{"t":"交易日志的核心要素","c":"每笔记录：①入场理由(三重滤网哪一重触发)②入场价止损价③出场价盈亏R④情绪评分1-5⑤事后评价。","detail":"Elder认为交易日志是交易者最重要的工具——比任何指标都重要。坚持3个月日志后复盘，你会发现模式：70%的亏损集中在情绪评分≥4的日子，80%的盈利来自严格按三重滤网执行。数据不会说谎，日志让你直面自己的问题。","highlights":[{"text":"交易日志>任何指标，数据让你直面真实自己","color":"purple"}]},{"t":"周末深度复盘四问","c":"①本周最好和最差交易分别是什么原因？②三重滤网执行率？③情绪触发点在哪？④下周改进一项什么？","detail":"日复一日只做表面记录，周末做深度分析。找到自己亏损的模式：是追高？不止损？还是盈利拿不住？聚焦改进一个问题，比同时试图改正所有问题有效10倍。Elder建议每季度只设定一个改进目标。","highlights":[{"text":"每季度只改进一个问题，专注带来突破","color":"green"}]}]}],"knowledge_cards":[{"t":"三重滤网完整执行流程","c":"Step1周线MACD柱：向上=只做多，向下=只做空。Step2日线RSI：做多等RSI<30(超卖回调)，做空等RSI>70(超买反弹)。Step3小时线突破：等待小时线突破前一根K线高点(做多)或低点(做空)后入场。止损设在小时线最近摆动低点/高点。","type":"rule"},{"t":"2%和6%资金管理公式","c":"单笔最大亏损=总资金×2%。用此反推仓位大小：仓位股数=(总资金×2%)÷(入场价-止损价)。月度累计亏损达6%熔断：当月所有未平仓浮动亏损+已实现亏损≥资金×6%→平仓所有头寸→停止交易至下月。此双重保护是Elder体系中最硬核的生存法则，也是其学员长期盈利的最关键因素。","type":"formula"},{"t":"情绪自评与交易决策矩阵","c":"每笔交易前给自己的情绪打分1-5分(1=极度冷静，5=极度亢奋/恐惧)。评分≥4时：仓位减半或不做。评分=5时：今日不交易。Elder的统计显示：80%以上的大亏发生在情绪评分≥4时。这不是软性建议——应像止损一样严格执行。","type":"rule"}],"quotes":["交易的目标不是赚钱，而是做正确的交易。赚钱只是正确交易的副产品。","一个没有记录的交易者就像一家没有账本的公司——你永远不知道自己是在赚钱还是在亏钱。","业余者想着能赚多少，专业者想着会亏多少。"],"practice":["三重滤网每日筛选","2%仓位计算练习","情绪评分+交易日志"]},{"id":"b06","title":"股票大作手回忆录","author":"Edwin Lefèvre","category":"交易心理","stage":1,"diff":1,"hours":10,"summary":"华尔街传奇交易员利弗莫尔的传记体小说。从5美元起家到做空1929年大崩盘赚取1亿美元。深刻揭示市场运行规律和人性弱点。","chapters":[{"title":"第1章·少年赌客：报价板上的智慧","level":"必修","points":[{"t":"最小阻力方向","c":"价格朝阻力最小的方向运行——利弗莫尔14岁发现的核心规律。观察方向而非预测方向。","detail":"在投机行用报价带记录价格时发现：当上涨比下跌容易时持续上涨。不预测市场应该怎么走——观察市场正在怎么走。","highlights":[{"text":"核心：价格沿最小阻力方向运动","color":"gold"},{"text":"规则：观察方向不预测方向","color":"green"}]}]},{"title":"第2章·华尔街初体验：止损觉醒","level":"必修","points":[{"t":"报价延迟的致命性","c":"同一个利弗莫尔——投机行无敌→真实市场亏光。环境变了优势消失。","detail":"成功可能是因为你处于有利环境中。改变环境结果完全不同。","highlights":[{"text":"警示：同样方法不同环境结果天差地别","color":"red"}]},{"t":"止损意识觉醒","c":"让你破产的不是判断错误，而是不认错。止损=保护交易资格。","detail":"每次大亏共同点：明知方向反了但不认错不断加仓摊平直到亏光。","highlights":[{"text":"核心：止损=保护继续交易的资格","color":"gold"}]}]},{"title":"第3章·关键点理论：等待的艺术","level":"必修","points":[{"t":"什么是关键点","c":"价格突破关键价位后趋势真正确认。在关键点入场=止损最窄+盈亏比最大。","detail":"关键点=多空力量质变位置。识别：前高前低、整数关口、均线位、密集成交区。","highlights":[{"text":"核心：关键点=多空力量质变位置","color":"gold"}]},{"t":"坐功比选股重要","c":"我赚大钱的秘诀从来不是我的想法，而是我的坐功。持仓时间决定利润大小。","detail":"入场→设止损→什么都不做→等趋势走完。频繁交易是最大利润杀手。","highlights":[{"text":"核心：持仓时间决定利润","color":"gold"}]}]},{"title":"第4章·金字塔加仓","level":"推荐","points":[{"t":"试探→确认→加仓","c":"小仓位试探→市场证实正确→逐步加仓。每笔加仓在盈利状态下进行。亏损仓位绝不补充。","detail":"流程：1/5仓位入场→价格证实→加仓→再证实再加。补仓=赌徒行为。","highlights":[{"text":"规则：只在盈利仓位加仓","color":"green"}]}]},{"title":"第5章·1929年世纪做空","level":"推荐","points":[{"t":"如何预见崩盘","c":"领先股不再创新高+市场广度恶化+成交量萎缩=道氏理论经典顶部信号。","detail":"不是预测崩盘日期——是判断市场结构恶化到不可持续。","highlights":[{"text":"核心：预判=观察市场结构而非预测日期","color":"gold"}]}]},{"title":"第6章·利弗莫尔的坠落","level":"必修","points":[{"t":"人性终极考验","c":"一生多次赚到数亿又亏光——违反了自己的交易规则。知道≠做到。","detail":"最大讽刺：亲手写的规则帮他赚数亿，也是他反复违反的见证。","highlights":[{"text":"核心：知道≠做到——执行力决定一切","color":"gold"},{"text":"警示：利弗莫尔失败比成功更有教育意义","color":"red"}]}]}],"knowledge_cards":[{"t":"最小阻力线法则","c":"价格沿最小阻力方向运动。判断：突破阻力轻松=向上，跌破支撑轻松=向下。回调低点不断抬高=向上趋势。","type":"concept"},{"t":"关键点交易法","c":"识别：前高前低+整数关口+长期均线+密集成交区。入场=关键点突破。止损=另一侧2-3%。放量=确认。","type":"rule"}],"quotes":["华尔街没有新鲜事，因为投机像群山一样古老。","让你破产的不是判断错误，而是不认错。"],"practice":["识别市场大趋势","耐心等待关键点"]},{"id":"b07","title":"交易心理分析","author":"Mark Douglas","category":"交易心理","stage":1,"diff":3,"hours":12,"summary":"概率思维重新定义交易本质。5个基本事实+7个持续一致思维原则——交易心理里程碑著作。","chapters":[{"title":"第1章·五大基本事实——重塑交易信念","level":"必修","points":[{"t":"事实一：任何事都可能发生","c":"市场不需要合理、不需要符合你的预期。接受不确定性是交易的第一课，也是最重要的一课。","detail":"Mark Douglas指出：大多数交易者的痛苦源于期待市场按照自己的分析走。但市场是独立的存在——它不欠你任何东西。真正接受\"任何事都可能发生\"意味着：不再为亏损感到愤怒，不再为踏空感到焦虑。从预测思维转变为概率思维，是专业交易者的起点。","highlights":[{"text":"市场不欠你任何东西——接受不确定性是第一课","color":"gold"}]},{"t":"事实二：不需要知道接下来会发生什么也能赚钱","c":"赚钱不靠预测准确，而靠概率优势+风险管理。你不需要预测每一笔的输赢，只需要正期望值系统。","detail":"这是对传统交易教育的颠覆。大多数人花90%精力试图预测市场方向，但Douglas说：你不需要预测。你只需要一个正期望值的系统，然后做足够多次——就像赌场不需要知道每一把的结果，但长期一定盈利。解放自己从\"必须预测对\"的枷锁中。","highlights":[{"text":"不需要预测也能赚钱——概率优势+足够次数=盈利","color":"gold"}]}]},{"title":"第2章·五大情绪陷阱与自我破坏","level":"必修","points":[{"t":"五大情绪陷阱识别","c":"贪婪(追高加仓)+恐惧(不敢入场)+希望(不止损)+愤怒(报复交易)+过度自信(放松纪律)。永远存在，只能管理。","detail":"Douglas将情绪陷阱类比为暗流——你看不到它们，但它们一直在水下拉扯你。关键是每天开盘前自我检查：今天我在哪个陷阱中？如果昨晚失眠因为持仓→恐惧模式，今天减半仓位。如果昨天大赚看不起市场→过度自信模式，今天严格执行止损不放松。","highlights":[{"text":"五大情绪陷阱永远存在，只能管理不能消除","color":"red"},{"text":"每天开盘前检查：今天我掉在哪个陷阱里？","color":"green"}]},{"t":"五种自我破坏行为","c":"①止损后反向重仓②盈利后加大仓位③连续亏损想翻盘④看别人赚钱追入⑤亏损后不敢再入场。每天收盘对照自查。","detail":"自我破坏的本质是：理智知道该怎么做，但情绪驱动下做了相反的事。Douglas建议将这些行为做成清单贴在屏幕旁，每天收盘后逐条打勾——有就打✓没有就打✗。坚持两周你会发现模式，看到模式就是改变的开始。","highlights":[{"text":"自我破坏清单=每天收盘打勾，看见模式就能改变","color":"purple"}]}]},{"title":"第3章·概率思维训练——从恐惧到自由","level":"必修","points":[{"t":"盈亏中性化训练","c":"不为盈利兴奋，不为亏损沮丧。每笔交易只是一个数据点。你的目标是执行系统，不是每一笔赚钱。","detail":"连续亏损3次不代表系统失效——可能是40%胜率系统中正常的概率分布。连续盈利3次也不代表你厉害——可能是运气。Douglas的核心洞见：当你把注意力从\"这笔赚不赚\"转移到\"这笔是否按系统做\"，交易就从折磨变成自由。","highlights":[{"text":"盈亏中性=关注执行质量而非单笔结果","color":"gold"}]},{"t":"20笔样本思维","c":"不评价任何单笔交易——以20笔为最小评估单元。20笔后计算：执行率？平均盈亏比？胜率？再决定是否调整。","detail":"单笔交易就像抛硬币——没有任何信息量。20笔才能初步看到概率分布。Douglas建议：永远不要因为1-3笔亏损就修改系统。至少20笔后做统计分析，50笔后才能对系统质量做出可靠判断。这个思维转变让大多数交易者从焦虑中解脱。","highlights":[{"text":"20笔=最小评估单元，单笔结果毫无意义","color":"blue"}]}]},{"title":"第4章·建立不可动摇的交易信念","level":"推荐","points":[{"t":"每日开盘信念仪式","c":"开盘前默念五大事实：①任何事都可能发生②不需预测也能赚钱③每笔随机④概率优势+次数=盈利⑤当下独一无二。","detail":"Douglas建议连续21天重复这个仪式——这是重塑潜意识所需的最小周期。前7天可能觉得机械可笑，14天后开始内化，21天后你会发现止损不再痛苦、盈利不再狂喜。这不是玄学——是神经可塑性：重复的行为会重塑大脑的默认反应。","highlights":[{"text":"21天信念仪式=重塑交易的潜意识反应","color":"purple"}]},{"t":"从结果导向到过程导向","c":"不再问\"这笔赚了多少\"，改问\"这笔是否按系统执行\"。过程正确结果亏损=成功。过程错误结果盈利=失败。","detail":"这是Douglas体系中最反直觉却最重要的转变。当你用过程而非结果评判自己时：①连续亏损不再打击自信（只要过程正确）②偶然暴利不再让你膨胀（因为知道过程有问题）。长期来看，过程导向的交易者不仅更快乐，结果也更好。","highlights":[{"text":"过程正确+结果亏损=成功。过程错误+结果盈利=失败","color":"gold"}]}]}],"knowledge_cards":[{"t":"五大基本事实每日宣言","c":"①任何事都可能发生——我不需要预测市场。②赚钱不需要知道接下来会怎样——我只需要概率优势。③任何一笔交易的结果都是随机的——我不为单笔盈亏焦虑。④概率优势+足够多次交易=长期盈利——我相信统计学。⑤每一刻市场都是独特的——我不对历史模式产生执念。连续21天每日开盘前默念。","type":"rule"},{"t":"自我破坏行为对照清单","c":"每天收盘后逐一检查：①止损后是否反向重仓？②盈利后是否加大仓位？③连续亏损是否想翻盘报复？④是否因为看到别人赚钱而追入？⑤亏损后是否因恐惧不敢再入场？有则标记并写下触发情境。每周统计高频触发项，作为下周重点改进目标。","type":"rule"},{"t":"概率思维的核心假设","c":"交易不是预测游戏而是概率游戏。任何交易系统的胜率只是长期统计值——40%胜率意味着每10笔大约亏6笔赚4笔，这是正常的不是系统失效。关键在于：赚的4笔平均盈亏比要大于亏的6笔。只要期望值为正，做足够多次就必然盈利。Douglas称之为\"交易者的自由\"。","type":"concept"}],"quotes":["任何一笔交易的结果都是随机的，长期获利靠的是概率优势加上足够多次的交易。","当你不再为单笔盈亏焦虑，你就获得了交易者真正的自由。","市场不会制造痛苦，是你对市场的期待制造了痛苦。"],"practice":["21天信念仪式打卡","自我破坏行为日检","20笔统计复盘法"]},{"id":"b08","title":"海龟交易法则","author":"Curtis Faith","category":"交易系统","stage":3,"diff":1,"hours":8,"summary":"传奇交易员Dennis招募23个普通人两周培训——创造超1亿美元利润。证明交易成功靠严格执行系统。","chapters":[{"title":"第1章·海龟实验——交易可以培养","level":"必修","points":[{"t":"史上最伟大的交易实验","c":"Richard Dennis招募23个零经验普通人→两周培训→每人100万美元→4年平均年化超80%。系统+纪律>天赋。","detail":"Dennis和合伙人Eckhardt打赌：交易能力是天生的还是可以培养的？Dennis用实验证明：挑选规则执行力强的人（不是天才交易员），教他们一套简单系统，给他们资金，结果创造了超过1亿美元的利润。这个实验改变了整个交易教育的范式——好系统+普通执行者=稳定盈利。","highlights":[{"text":"系统+纪律>天赋——普通人也能稳定盈利","color":"gold"}]},{"t":"海龟选人标准——什么特质最重要","c":"不选金融天才、不选数学博士。选的是：能遵守规则+能承受压力+能接受不确定性的人。","detail":"Dennis不关心智商和学历，他关心的是：给你规则你会严格执行吗？连续亏损5次你还敢做第6次吗？面对浮盈50%回撤到10%你能坚持不平仓吗？这三条——纪律、心理韧性、对不确定性的承受力——是海龟们成功的真正原因，也是大多数人失败的真正原因。","highlights":[{"text":"纪律+韧性+承受不确定性>智商+学历","color":"purple"}]}]},{"title":"第2章·唐奇安通道突破系统","level":"必修","points":[{"t":"突破入场——极简但有效","c":"价格突破过去20天最高价=做多。价格跌破过去10天最低价=做空(平多)。极简规则，不预测只跟随。","detail":"海龟系统的核心思想：不判断突破的真假，而是接受所有突破——用盈亏比覆盖假突破的亏损。大多数突破是假突破(胜率仅35-40%)，但真突破带来的趋势利润(盈亏比5:1以上)足以覆盖所有假突破的亏损并大幅盈利。你不需要判断真假——你需要接受假突破。","highlights":[{"text":"不判断真假突破——接受所有突破，用盈亏比覆盖","color":"gold"}]},{"t":"双系统并行——系统1和系统2","c":"系统1(短线)：20日突破入场+10日突破离场。系统2(长线)：55日突破入场+20日突破离场。同时运行。","detail":"海龟们同时运行两个系统：系统1捕捉快速趋势但假信号多，系统2捕捉大趋势但入场晚。两者资金分配各占50%，形成互补。当市场处于宽幅震荡时系统1亏损系统2也亏损；当大趋势来临时两个系统同时盈利——趋势利润远大于震荡亏损。","highlights":[{"text":"双系统并行=短线+长线互补，任何行情都有应对","color":"blue"}]}]},{"title":"第3章·ATR仓位管理——风险量化核心","level":"必修","points":[{"t":"N值/ATR——波动率量化","c":"N=20日平均真实波幅(ATR)。量化市场噪音→决定止损距离+仓位大小。高波动=小仓位，低波动=大仓位。","detail":"ATR的本质是用客观数字代替主观判断。不同品种波动率不同：原油日均波动3%、债券0.5%——如果都买相同金额，风险完全不同。ATR将所有品种归一化：仓位大小=账户资金×1%÷(ATR×合约乘数)，确保每笔交易风险一致。这是海龟体系最精妙的设计。","highlights":[{"text":"ATR=所有品种的风险统一度量衡","color":"gold"}]},{"t":"金字塔加仓法则","c":"价格每朝有利方向移动0.5N→加仓一次，最多加仓4次。首仓1单位→最多共5单位。只在盈利时加仓。","detail":"海龟的加仓是趋势跟踪利润的核心来源。在10元买入1单位→涨到10.5N加1单位→11N加1单位→11.5N加1单位→12N加1单位。成本逐步抬高但仓位逐步加大——大趋势中这种金字塔加仓创造的利润远超一次性建仓。亏损时永不加仓，只在盈利中放大。","highlights":[{"text":"只在盈利中加仓——亏损时绝不摊平","color":"green"}]}]},{"title":"第4章·纪律——海龟成功的唯一秘密","level":"必修","points":[{"t":"离开系统=崩溃","c":"海龟们独立交易后业绩大幅下滑——不是因为系统失效，而是开始凭感觉修改系统。纪律>聪明。","detail":"最讽刺的是：海龟们知道系统有效，但在经历连续亏损或巨大回撤时，大多数人做不到继续执行。他们开始过滤信号（\"这次突破看起来像假的\"）、调整仓位（\"这次少买一点\"）——结果错过了最大的趋势。成功不是找到一个好系统，而是严格执行一个系统。","highlights":[{"text":"坚持执行普通系统10年>不断切换聪明系统","color":"gold"}]},{"t":"面对回撤的心理韧性","c":"海龟系统最大回撤曾达40%+。Dennis说：如果你不能承受40%回撤，你就不能赚到100%的收益。","detail":"趋势跟踪的本质是用多次小亏损换取少数大盈利。但大盈利之间的等待期可能长达数月甚至一年，期间持续的假突破亏损让人怀疑系统是否已失效。Faith在书中坦陈：最难的不是学会系统，而是在连续亏损12次后仍然坚持做第13次——这才是海龟与其他人的真正区别。","highlights":[{"text":"连续亏12次仍坚持做第13次=海龟的真正秘密","color":"red"}]}]}],"knowledge_cards":[{"t":"ATR仓位精确计算公式","c":"TR=MAX(当日高-当日低, |当日高-昨日收|, |当日低-昨日收|)。N(ATR)=(19×前日N+当日TR)/20的指数平滑。仓位大小=(账户资金×1%)÷(N×合约乘数)。例如100万账户，螺纹钢N=50点×10元/点=500元，仓位=100万×1%÷500=20手。所有品种用同一公式统一风险。","type":"formula"},{"t":"趋势跟踪的盈亏比逻辑","c":"核心假设：①大多数突破是假突破(产生多次小亏)②少数突破演变为大趋势(产生少数大赚)③大趋势的利润远大于假突破的总亏损。海龟系统胜率仅35-40%，但平均盈亏比>4:1。期望值=0.375×4R-0.625×1R=+0.875R。正期望+多次执行=长期盈利。不追胜率追盈亏比。","type":"concept"},{"t":"海龟加仓规则","c":"首次建仓1单位。价格朝有利方向每移动0.5N加仓1单位，最多加至5单位。每单位止损设在2N以外。加仓后整体止损上移至最近加仓价的2N处。金字塔结构确保：行情越大仓位越大，但任何时点总风险不超过账户的固定比例。永不对亏损头寸加仓——只在盈利中放大。","type":"rule"}],"quotes":["好的交易是无聊的——如果你感到刺激，你可能已经偏离了系统。","交易不是脑力劳动，是体力劳动——严格执行一套规则，日复一日。","知道系统和执行系统之间的鸿沟，就是大多数人亏损的原因。"],"practice":["ATR仓位计算练习","唐奇安通道模拟回测","连续亏损后的纪律坚持"]},{"id":"b09","title":"道氏理论","author":"Robert Rhea","category":"市场理论","stage":2,"diff":2,"hours":10,"summary":"所有技术分析的理论基石。Charles Dow提出趋势三级别和三发展阶段。","chapters":[{"title":"第1章·道氏理论的三大基石假设","level":"必修","points":[{"t":"假设一：价格包容消化一切","c":"所有已知和未知信息——基本面、政策、情绪、内幕——都已反映在当前价格中。研究价格就是研究一切。","detail":"这是所有技术分析的逻辑起点。既然价格已经反映了所有人的所知所想所做，那么纯粹的价格分析就是最高效的市场研究方法。你不需要比市场知道更多——市场已经知道一切并给出了价格这个最终答案。道氏用这句话奠定了技术分析100年的哲学基础。","highlights":[{"text":"价格包容一切=技术分析的哲学基石","color":"gold"}]},{"t":"假设二：三种趋势级别","c":"主要趋势(年级别，持续1年以上)→次级趋势(月级别，修正主要趋势1/3到2/3)→小型趋势(周级别，随机噪音)。","detail":"三种趋势同时存在但方向可能不同。交易者首先要明确自己交易哪个级别：日线交易者不理会小时线波动（那是噪音），周线投资者不理会日线回调（那是正常修正）。级别混乱=判断与执行矛盾=亏损。道氏理论的核心应用就是统一交易级别。","highlights":[{"text":"三种趋势级别=统一交易框架，级别混乱=亏损根源","color":"gold"},{"text":"明确你的级别：日线看小时线是噪音，周线看日线是修正","color":"red"}]}]},{"title":"第2章·主要趋势的三阶段模型","level":"必修","points":[{"t":"牛市三阶段：怀疑→乐观→狂热","c":"第一阶段(吸筹)：聪明钱在悲观中建仓。第二阶段(参与)：趋势确认、散户追涨。第三阶段(派发)：聪明钱在乐观中出货。","detail":"底部放量不涨=吸筹阶段——聪明钱正在悄悄收集筹码，此时新闻面仍旧悲观。量价齐升=参与阶段——趋势被确认，媒体开始唱多，散户跑步入场。新高缩量=派发阶段——聪明钱正在把筹码倒给追涨的散户，新闻面一片乐观。识别阶段=知道自己在和谁交易。","highlights":[{"text":"熊市底部买入的人=牛市顶部卖出的人=同一批聪明钱","color":"gold"}]},{"t":"熊市三阶段：希望→恐慌→绝望","c":"第一阶段(派发)：聪明钱高位出货。第二阶段(恐慌)：趋势确认、散户割肉。第三阶段(绝望)：聪明钱在悲观中接盘。","detail":"熊市的三个阶段与牛市互为镜像。关键识别信号：派发阶段放量滞涨、恐慌阶段连续放量下跌、绝望阶段缩量阴跌+利空不断但跌不动。绝望阶段=聪明钱开始吸筹=下一轮牛市的起点。道氏理论的终极应用：在绝望中买入，在狂热中卖出。","highlights":[{"text":"绝望中买入+狂热中卖出=道氏理论终极应用","color":"green"}]}]},{"title":"第3章·指数互相验证与成交量","level":"必修","points":[{"t":"指数互相验证原则","c":"道琼斯工业指数和运输指数必须同步创新高/新低才确认趋势。单一指数突破=未确认=谨慎对待。","detail":"原版道氏理论要求工业指数和铁路（运输）指数互相验证——背后的逻辑是：生产必须与物流同步才说明经济真正向好。现代交易者可推广为：大盘指数+行业指数+个股三者同步，任一级别背离就是结构恶化的早期预警。三重背离=最强危险信号。","highlights":[{"text":"工业+运输同步=趋势确认，背离=谨慎","color":"gold"},{"text":"大盘+行业+个股三重验证=现代版道氏原则","color":"blue"}]},{"t":"量价关系的四象限法则","c":"①价涨量增=趋势健康持有②价涨量缩=动能衰减减仓③价跌量缩=正常修正观望④价跌量增=恐慌抛售回避。","detail":"道氏理论中成交量是确认价格信号的辅助工具——量在价先，成交量变化通常领先价格1-3天。天量天价、地量地价的规律在主要趋势转折点尤为可靠。但成交量不决定方向——价格趋势本身才是主线，量只是确认工具。","highlights":[{"text":"量在价先1-3天，成交量是预判不是决定","color":"green"}]}]},{"title":"第4章·道氏理论的实战应用","level":"推荐","points":[{"t":"收盘价——唯一客观的价格","c":"道氏理论只用收盘价判断趋势——日内高低点是噪音。只有收盘价反映市场最终的共识。突破/跌破以收盘价为准。","detail":"日内价格受情绪和算法交易影响极大，只有收盘价代表经过全天博弈后多空双方最终达成的价格共识。道氏的这一原则历经百年仍是最实用的过滤规则：所有趋势线突破、支撑阻力突破，都以收盘价确认为准——过滤了80%的假突破噪音。","highlights":[{"text":"只看收盘价——日内波动80%是噪音","color":"blue"}]},{"t":"道氏理论的三条实战铁律","c":"①趋势延续直到明确反转信号出现②只交易主要趋势方向③永远等指数互相验证后再行动。","detail":"Rhea在《道氏理论》中总结了这三条铁律：第一条让你拿住趋势不提前下车；第二条让你不做逆势交易（最危险的行为）；第三条让你不被单一指数误导。三条合在一起构成了一个完整的趋势跟踪框架——简洁但极其有效，是华尔街百年实践的结晶。","highlights":[{"text":"趋势延续直到反转信号出现——不猜顶不猜底","color":"gold"}]}]}],"knowledge_cards":[{"t":"道氏三趋势量化标准","c":"主要趋势：价格在200日均线上方且200日均线方向向上，持续时间通常1年以上。次级趋势：价格回调至50日均线附近但200日均线方向不变，回调幅度通常为主要趋势的1/3至2/3，持续时间3周至3个月。小型趋势：3-5天的随机波动，无交易价值，忽略。统一级别后再做判断。","type":"rule"},{"t":"量价四象限决策矩阵","c":"象限一(价涨量增)：趋势健康→持有/加仓。象限二(价涨量缩)：动能衰减→减仓/收紧止损。象限三(价跌量缩)：正常修正→观望/等待入场。象限四(价跌量增)：恐慌抛售→离场/做空。每日根据价格和成交量落在哪个象限调整策略。程序化思维替代主观判断。","type":"rule"},{"t":"牛市/熊市三阶段识别信号","c":"牛市：①吸筹阶段——底部放量滞跌、利空不跌、聪明钱建仓②参与阶段——突破关键阻力、量价齐升、媒体开始报道③派发阶段——高位放量滞涨、利好不涨、聪明钱出货。熊市则镜像：派发→恐慌→绝望。阶段识别=确定当前是该买、该持、还是该卖的最核心判断依据。","type":"concept"}],"quotes":["平均指数包容和消化一切——除了上帝的行为。","没有任何一种方法能够告诉你市场将走多远，但道氏理论能告诉你市场正在朝哪个方向走。","牛市中的回调是礼物，熊市中的反弹是陷阱。"],"practice":["三趋势级别画线练习","阶段识别(吸筹/参与/派发)","量价四象限每日标注"]},{"id":"b10","title":"艾略特波浪理论","author":"Frost/Prechter","category":"市场理论","stage":4,"diff":4,"hours":14,"summary":"5-3波浪模式+斐波那契比率。虽然争议大但提供理解市场心理节奏的独特框架。","chapters":[{"title":"第1章·波浪基本结构与三大铁律","level":"必修","points":[{"t":"5-3波浪模式","c":"完整周期=5浪推动(1-2-3-4-5)+3浪调整(A-B-C)=8浪。自相似性——任何级别都遵循5-3结构。","detail":"推动浪中1、3、5与主趋势同向，2、4为逆趋势修正。调整浪中A、C与修正方向同向，B为反向反弹。这种自相似的分形结构——分钟图上的5-3和年线图上的5-3遵循相同规则——是艾略特波浪理论的数学美感所在，也是其争议来源。","highlights":[{"text":"5-3=推动+调整=所有级别自相似","color":"gold"}]},{"t":"三大不可违反的铁律","c":"①2浪回调不跌破1浪起点②3浪不能是三浪中最短的③4浪不进入1浪价格区域（不重叠）。违反任何一条=必须重新数浪。","detail":"铁律是波浪理论的底线——违反一定错，不违反不一定对（有多种可能排列）。这三条铁律将无限的可能性大幅收缩，让数浪从\"怎么说都行\"变为有约束的科学。其中第3条（4不重叠1）是最常被违反的——一旦重叠说明之前的浪型判断有误。","highlights":[{"text":"三条铁律违反任一条=必须重新数浪","color":"red"},{"text":"铁律不保证对但保证不错——是最小可行约束","color":"green"}]}]},{"title":"第2章·斐波那契比率与目标测算","level":"必修","points":[{"t":"回调比率——找入场点","c":"2浪回调≈1浪的50%或61.8%。4浪回调≈3浪的38.2%或50%。回调到斐波那契位+出现反转K线=最佳入场区。","detail":"斐波那契不是精确价位而是目标区域。当价格回调到关键比率（如61.8%）附近，同时出现锤子线、看涨吞没等反转信号，再加上其他指标的背离确认——这个区域的入场胜率远高于随机入场。比率+形态+指标三重确认是最佳实践。","highlights":[{"text":"斐波那契=目标区域，非精确价位","color":"gold"}]},{"t":"延伸比率——找目标位","c":"3浪常见延伸=1浪的1.618倍或2.618倍。5浪目标≈(1浪起点到3浪终点)×0.618。在目标区域分批平仓。","detail":"3浪通常是推动浪中最长的一浪（因为铁律说它不能最短），常见长度是1浪的1.618倍甚至2.618倍。5浪长度常等于1浪，或等于1浪起点到3浪终点的0.618倍。到达目标区域后应分批止盈而非一次清仓——因为延展浪可能超出预期。","highlights":[{"text":"3浪常=1浪×1.618，5浪目标=通道上轨或0.618倍","color":"blue"}]}]},{"title":"第3章·各浪的特征与心理背景","level":"推荐","points":[{"t":"推动五浪的情绪温度计","c":"1浪(怀疑中起步)→2浪(恐惧回调)→3浪(共识形成最强)→4浪(获利了结震荡)→5浪(狂热冲顶缩量)。","detail":"每浪都对应集体情绪：1浪时大多数人还在怀疑\"只是反弹\"；2浪回调让抄底者恐慌；3浪突破关键位后共识形成、媒体唱多、散户涌入——这是最长最猛的一浪；4浪复杂震荡清洗跟风盘；5浪缩量冲高、散户狂热追入——聪明钱已在派发。识别情绪=知道在哪一浪。","highlights":[{"text":"3浪=共识形成+散户涌入=最长最强","color":"gold"},{"text":"5浪缩量+散户狂热=聪明钱正在出货","color":"red"}]},{"t":"调整浪的复杂性格","c":"调整浪比推动浪更复杂多变——锯齿形(5-3-5)、平台形(3-3-5)、三角形(3-3-3-3-3)。调整浪是最难数对的部分。","detail":"调整浪是波浪理论中最容易出错的部分。锯齿形调整陡峭而短促，平台形调整横向而持久，三角形调整收敛而漫长。一个实用原则：如果没有把握准确识别调整浪类型，就回到更大的时间框架——大级别的推动浪方向才是你该交易的方向。","highlights":[{"text":"数不清小级别调整浪？回到大级别沿推动方向做","color":"green"}]}]},{"title":"第4章·波浪理论的实战应用与局限","level":"必修","points":[{"t":"波浪通道——实战导航工具","c":"连接1浪终点和3浪终点画上轨→平行移到2浪终点得到下轨。5浪目标≈上轨。价格突破通道=趋势可能加速或终结。","detail":"波浪通道提供了比单纯斐波那契更直观的目标区域。在上升趋势中，价格通常运行在通道内——触及上轨是潜在5浪终点，触及下轨是有价值买入区。通道被突破（向上或向下）是重要的趋势变化信号，需要重新评估波浪计数。","highlights":[{"text":"波浪通道=最直观的目标和支撑阻力导航","color":"blue"}]},{"t":"波浪理论的实战铁则与局限","c":"铁则：①永远先确定大级别趋势方向②数不清时不交易③波浪+斐波那契+形态+指标四重确认。局限：主观性强、事后解释完美事前预测困难。","detail":"Prechter本人承认：波浪理论是概率工具而非确定性工具。最明智的使用方式：①与其他工具（趋势线、指标、成交量）结合使用②当多种计数可能时，选择与其他工具最一致的那种③数不清时宁愿不做。波浪理论提供的是框架而非答案——框架帮助你组织信息但不替你决策。","highlights":[{"text":"数不清时不交易——不交易也是重要决策","color":"red"},{"text":"波浪=框架组织信息，不替你决策","color":"purple"}]}]}],"knowledge_cards":[{"t":"推动浪铁律检查清单","c":"①2浪回调是否跌破1浪起点？(是=违反→重数)②3浪是否为1/3/5中最短的？(是=违反→重数)③4浪收盘是否进入1浪价格区域？(是=违反→重数)④1/3/5内部是否各自为5浪结构？⑤2/4内部是否各自为3浪结构？五项全满足=波浪计数大概率正确，进入下一步测算。","type":"rule"},{"t":"斐波那契比率速查表","c":"回调比率：2浪=1浪的50%或61.8%，4浪=3浪的38.2%或50%，B浪=A浪的50%、61.8%或78.6%。延伸比率：3浪=1浪的1.618、2.618倍，5浪=1浪的1.0倍或(1浪起点到3浪终点)的0.618倍，C浪=A浪的1.0、1.618倍。目标到后结合形态分批平仓。","type":"formula"},{"t":"艾略特波浪的哲学——群体心理的韵律","c":"5-3模式本质是对群体心理从怀疑→确认→狂热→幻灭循环的数学建模。推动浪=群体从分歧到共识的过程，调整浪=群体从共识回到分歧的过程。自相似性说明这种心理循环在所有时间尺度上都存在——从秒级的高频交易到世纪的超级周期。理解这一点比精确数浪更重要。","type":"concept"}],"quotes":["市场是按照自然法则运行的——而自然法则的核心是分形和比例。","当大多数分析师意见一致时，往往意味着趋势即将反转——因为推动趋势的分歧已经消失。","波浪理论给你的是一个概率框架，不是水晶球。数不清的时候，不交易就是最好的交易。"],"practice":["三大铁律数浪练习","斐波那契目标测算","波浪+指标共振确认"]},{"id":"b11","title":"威科夫方法","author":"David Weis","category":"市场理论","stage":5,"diff":4,"hours":12,"summary":"通过价量关系判断聪明钱动向。Spring弹簧+UTAD。理解市场微观结构利器。","chapters":[{"title":"第1章·追踪聪明钱的足迹","level":"必修","points":[{"t":"聪明钱vs散户——筹码交换的本质","c":"底部放量不跌=聪明钱吸筹(从散户手中接盘)。顶部放量不涨=聪明钱派发(把筹码倒给散户)。","detail":"威科夫体系的核心洞察：价格可以被操纵做出假象，但成交量无法隐藏。底部阴跌时突然放量止跌——这是聪明钱在大量接盘，散户在恐慌中交出筹码。顶部高位横盘放量却无法再创新高——这是聪明钱在对倒出货，散户在乐观中接走筹码。量在价先，量是聪明钱的足迹。","highlights":[{"text":"量在价先——成交量是聪明钱无法隐藏的足迹","color":"gold"}]},{"t":"复合操盘手(Composite Operator)","c":"威科夫把市场中所有聪明钱的集体行为抽象为\"复合操盘手\"——一个只买低卖高的理性主体。跟随他就是盈利。","detail":"不需要知道是公募、私募还是游资——把所有大资金的行为抽象为一个\"复合操盘手\"。他在底部吸筹、在拉升中测试、在顶部派发。你的任务不是预测他在做什么，而是通过价量关系识别他正在做什么，然后与之同步行动。","highlights":[{"text":"跟随复合操盘手=跟随市场中最聪明的资金","color":"purple"}]}]},{"title":"第2章·Spring弹簧与UTAD——终极反转信号","level":"必修","points":[{"t":"Spring(弹簧)=空头陷阱=最佳买入","c":"价格短暂跌破关键支撑后迅速拉回区间内。跌时放量+拉回更大量=诱空操纵确认。这是威科夫体系最强买入信号。","detail":"Spring的本质是主力制造恐慌：故意砸破支撑位引发散户止损盘涌出，然后大量接走这些廉价筹码并迅速拉回。量化识别标准：①跌破区间下沿②幅度在区间宽度的5%以内③1-3根K线内拉回④拉回时成交量大于跌破时。四项全满足=95%概率是操纵，反向买入。","highlights":[{"text":"Spring=主力制造恐慌诱空→反向买入","color":"gold"},{"text":"跌破+放量+快速拉回=95%概率是操纵","color":"green"}]},{"t":"UTAD(上冲回落)=多头陷阱=最佳卖出","c":"价格短暂突破关键阻力后迅速跌回区间内。假突破+快速反转+放量=诱多操纵确认。这是威科夫体系最强卖出信号。","detail":"UTAD(Upthrust After Distribution)是Spring的镜像：主力制造突破假象吸引追涨盘，触发空头止损和散户追多，然后大量出货导致价格迅速跌回。识别标准与Spring对称：①突破区间上沿②幅度<区间5%③1-3根K线跌回④跌回量>突破量。四项全满足=诱多确认，是最佳做空/卖出点。","highlights":[{"text":"UTAD=主力制造突破诱多→反向卖出","color":"gold"}]}]},{"title":"第3章·威科夫价格循环五阶段","level":"必修","points":[{"t":"完整的吸筹→上涨五阶段","c":"A(初步支撑/停止下跌)→B(吸筹区间/横盘)→C(Spring弹簧测试)→D(突破确认/趋势开始)→E(趋势延续)。","detail":"A阶段：下跌停止，出现初步支撑（放量止跌）。B阶段：价格在区间内震荡，聪明钱持续吸筹（缩量盘整或间歇性放量）。C阶段：Spring测试——故意砸破支撑制造恐慌，是最后一个陷阱也是最佳买点。D阶段：突破区间上沿放量确认，趋势正式启动。E阶段：趋势延续，可考虑加仓。识别当前处于哪个阶段=知道该做什么。","highlights":[{"text":"C阶段Spring=最佳买点，D阶段突破确认=趋势入场","color":"gold"}]},{"t":"派发五阶段——吸筹的镜像","c":"A(初步阻力/停止上涨)→B(派发区间/横盘)→C(UTAD上冲回落测试)→D(跌破确认)→E(下跌延续)。UTAD是最佳卖点。","detail":"派发过程的五阶段与吸筹完全对称。关键识别：B阶段高位横盘时成交量异常放大但价格不涨——这是派发最核心的特征。C阶段的UTAD测试是最佳做空时机——主力最后一次拉高出货后市场将进入下跌。威科夫方法的精髓：不追突破，等测试再入场。","highlights":[{"text":"高位放量不涨=派发核心特征→准备做空","color":"red"}]}]},{"title":"第4章·威科夫实战分析技术","level":"推荐","points":[{"t":"价量关系九宫格","c":"上涨放量=强势、上涨缩量=弱势。下跌放量=弱势、下跌缩量=强势。横盘放量=方向将出、横盘缩量=方向不确定。","detail":"将价格方向（涨/跌/横）和成交量（放量/缩量/正常）组合成九宫格判断矩阵。核心原则：放量支持的方向就是真实的方向；缩量方向的运动不可持续。此矩阵是威科夫方法中最简单实用的日常分析工具——每天花5分钟标注每根K线的价量组合，一个月后你的盘感会有质的飞跃。","highlights":[{"text":"放量方向=真实方向，缩量方向=不可持续","color":"blue"}]},{"t":"努力vs结果——威科夫最精妙的概念","c":"大量努力(高成交量)却只有微小结果(小实体K线)=努力无果=趋势衰竭信号。缩量却能大幅推进=阻力极小=趋势强劲。","detail":"这是威科夫方法中最被低估的概念。一根高成交量但实体很小的K线意味着：大量资金在博弈但价格几乎没有移动——多空激烈交锋但一方无法取胜。这通常出现在趋势转折点。相反，一根缩量长阳说明卖盘极轻、买方轻松推高价格——这是最强趋势的特征。","highlights":[{"text":"高量小实体=努力无结果=趋势衰竭","color":"gold"},{"text":"缩量长阳=阻力极小=趋势最强状态","color":"green"}]}]}],"knowledge_cards":[{"t":"Spring/UTAD量化识别四标准","c":"Spring(买入)：①价格跌破近期区间下沿②跌破幅度不超过区间宽度的5%③在1-3根K线内快速拉回区间内④拉回K线的成交量大于跌破K线的成交量。UTAD(卖出)：对称条件，向上假突破后快速跌回。四项全满足=95%概率是操纵行为，为威科夫体系最高置信度信号，可重仓入场。","type":"rule"},{"t":"威科夫吸筹五阶段识别","c":"A阶段(初步支撑)：放量止跌，出现长下影线或看涨吞没。B阶段(吸筹区间)：区间震荡，缩量为主间歇放量。C阶段(Spring)：跌破区间下沿后快速拉回，是最佳买点。D阶段(突破)：放量突破区间上沿，趋势确认。E阶段(趋势)：沿趋势运行，回调到支撑加仓。当前处于哪个阶段决定操作策略——A/B等待、C买入、D加仓、E持有。","type":"concept"},{"t":"努力vs结果分析法则","c":"对比每根K线的成交量(努力)和实体长度(结果)：①放量长阳=努力与结果一致，趋势强劲②放量小阳/十字星=大量努力微小结果，趋势可能衰竭③缩量长阳=极少努力巨大结果，卖盘极轻趋势最强④放量长阴=空方强劲。顶/底部区域出现'努力无结果'是最佳反转预警，配合Spring/UTAD使用效果更佳。","type":"rule"}],"quotes":["价格是结果，成交量是原因。研究原因比研究结果更能预判未来。","市场不是随机游走——聪明钱的行为会在价量关系中留下规律性的足迹。","大量努力却只有微小结果——这是市场告诉你趋势即将反转的方式。"],"practice":["Spring/UTAD形态识别","五阶段定位判断","努力vs结果日K标注"]},{"id":"b12","title":"笑傲股市","author":"William O'Neil","category":"选股策略","stage":4,"diff":2,"hours":12,"summary":"欧奈尔CAN SLIM选股法+带柄茶杯形态+7-8%止损铁律。研究100只超级牛股总结。","chapters":[{"title":"第1章·CAN SLIM七维选股法","level":"必修","points":[{"t":"CAN SLIM完整拆解","c":"C=当季EPS增长>25%。A=年度EPS增长>25%。N=新产品/新管理层。S=供需关系(流通盘小)。L=行业龙头(RS>80)。I=机构增持。M=大盘方向。","detail":"CAN SLIM是基本面和技术的完美融合。C和A确保公司业绩高速增长——这是牛股的发动机。N代表催化剂——新产品、新管理层或新市场是股价爆发的导火索。S和L关注供需和相对强度。I确认机构正在买入。M是最关键一条——即使前六条全满足，大盘熊市也绝对不能买入。欧奈尔研究100年超级牛股后得出：历史上的大牛股都满足CAN SLIM至少5条。","highlights":[{"text":"CANSLIM=基本面+技术面+资金面三位一体","color":"gold"},{"text":"M(大盘方向)是最重要的一条——熊市不买任何股票","color":"red"}]}]},{"title":"第2章·带柄茶杯形态——牛股发射台","level":"必修","points":[{"t":"带柄茶杯的精确量化","c":"先涨>30%→回调12-33%→杯底U型(非V型)→杯柄窄幅整理1-2周(回撤<10-15%)→突破杯柄高点放量=买入。","detail":"欧奈尔将艺术化的形态识别转化为精确的数字标准：杯深12-33%(太深=趋势破坏)、杯长7-65周、杯底必须U型(急促V型底=散户抢跑不可靠)、杯柄位于杯子上1/3处、杯柄回撤不超过10-15%、柄部成交量极度萎缩。突破杯柄高点时成交量必须大于50日均量的1.5倍。每条量化标准都源自对历史大牛股的统计。","highlights":[{"text":"杯深12-33%+杯长7-65周+杯底U型+突破放量1.5倍","color":"green"}]},{"t":"杯柄的精妙逻辑","c":"杯柄=最后的清洗——吓出最后一批不坚定的持有者。柄部缩量=卖压衰竭。柄部突破=筹码清洗完毕后的一致拉升。","detail":"杯柄是欧奈尔形态中最精妙的设计。它在杯子的右上角形成一个短暂的小幅回调(1-2周，幅度<10-15%)——这个回调清洗掉那些在杯子反弹中买入但意志不坚定的人。柄部成交量必须萎缩（说明卖压已尽），然后放量突破柄部高点——这是筹码锁定完毕、一致拉升的确认信号。没有杯柄的杯子可靠性打五折。","highlights":[{"text":"杯柄=最后的筹码清洗，无柄的杯子不可靠","color":"purple"}]}]},{"title":"第3章·7-8%止损铁律与卖出法则","level":"必修","points":[{"t":"7-8%无条件止损","c":"任何股票亏损达7-8%立即卖出——不管任何理由、不管大盘如何、不管基本面多好。这是欧奈尔从所有大亏中总结的唯一保护。","detail":"欧奈尔统计了自己的所有大亏损，发现它们都有一个共同特征：一开始只亏了7-8%时没有卖出。这个数字不是随意定的——当亏损超过8%，回本需要的涨幅越来越大(亏10%需涨11%、亏20%需涨25%、亏50%需涨100%)。7-8%止损是数学上的最优平衡点：足够宽以避免被噪音震出，足够窄以保护本金。违反这条铁律=迟早爆仓。","highlights":[{"text":"7-8%铁律止损=数学上的最优平衡点","color":"red"},{"text":"违反7%止损=所有大亏损的共同起点","color":"gold"}]},{"t":"卖出法则——什么时候止盈","c":"盈利20-25%时卖出（除非3周内达到则持有8周）。高位放量长上影、连续大涨后缩量加速、跌破50日线=顶部信号。","detail":"欧奈尔的卖出规则同样量化：大多数牛股从突破点上涨20-25%后会进入正常修正——此时应获利了结。例外：如果在3周内就涨了20%以上，说明这只股特别强势，应持有至少8周。顶部卖出信号包括：连续大涨后出现放量长上影线、连续缩量加速上涨（最后的疯狂）、跌破50日均线且放量。","highlights":[{"text":"盈利20-25%正常了结，3周内达到则持有8周","color":"green"}]}]},{"title":"第4章·欧奈尔市场方向判断","level":"推荐","points":[{"t":"大盘方向(M)是CAN SLIM的灵魂","c":"M(Market Direction)是CAN SLIM的第七条也是最重要的一条。大盘熊市时即使前六条全满足也绝不能买入任何股票。","detail":"欧奈尔研究发现：即使是最优质的牛股，在大盘熊市中也平均下跌30-50%。3/4的股票跟随大盘方向——逆大盘选股胜率极低。判断大盘方向的核心工具：①大盘指数是否在50日均线上方②跟进日(Follow-Through Day)——大盘反弹第4-7天放量上涨>1.7%=确认上升趋势。没有跟进日的反弹=不可靠。","highlights":[{"text":"跟进日=大盘反弹第4-7天放量涨>1.7%=趋势确认","color":"blue"}]},{"t":"完整CAN SLIM筛选流程","c":"Step1:E季度EPS>25%+A年度EPS>25%(筛到200只)→Step2:RS>80+机构增持(筛到50只)→Step3:识别杯柄/平底形态(筛到10只)→Step4:等突破买点+放量确认(最终1-3只)。层层过滤不妥协。","detail":"欧奈尔的筛选是一个严格的漏斗：第一层过滤掉97%的增长不够快的公司，第二层过滤掉没有主力资金关注的标的，第三层过滤掉形态不完美的股票，第四层只等最佳入场时机。整个过程可能2-3周才出现一只符合条件的标的——但一旦出现，往往是3:1盈亏比以上的高胜率机会。不妥协是关键。","highlights":[{"text":"四层漏斗层层过滤，2-3周才出一只标的","color":"purple"}]}]}],"knowledge_cards":[{"t":"CAN SLIM完整筛选漏斗","c":"Step1:当季EPS增速>25%+年度EPS增速>25%(全市场约200只达标)。Step2:RS值>80+近季度机构增持(约50只)。Step3:形态筛选——找带柄茶杯、平底、双底等突破形态(约10只)。Step4:等待精确买点——突破形态关键价位+成交量>50日均量1.5倍(最终1-3只)。每层不妥协是CAN SLIM的精髓。","type":"rule"},{"t":"7-8%止损数学原理","c":"欧奈尔统计：大多数牛股从突破点上涨20-25%后进入正常回调。盈亏比=22%:7%≈3.14:1。即使胜率只有40%，期望值=0.4×22%-0.6×7%=+4.6%正期望。7%止损的关键不是预测准不准，而是用数学确保长期正期望。亏损超过8%后回本难度指数级上升，7%是保护本金的最优阈值。","type":"formula"},{"t":"带柄茶杯形态量化标准","c":"①前期上涨>30%②杯深度12-33%(超过33%趋势破坏)③杯长度7-65周④杯底必须U型(非V型)⑤杯柄位于杯子上1/3处⑥杯柄回撤<10-15%持续1-2周⑦杯柄成交量极度萎缩⑧突破杯柄高点成交量>50日均量1.5倍。八条标准源自欧奈尔对1880年代以来所有超级牛股突破前形态的统计归纳。","type":"concept"}],"quotes":["你买的不是一只股票，而是一家公司——而且是市场上最好的那家公司。","在股市中，你的第一个损失往往是最小的损失。拖延止损是所有大亏损的共同起源。","整个投资生涯中，你能控制的只有一件事：亏多少钱。盈利交给市场，亏损掌握在自己手中。"],"practice":["CAN SLIM四层筛选","带柄茶杯形态识别","7%止损纪律训练"]},{"id":"b13","title":"通向财务自由之路","author":"Van Tharp","category":"资金管理","stage":3,"diff":3,"hours":14,"summary":"Van Tharp提出交易系统六大部分。R乘数概念彻底改变了专业交易者的资金管理方式。","chapters":[{"title":"第1章·R乘数——交易的统一度量衡","level":"必修","points":[{"t":"R=每笔交易的风险单位","c":"R=单笔交易愿意承担的最大亏损金额。赚了2R=这笔利润是风险的2倍。所有交易用R衡量才可比较。","detail":"Van Tharp革命性地提出：用R作为交易系统的统一度量衡——就像会计用\"元\"一样。一笔赚了5000元的交易和一笔赚了10000元的交易，如果前者风险是2000元(2.5R)后者风险是8000元(1.25R)，那么2.5R的交易质量远高于1.25R。R让你穿透绝对金额看到真正的交易质量。","highlights":[{"text":"R=统一度量衡——让所有交易可比","color":"gold"}]},{"t":"期望值=系统的质量评分","c":"系统期望值=平均每笔盈亏R乘数。目标>0.5R(每笔平均赚半个风险单位)。>1.0R为优秀。用R统计20笔后计算。","detail":"期望值=(胜率×平均盈利R)-(败率×平均亏损R)。例如胜率40%、盈2.5R、亏1R→期望值=0.4×2.5-0.6×1=+0.4R。任何正期望值系统，做足够多次就必然盈利。Van Tharp的核心论点：绝大多数交易者亏损不是因为入市方法不对，而是因为没有衡量过系统的期望值就盲目交易。","highlights":[{"text":"期望值>0=长期盈利，期望值>1R=优秀系统","color":"blue"}]}]},{"title":"第2章·头寸规模——决定命运的唯一变量","level":"必修","points":[{"t":"精力分配法则——60%在头寸","c":"入市策略只占系统重要性的10%+出场策略30%+头寸规模60%。但大多数交易者90%的时间花在寻找入市方法上。","detail":"Van Tharp做了一个震撼性的实验：随机入市+合理的头寸管理+正确的出场=可以盈利；完美的入市+糟糕的头寸管理=必然亏损。头寸规模决定了你在趋势中赚多少——100万账户遇到翻倍趋势，5%仓位赚5万，20%仓位赚20万，同样的趋势结果差4倍。头寸=财富杠杆。","highlights":[{"text":"头寸60%+出场30%+入市10%=真实权重","color":"gold"}]},{"t":"凯利公式——最优仓位数学解","c":"f=(bp-q)/b。b=盈亏比，p=胜率，q=败率。胜率50%+盈亏比2:1→f=25%。实战中取1/4凯利≈6.25%降低波动。","detail":"全凯利仓位=理论最优但波动极大（资金可能回撤50%+），很少有人能承受这种心理压力。Van Tharp建议取1/4凯利——牺牲一部分收益换取大幅降低的回撤。6.25%仓位在胜率50%盈亏比2:1的系统下，几乎不可能爆仓，且心理压力小到能坚持执行。活下来比最大化收益更重要。","highlights":[{"text":"全凯利=理论最优但心理不可承受，1/4凯利=生存优先","color":"red"}]}]},{"title":"第3章·交易系统六大部分","level":"必修","points":[{"t":"系统六大组件缺一不可","c":"①市场选择②头寸规模③入市④止损⑤出场⑥策略。任何一部分缺失都导致系统不完整，就像缺一个轮子的车。","detail":"Van Tharp将交易系统拆解为六个必须部分：选什么市场/品种（决定了机会池）、每次做多大仓位（决定赚多少）、什么时候入场（入场券）、错了怎么办（生存保障）、对了怎么出（锁定利润）、整体策略如何组合（多系统/多品种）。六者缺一不可——大多数\"系统\"其实只是一条入场规则，根本不是系统。","highlights":[{"text":"六部分缺一不可，只有入场规则≠交易系统","color":"gold"}]},{"t":"出场策略>入市策略","c":"出场决定盈亏比。好的出场让亏损有下限(止损)让盈利无上限(追踪止盈)。入市只是拿到入场券。","detail":"大多数人痴迷于找到\"精准\"的入场点，但Van Tharp证明：出场策略比入市重要3倍。一个好的出场体系由三部分组成：①初始止损（限制最大亏损=1R）②保本止损（浮盈到一定程度后将止损移至成本价）③追踪止盈（让利润奔跑，如移动均线或通道突破出场）。入场只是开始，出场才是结局。","highlights":[{"text":"出场决定盈亏比——入场只是门票","color":"green"}]}]},{"title":"第4章·打造你的个人交易系统","level":"推荐","points":[{"t":"系统必须匹配你的性格","c":"长线趋势跟踪不适合急性子。日内短线不适合慢性子。最好的系统不是收益最高的，是你最能坚持执行的。","detail":"Van Tharp强调：交易系统没有\"最好\"只有\"最适合\"。一个让你夜不能寐的系统，即使回测收益再高，你也执行不了——连续回撤时你会放弃它。选择系统前先问自己：你能承受多大回撤？你享受短线博弈还是长线持有？你喜欢频繁操作还是少动多看？答案决定你应该选择什么类型的系统。","highlights":[{"text":"你能坚持执行的系统=最好的系统","color":"purple"}]},{"t":"R乘数交易日志——持续进化的引擎","c":"每笔记录：入场价|止损价|1R价值|出场价|盈亏R乘数|是否按系统执行。月度统计平均R和胜率，季度评估系统。","detail":"Van Tharp的R乘数日志是系统迭代的核心工具。坚持3个月后：统计平均R>0.5说明系统可行，<0则需要检查是胜率问题还是盈亏比问题。同时标注每笔是否按系统执行——你会发现：按系统执行的交易平均R远高于违规交易。数据不会骗人，日志让你无法自欺。","highlights":[{"text":"R乘数日志=让数据取代自我欺骗","color":"blue"}]}]}],"knowledge_cards":[{"t":"凯利公式与仓位计算","c":"凯利公式：f=(bp-q)/b，其中b=盈亏比，p=胜率，q=1-p。例如胜率50%、盈亏比2:1→f=(2×0.5-0.5)/2=25%。意味着理论最优仓位为总资金的25%。实战取1/4凯利(约6.25%)可大幅降低回撤并保持正期望。仓位金额=总资金×f÷每单位风险金额。Van Tharp反复强调：保守仓位让你活得更久，而活得久是复利的前提。","type":"formula"},{"t":"R乘数交易日志模板","c":"每笔交易记录以下字段：①日期②品种③方向(多/空)④入场价⑤止损价⑥1R=入场与止损的差额⑦出场价⑧盈亏R乘数=(出场-入场)/1R⑨是否按系统执行(是/否)⑩情绪评分1-5。月度汇总：平均R乘数(目标>0.5R)、执行率(目标>90%)、触发6%熔断的天数。这是Van Tharp体系中最核心的自律工具。","type":"rule"},{"t":"系统六大组件的权重分配","c":"Van Tharp经大量回测得出的权重：头寸规模决定60%的长期业绩差异——同样的入市信号，不同仓位下收益差异可达数倍。出场策略占30%——止损决定了亏损下限、止盈决定了盈利上限，两者共同塑造盈亏比。入市策略仅占10%——只要期望值为正，随机入市配合正确的头寸和出场也能盈利。这个权重分配颠覆了99%交易者的认知。","type":"concept"}],"quotes":["你用什么方法入市根本不重要，重要的是你的仓位有多大、错了怎么办、对了怎么出。","交易系统不是找到圣杯，而是找到一套你能够日复一日坚持执行的正期望值规则。","获利不是靠预测，而是靠当趋势来临时你手上有足够大的仓位。"],"practice":["R乘数日志建立","凯利公式仓位计算","六组件系统检查"]},{"id":"b14","title":"走进我的交易室","author":"Alexander Elder","category":"资金管理","stage":4,"diff":2,"hours":12,"summary":"Elder将交易系统化为一套完整日常流程：盘前准备→执行→复盘。操作性最强著作。","chapters":[{"title":"第1章·专业交易者的完整一天","level":"必修","points":[{"t":"盘前15分钟仪式——切换大脑模式","c":"①检查隔夜外盘②确认当日财经日历③扫描自选股④确定今日交易方向⑤设定今日最大可亏损额。五步仪式化切换交易状态。","detail":"Elder强调：交易者一天中最关键的15分钟是开盘前的准备。这15分钟不是分析市场——而是把你的大脑从普通人模式切换到交易者模式。普通人模式=情绪化、从众；交易者模式=冷静、按计划。仪式感触发神经回路——坚持21天后，一到交易桌前大脑自动进入专注状态。","highlights":[{"text":"盘前仪式=大脑模式切换——普通人→交易者","color":"green"}]},{"t":"最佳交易时段法则","c":"开盘前30分钟只看不交易。黄金交易时段=开盘后30分钟-2小时。尾盘30分钟波动加大适合持仓调整。每天真正值得交易的时间只有2-3小时。","detail":"大多数业余交易者全天盯盘、频繁进出。Elder的数据显示：全天交易的人手续费和滑点吃掉大部分利润。专业做法是只在流动性最好、波动最有方向性的时段交易——A股开盘后30分钟消化隔夜信息，此后2小时方向最清晰。其他时间关掉屏幕做研究、复盘、锻炼。知道何时不交易>知道何时交易。","highlights":[{"text":"每天真正值得交易的时间只有2-3小时","color":"gold"},{"text":"开盘前30分钟只看不交易——消化而非冲动","color":"red"}]}]},{"title":"第2章·信号评分卡与入场纪律","level":"必修","points":[{"t":"信号评分卡——客观替代直觉","c":"评分维度：趋势方向(0-3分)+信号强度(0-3分)+盈亏比(0-2分)+成交量确认(0-2分)。总分≥7(满分10)才可入场。","detail":"Elder将主观判断转化为客观评分：趋势方向=周线MACD方向(顺趋势3分、逆趋势0分)；信号强度=日线RSI极端程度+蜡烛形态质量；盈亏比=潜在盈利/风险>2:1得2分；成交量=放量确认得2分。总分低于7分的\"机会\"一律放过。这个评分卡消除了\"我感觉可以\"带来的80%的劣质交易。","highlights":[{"text":"总分<7一律放过——客观评分取代主观感觉","color":"green"}]},{"t":"三重滤网在信号卡中的落地","c":"趋势方向=第一重滤网。信号强度=第二重滤网(回调到位+反转信号)。盈亏比+成交量=第三重滤网(精确入场)。","detail":"信号评分卡是为三重滤网系统定制的量化入场工具。趋势方向评分确保你顺大势（这是最重要的3分），信号强度评分确保你在回调后而不是追高中入场，盈亏比和成交量确保你有安全边际+市场确认。三者同时达标=三重滤网完全共振=可以扣动扳机。","highlights":[{"text":"评分卡=三重滤网的量化落地工具","color":"blue"}]}]},{"title":"第3章·收盘复盘——从经验到进化","level":"必修","points":[{"t":"每日收盘复盘四问","c":"①今天我遵守交易规则了吗？②我的信号判断对了吗？③我的情绪状态如何(1-5分)？④明天我要改进什么？","detail":"Elder认为不复盘等于不做体检——你不知道自己的交易在走向健康还是疾病。坚持一个月后你会发现规律：70%的亏损发生在情绪≥4的日子，80%的盈利来自评分≥8的交易。复盘的核心不是苛责自己而是发现模式——看到模式=改变的开始。数据是镜子，照出真实的你。","highlights":[{"text":"不复盘=不做体检——你不知道在走向健康还是疾病","color":"red"}]},{"t":"周末深度统计——发现你的盈亏DNA","c":"统计维度：按星期几、按时段、按品种、按情绪评分、按评分卡得分。找到你最容易赚钱和最常亏钱的模式。","detail":"日复盘看到现象，周复盘看到规律。Elder建议每个周末花2小时做深度统计：周几交易效果最好？哪个时段容易冲动？哪个品种适合你的节奏？情绪评分和盈亏的相关性？评分卡得分和盈亏的相关性？坚持一个季度你会发现自己的\"盈亏DNA\"——比如你是\"周一适合、周三回避、午后容易亏损\"的类型。顺应自己的模式比对抗它有效10倍。","highlights":[{"text":"周末深度统计=发现你的盈亏DNA","color":"purple"}]}]},{"title":"第4章·专业交易者的八条习惯","level":"推荐","points":[{"t":"八条习惯清单","c":"①固定作息②盘前/盘后仪式③只用可亏资金④每笔预设止损⑤不做无计划交易⑥坚持交易日志⑦定期回顾统计⑧保持身体锻炼。","detail":"Elder观察到：长期盈利的交易者不一定是技术最好的，但一定是习惯最好的。这八条习惯构成了交易者的基础设施——就像运动员的体能训练，它不直接创造利润但决定了你能在高强度环境中持续多久。其中最被低估的是⑧保持锻炼——身体状态直接影响决策质量，疲劳时做出的交易决策80%是亏损的。","highlights":[{"text":"长期盈利者=习惯最好的人，不一定是技术最好的","color":"gold"}]},{"t":"交易室环境设计","c":"交易桌只放交易必需——清除干扰源。屏幕布局：主屏=日线+小时线、副屏=周线+自选。手机推送到另一房间。","detail":"Elder的交易室原则：极简。桌面上只有交易设备和水——没有手机、没有新闻网站、没有社交软件。多屏幕布局遵循\"从大到小\"：最左边的屏幕显示周线（战略）、中间屏幕显示日线和小时线（战术）、右边屏幕显示自选股列表和委托。手机放到另一个房间——减少80%的无效盯盘和冲动交易。","highlights":[{"text":"手机放到另一个房间=减少80%的冲动交易","color":"green"}]}]}],"knowledge_cards":[{"t":"专业交易者完整日常流程","c":"盘前(15分钟)：①隔夜外盘②财经日历③自选股扫描④确定方向⑤设定最大亏损额。盘中：开盘30分钟只看不交易→黄金时段(开盘后0.5-2h)执行评分卡≥7的交易→其他时间关屏幕远离。盘后(15分钟)：复盘四问+记录日志。周末(2小时)：深度统计盈亏模式、评估系统、设定下周目标。坚持21天形成习惯。","type":"rule"},{"t":"信号评分卡量化标准","c":"趋势方向(0-3分)：周线MACD方向顺=3分、平=1分、逆=0分。信号强度(0-3分)：日线RSI极端+反转K线=3分、仅有RSI极端=2分、仅有K线=1分。盈亏比(0-2分)：>3:1=2分、2-3:1=1分、<2:1=0分。成交量(0-2分)：突破放量1.5倍均量=2分、放量但不达标=1分、缩量=0分。总分<7不做，≥8优。","type":"rule"},{"t":"业余vs专业的本质区别","c":"业余者：没有固定流程、凭感觉交易、全天盯盘、不做日志、只在亏损时学习。专业者：每天固定仪式、按评分卡执行、只在黄金时段交易、坚持日志复盘、每天精进1%。Elder指出二者最大区别不在技术而在习惯——专业者的日常流程保证了长期稳定的决策质量，业余者的随机性保证了长期稳定的亏损。","type":"concept"}],"quotes":["业余者等着交易来找他，专业者每天按照固定流程扫描市场。","交易室应该像手术室——干净、安静、没有干扰，因为你正在做的是切除自己账户中的亏损。","一天中最重要的工作不是在交易时段完成的，而是在交易开始前和结束后完成的。"],"practice":["建立交易日流程模板","信号评分卡实操","周末深度复盘统计"]},{"id":"b15","title":"证券分析","author":"Graham/Dodd","category":"价值投资","stage":6,"diff":5,"hours":25,"summary":"1934年出版价值投资奠基圣经。安全边际+内在价值+固定收益分析三支柱。巴菲特称其改变了他人生的两本书之一。","chapters":[{"title":"第1章·安全边际原理","level":"必修","points":[{"t":"价值投资的唯一护身符","c":"安全边际=内在价值-买入价格。价值1元的东西用0.5元买，即使估值偏差30%仍不会亏损本金。","detail":"安全边际的精髓不在于追求收益，而在于为错误预留空间。人性会犯错、估值会偏差、黑天鹅会降临——安全边际是唯一能穿越这一切的护身符。","highlights":[{"text":"核心：安全边际=为错误预留空间","color":"gold"}]},{"t":"定量与定性的双重边际","c":"定量边际=价格低于账面价值或清算价值。定性边际=护城河、管理层、行业地位提供的额外保护层。","detail":"格雷厄姆更重视定量边际，因为他经历过大萧条——定性优势可能在危机中一夜消失，但定量折扣永远存在。两者叠加是最强组合。","highlights":[{"text":"规则：定量边际优先，定性边际加分","color":"green"}]}]},{"title":"第2章·固定价值投资：债券分析","level":"必修","points":[{"t":"债券筛选的四项测试","c":"利息保障倍数>3倍+资产负债率<50%+市值/债务比+盈利稳定性。四项全过才值得持有。","detail":"原书近一半篇幅讲债券——这是被大多数投资者忽略的宝藏。债券分析教会我们：先确保不亏，再谈赚钱。股票分析的一切方法论都源于债券分析的严谨框架。","highlights":[{"text":"核心：债券分析的严谨性是股票分析的基石","color":"gold"}]},{"t":"优先证券的优先级思维","c":"先判断公司能否生存（债券偿付能力），再判断是否低估（股票投资价值）。这个顺序不能颠倒。","detail":"格雷厄姆教导：当你分析一家公司的股票时，先假装自己是一个债券持有人。如果债券持有人都不安全，股东就更危险。这一思维框架避免了无数踩雷。","highlights":[{"text":"框架：先判断偿付能力，再看投资价值","color":"green"}]}]},{"title":"第3章·普通股投资的分析框架","level":"必修","points":[{"t":"三要素估值模型","c":"内在价值=资产价值+盈利能力价值+成长价值。资产和盈利可量化，成长最不可靠——给最低权重。","detail":"格老对成长性极度保守。他认为未来的盈利增长本质上是投机而非投资。如果必须考虑成长，必须确保增长率有长达7-10年的历史数据支撑，且不能超过行业增长上限。","highlights":[{"text":"公式：内在价值=资产+盈利+成长（最小权重）","color":"gold"}]},{"t":"比较分析法","c":"同行业内至少对比5家公司：PE、PB、ROE、股息率、负债率。只买各项指标排名前2且显著低估的那只。","detail":"格雷厄姆从不凭空判断一家公司是否便宜——必须有可比基准。同类公司横向对比+历史数据纵向对比，双重验证后才能确认低估。这是避免价值陷阱的核心方法。","highlights":[{"text":"规则：横向5家对比+纵向7年验证","color":"green"}]}]},{"title":"第4章·资产负债表与清算价值","level":"推荐","points":[{"t":"净流动资产法（Net-Net）","c":"市值<流动资产-总负债=净流动资产价值。买价低于净流动资产的2/3，等于白捡公司还倒贴钱。","detail":"这是格雷厄姆在大萧条后发展出的终极保守策略。当股价跌破净流动资产时，意味着市场认为公司的固定资产和持续经营价值为负——这几乎不可能长期持续。巴菲特早期靠这一策略取得惊人回报。","highlights":[{"text":"公式：Net-Net=市值<(流动资产-总负债)×2/3","color":"gold"}]},{"t":"清算价值vs持续经营价值","c":"清算价值=现在就关门能拿回多少钱。持续经营价值=继续运营未来能赚多少钱。两者取较低者作为安全基准。","detail":"格雷厄姆从不预测未来。他只问：如果明天公司就破产，我的投资还安全吗？这种极端保守思维恰恰是价值投资者穿越周期的底层逻辑。先确保不会死，再考虑怎么活得好。","highlights":[{"text":"核心：以清算价值为底，盈利价值为翼","color":"gold"}]}]},{"title":"第5章·市场波动与投资心理","level":"推荐","points":[{"t":"区分投资与投机","c":"投资=经过透彻分析、保证本金安全、获得满意回报。三条缺一不可。投机=不符合以上任一条件的操作。","detail":"格雷厄姆不反对投机，但他坚持两者必须严格区分。他痛斥「把投机包装成投资」的行为——这是1929年大崩盘的根本原因，也是每一次泡沫的共同特征。你可以在投机账户赌一把，但绝不能让投资账户沾上投机。","highlights":[{"text":"定义：投资=透彻分析+本金安全+满意回报","color":"gold"}]},{"t":"价格的长期回归","c":"短期是投票机（情绪决定），长期是称重机（价值决定）。价格终将回归内在价值，但时间不可预测。","detail":"这句话虽出自格雷厄姆，但他补充了最重要的一点：价格回归的前提是企业价值确实存在。如果企业本身在毁灭价值，低价买入只是便宜地买了一堆废铁。验证价值存在比等待回归更重要。","highlights":[{"text":"核心：短期投票机，长期称重机","color":"gold"}]}]}],"knowledge_cards":[{"t":"安全边际三重计算","c":"安全边际率=(内在价值-买入价)/内在价值×100%，目标≥30%。内在价值取以下三者最低：①净流动资产价值②7-10年均EPS×(8-12倍PE)③账面价值×0.7。三重取最低是为估值偏差预留双重保护，宁可错过不可买贵。","type":"formula"},{"t":"固定收益证券检验清单","c":"投资级债券必须通过四道检验：①利息保障倍数≥3倍（息税前利润/利息费用）；②资产负债率≤50%；③市值不低于总债务的1.5倍；④过去7年中至少有5年盈利覆盖利息。任何一项不达标即降为非投资级，需更高的安全边际补偿。","type":"rule"}],"quotes":["投资的核心是用5毛钱买入价值1块钱的东西。","市场短期是一台投票机，但长期是一台称重机。"],"practice":["计算持仓安全边际率","用净流动资产法筛股"]},{"id":"b16","title":"聪明的投资者","author":"Benjamin Graham","category":"价值投资","stage":6,"diff":3,"hours":14,"summary":"巴菲特称「有史以来最好的投资书籍」。防御型vs进取型投资者的完整操作手册，市场先生寓言是投资心理学的巅峰隐喻。","chapters":[{"title":"第1章·防御型投资者的组合策略","level":"必修","points":[{"t":"50/50股债基准+再平衡","c":"股票与债券各占50%，每半年检查一次，偏离超过5%即调整。熊市债转股，牛市股转债——自动实现低买高卖。","detail":"这个被严重低估的策略年化收益6-8%，最大回撤不到15%。它不依赖任何预测能力——只需要纪律。格雷厄姆说：防御型投资者最需要的不是聪明，是不被情绪左右的耐心。","highlights":[{"text":"规则：50/50+半年度再平衡=自动逆向投资","color":"green"}]},{"t":"选股七条标准","c":"①足够规模②强劲财务③连续20年分红④10年EPS增长≥33%⑤PE<15⑥PB<1.5⑦PE×PB<22.5。七条全过才买。","detail":"格雷厄姆为不想动脑的防御型投资者设计了一套傻瓜筛选标准。看似严苛，但满足全部条件的公司几乎不可能破产——先立于不败，再求胜。随着时代变迁，标准可适度放宽，但严格筛选的精神不能丢。","highlights":[{"text":"规则：七条全过才买入，缺一不可","color":"green"}]}]},{"title":"第2章·市场先生寓言","level":"必修","points":[{"t":"狂躁抑郁的合伙人","c":"每一天市场先生都敲门报价。他情绪极不稳定：乐观时报天价，悲观时报地板价。你的权利是不理他，或者在极端价格时利用他。","detail":"这是投资史上最伟大的隐喻。大多数人被市场先生牵着鼻子走——他报高价就兴奋加仓，报低价就恐慌割肉。真正的聪明投资者把自己当成市场先生的老板：他来报价是他的事，接不接受完全由你决定。","highlights":[{"text":"核心：市场先生是仆人，不是主人","color":"gold"}]},{"t":"极端情绪的量化","c":"极度悲观=全民恐慌+成交量地量+利好不涨+PE处于10年最低分位。极度乐观=全民炒股+天量+利空不跌+PE处于10年最高。","detail":"格雷厄姆没有给出精确数字，但指出了方向。将市场情绪量化后，反向操作就变成了科学而非艺术。当所有信号指向极端，行动的概率优势最大——不需要精确择时，只需要在极端区域下注。","highlights":[{"text":"规则：极端情绪≥3个信号=反向行动","color":"green"}]}]},{"title":"第3章·进取型投资者的选股方法","level":"必修","points":[{"t":"四种操作模式","c":"①买低价普通股（低于净流动资产）②买特殊情况的套利机会③买被忽视的二线成长股④在熊市底部大举买入指数。","detail":"格雷厄姆警告：进取不意味着频繁交易——恰恰相反。真正的进取型投资者一年可能只做2-3笔交易。其余时间都在研究和等待。频繁交易是防御型投资者冒充进取型的致命错误。","highlights":[{"text":"核心：进取=深度研究不是频繁交易","color":"gold"}]},{"t":"相对低估法","c":"同行业找PE最低且ROE最高的公司。如果PE低于行业均值30%而ROE高于行业均值，则存在相对低估的套利空间。","detail":"这是一种介于防御型和激进型之间的方法——不需要对公司做绝对估值，只需要在行业内做相对比较。格雷厄姆称之为「不需要天才的判断力」。尤其适合那些知识面窄但深度深的投资者。","highlights":[{"text":"公式：PE<行业均值×0.7 + ROE>行业均值","color":"gold"}]}]},{"title":"第4章·基金、投顾与你","level":"推荐","points":[{"t":"指数基金的智慧","c":"大多数主动基金长期跑不赢指数——扣费后更是惨败。防御型投资者买低费率指数基金>雇用任何投资顾问。","detail":"格雷厄姆在1976年（指数基金诞生同年）就预见了被动投资的崛起。他直言：与其把钱交给一个你无法判断其真实水平的基金经理，不如直接拥有整个市场。这个判断比博格早了二十年。","highlights":[{"text":"核心：买指数=最聪明的防御策略","color":"gold"}]},{"t":"如何评估投资顾问","c":"①是否用「保证收益」话术→直接排除②是否公开全部历史业绩（含回撤）③收费结构是否鼓励过度交易④他自己是否跟投。","detail":"格雷厄姆在华尔街摸爬滚打数十年，深知这个行业的信息不对称。他总结的投资顾问筛选标准到今天依然适用——如果一个投顾经不起这四条拷问，你最好自己管钱。","highlights":[{"text":"警示：四问投顾，答不上来的别用","color":"red"}]}]},{"title":"第5章·安全边际：投资的中心思想","level":"必修","points":[{"t":"贯穿一切的原则","c":"安全边际不仅是估值公式——它是一种思维方式。债券需要利息覆盖倍数，股票需要价格折扣，分散化本身就是安全边际的一种形式。","detail":"全书最后一章压轴。格雷厄姆用安全边际把分散化、债券分析、股票估值、资产配置全部串在一起。投资中所有正确的决策最终都可以归结为：你是否为自己预留了足够的犯错空间。","highlights":[{"text":"核心：安全边际=投资世界的第一性原理","color":"gold"}]},{"t":"分散化=概率安全边际","c":"持有10-30只股票不是不自信——是承认自己会犯错。单只可能归零，组合中个别归零不影响整体。分散化是概率层面的安全边际。","detail":"格雷厄姆的分散化不是随意撒网。他要求每只股票都必须独立满足低估条件，不能因为买得多就降低单只标准。这是格雷厄姆分散化与盲目撒网的唯一区别。","highlights":[{"text":"规则：10-30只，每只独立满足低估标准","color":"green"}]}]}],"knowledge_cards":[{"t":"格雷厄姆数筛选法","c":"格雷厄姆数=PE×PB，当PE×PB<22.5时可能存在低估。现代改良版需附加两个条件：①ROE连续5年>10%以确保盈利质量②流动比率>1.5以确保偿债安全。单纯满足格雷厄姆数可能落入价值陷阱（企业持续恶化导致PE和PB看似低实则合理），必须结合盈利趋势判断。","type":"formula"},{"t":"防御型投资者年检清单","c":"每半年执行一次：①股债比例偏离目标≥5%→再平衡②组合中是否有亏损超30%且基本面恶化的个股→卖出③是否有连续两年不分红的个股→评估④总费率是否超过0.5%→换低费率产品⑤过去一年是否有追涨杀跌的情绪化操作→记录反思。这份清单帮助投资者把复杂决策简化为固定流程，用规则代替情绪。","type":"rule"}],"quotes":["投资的首要原则是不要亏钱，第二条是记住第一条。","投资者最大的敌人不是股市，而是自己。"],"practice":["制定个人50/50再平衡日历","用格雷厄姆数筛选A股"]},{"id":"b17","title":"炒股的智慧","author":"陈江挺","category":"实战","stage":1,"diff":1,"hours":8,"summary":"华人在华尔街从散户做到专业交易员的传奇。用中文写出最接地气的交易入门书——没有复杂公式，只有血的教训。","chapters":[{"title":"第1章·认清身份","level":"必修","points":[{"t":"投资者vs投机者","c":"两者思维方式完全不同。用投机心态做投资+用投资心态做投机=必亏。先明确身份再执行。","detail":"大跌时安慰自己长期投资不用止损——但当初明明是追涨投机。身份混乱=决策混乱=亏损。","highlights":[{"text":"核心：明确定位——投资和投机完全不同","color":"gold"}]}]},{"title":"第2章·止损是铁律","level":"必修","points":[{"t":"止损数学原理","c":"亏10%需涨11%回本，亏50%需涨100%，亏90%需涨900%。深度亏损=亏钱+亏时间双重损失。","detail":"公式：回本=1/(1-亏损率)-1。指数关系。100跌50需涨100%回——平均需3-5年。","highlights":[{"text":"公式：回本=1/(1-亏损率)-1","color":"gold"},{"text":"警示：深度亏损=亏钱+亏时间","color":"red"}]},{"t":"四种止损方法","c":"固定比例+技术止损+时间止损+资金止损。资金止损是底线——到了就砍不问理由。","detail":"固定比例最简单有效。时间止损常被忽视：买入理由'短期涨'但2周不涨=时机不对。","highlights":[{"text":"规则：资金止损是底线","color":"green"}]}]},{"title":"第3章·等待的艺术","level":"必修","points":[{"t":"空仓=最高境界","c":"不会空仓的人永远不会炒股。至少50%时间保持空仓或轻仓。","detail":"空仓=旁观者清醒。持仓=参与者判断力打对折。不是放弃机会是等待最好机会。","highlights":[{"text":"核心：空仓=区分专业和业余的关键","color":"gold"}]},{"t":"四个出手条件","c":"趋势明确+安全边际+盈亏比≥3:1+明确止损位。缺一不可。一年3-5次足矣。","detail":"全年做50次其中40次不符合=亏。筛选严格才能保证质量。","highlights":[{"text":"规则：四条件全满足才出手","color":"green"}]}]},{"title":"第4章·顺势而为","level":"推荐","points":[{"t":"不同市况不同策略","c":"牛市持股不动+熊市空仓+震荡市波段。永远不一招鲜吃遍天。","detail":"牛市高抛低吸=错过大趋势。熊市抄底=接飞刀。关键是根据环境切换策略。","highlights":[{"text":"规则：牛市持有→熊市空仓→震荡波段","color":"green"}]},{"t":"仓位决定心态","c":"单笔≤总资产4-6%。轻仓才能理性判断。满仓=丧失判断力。","detail":"没有后顾之忧的交易最理性。总资产20-30%入市×单笔20%=单笔4-6%风险。","highlights":[{"text":"规则：单笔≤总资产4-6%","color":"green"}]}]}],"knowledge_cards":[{"t":"止损数学","c":"亏损5%需5.3%回本,10%需11%,20%需25%,50%需100%,90%需900%。公式:回本=1/(1-亏损率)-1。","type":"formula"},{"t":"空仓的力量","c":"无明确判断时最好操作=不操作。至少50%时间空仓或轻仓。空仓=清醒,持仓=判断打折。","type":"rule"}],"quotes":["炒股其实就是炒自己。","在股市里，慢就是快。"],"practice":["止损设定实操","空仓等待的心态训练"]},{"id":"b18","title":"股市进阶之道","author":"李杰（水晶苍蝇拍）","category":"价值投资","stage":6,"diff":3,"hours":14,"summary":"A股本土价值投资的系统方法论。好行业×好公司×好价格三位一体，填补了经典价值投资理论在A股的本土化空白。","chapters":[{"title":"第1章·A股市场的独特性与规律","level":"必修","points":[{"t":"散户市+政策市的双重烙印","c":"A股散户交易占比长期超70%，远高于美股。流动性驱动>基本面驱动，货币政策拐点=市场拐点。先看宏观再看个股。","detail":"格雷厄姆的框架在美国好用，但在A股直接套用经常失灵。原因就在于A股的定价权不在基本面投资者手中——散户群体行为和货币政策的影响力远大于成熟市场。理解这套博弈规则是A股生存的前提。","highlights":[{"text":"核心：A股=流动性市，先看水再看鱼","color":"gold"}]},{"t":"政策先行，估值跟随","c":"产业政策支持→资金涌入→估值扩张→业绩兑现。四个阶段中，前两个阶段是A股最容易赚钱的窗口——但要警惕第三阶段后的估值回归。","detail":"A股每轮牛市的领涨板块几乎都与当时的产业政策高度相关。这不是巧合——政策决定了资金流向和盈利预期。聪明的投资者不猜测政策，但会观察政策落地后的产业趋势变化。","highlights":[{"text":"框架：政策→资金→估值→业绩，顺第一二阶段","color":"gold"}]}]},{"title":"第2章·市场底部与顶部的识别","level":"必修","points":[{"t":"底部五信号体系","c":"①破净股数>100只②成交额不足峰值10%③IPO大面积破发④身边无人谈论股票⑤利好不涨甚至高开低走。≥3个信号=底部区域。","detail":"不要等精准底部——那是神仙做的事。底部是一个区域，在一个区域里分批买入，成本自然摊平在低位。等所有信号都确认时，往往已经反弹了20%。","highlights":[{"text":"规则：五信号≥3=底部区域，分批建仓","color":"green"}]},{"t":"顶部三异常","c":"①全民荐股（出租车司机都在推荐）②天量成交且滞涨③垃圾股与绩优股同涨甚至垃圾更猛。三个异常同时出现=系统性风险。","detail":"顶部比底部更难判断——因为泡沫可以持续很久。但顶部三异常是A股历史上每轮牛市见顶时的共同特征。当身边从不炒股的人开始炫耀收益，就是该离开的信号。","highlights":[{"text":"警示：全民荐股+天量滞涨+鸡犬升天=顶部","color":"red"}]}]},{"title":"第3章·好行业的筛选标准","level":"必修","points":[{"t":"行业天花板的量化评估","c":"市场空间>千亿+当前渗透率<30%+政策支持+无颠覆性替代品。同时满足四项的行业才能进入候选池。","detail":"渗透率是最容易被忽略但最重要的指标。渗透率<10%=导入期（高不确定性高赔率），10%-30%=成长期（最佳投资窗口），30%-50%=成熟期（竞争加剧利润变薄），>50%=衰退期（只适合做周期）。","highlights":[{"text":"核心：渗透率10-30%的成长期是最佳窗口","color":"gold"}]},{"t":"竞争格局>行业增速","c":"一个年增长5%但寡头垄断的行业，比年增长30%但群雄混战的行业更容易出牛股。格局稳定=利润可持续=估值可持续。","detail":"太多投资者追逐高增长行业却亏了钱——因为高增长吸引大量竞争者涌入，每家都赚不到钱。李杰用空调行业（格力美的双寡头）vs共享单车（百团大战全军覆没）的对比，生动说明了格局比增速更重要。","highlights":[{"text":"规则：选格局稳定的慢行业，不选混战的快行业","color":"green"}]}]},{"title":"第4章·好公司的识别与商业模式","level":"必修","points":[{"t":"ROE杜邦三维拆解","c":"ROE=净利率×总资产周转率×杠杆倍数。高ROE的来源不同，公司质地天差地别。高净利率>高周转率>高杠杆。","detail":"高净利率驱动=品牌溢价或技术壁垒（茅台、恒瑞），可持续性最强。高周转驱动=运营效率（沃尔玛、美的），管理能力是关键。高杠杆驱动=金融或地产（银行、万科），周期性风险最大。买之前先搞清楚公司赚的是什么钱。","highlights":[{"text":"框架：净利率驱动>周转驱动>杠杆驱动","color":"gold"}]},{"t":"护城河的五种形态","c":"①品牌壁垒②技术专利③网络效应④规模成本优势⑤转换成本。一家好公司至少拥有其中一种且持续强化。","detail":"A股公司的护城河要格外警惕「伪护城河」：靠牌照垄断不是护城河（政策可改），靠关系拿单不是护城河（人事可换），靠风口爆发不是护城河（风停了就摔）。真正的护城河是竞争对手想模仿也模仿不了的。","highlights":[{"text":"警示：牌照、关系、风口≠真护城河","color":"red"}]}]},{"title":"第5章·好价格：估值与买入","level":"推荐","points":[{"t":"三重估值交叉验证","c":"①历史PE分位<30%+②PE<行业均值×0.7+③PE<盈利增速。三重同时满足=好价格。缺一不可。","detail":"单一估值指标都有缺陷：历史分位可能因基本面恶化而失真，行业对比可能忽略个股差异，PEG对周期股无效。三重交叉验证就是为了避免单一指标的盲区。","highlights":[{"text":"规则：三重估值交叉验证=好价格","color":"green"}]},{"t":"分批买入的铁律","c":"确认底部区域后至少分3批买入，每批间隔≥1个月或价格下跌≥5%。永远不要一把梭——你无法确定最低点。","detail":"李杰在书中反复强调一个看似矛盾的原则：对价值判断要自信，对市场判断要谦卑。你确信这只股票值100元，但不知道市场什么时候会涨到100元。分批买入就是为这个「不知道」预留的容错空间。","highlights":[{"text":"规则：分3批以上，间隔≥1个月或跌5%","color":"green"}]}]}],"knowledge_cards":[{"t":"A股底部五信号识别法","c":"五信号分别为：①全市场破净公司数量>100家②日均成交额低于过去一年峰值的10%③当月IPO首日破发比例>30%④日常社交圈中连续一个月无人主动聊股票⑤重大利好发布后股价高开低走或毫无反应。五个信号中出现三个或以上即可判断市场处于底部区域，应采取分批建仓策略。信号越多，底部确定性越高，但不必等全部出现再行动。","type":"rule"},{"t":"行业天花板与渗透率评估框架","c":"好行业需满足：可触达市场空间≥1000亿元、当前渗透率处于10%-30%的快速成长期、国家产业政策明确支持且无颠覆性替代技术出现。渗透率<10%为导入期高风险高回报、10%-30%为成长期最佳投资窗口、30%-50%进入成熟期竞争加剧利润收窄、>50%接近饱和只适合做周期性波段。对行业天花板的准确判断决定了持仓周期和预期收益率的上限。","type":"rule"}],"quotes":["买股票就是买公司，而不是买一串代码。","最怕的不是亏钱，是用错误的方法赚到了钱——因为你会继续错下去。"],"practice":["每周统计A股底部五信号","选3个行业计算渗透率区间"]},{"id":"b19","title":"股票大作手操盘术","author":"Jesse Livermore","category":"交易系统","stage":4,"diff":3,"hours":8,"summary":"利弗莫尔1940年亲笔撰写的交易规则手册，是其一生四次暴富又破产后的终极领悟。关键点买入法+金字塔加仓+价格记录法三大支柱。","chapters":[{"title":"第1章·关键点交易法","level":"必修","points":[{"t":"两种关键点的精确定义","c":"自然关键点=上升趋势中价格回调至前期支撑位企稳。延续关键点=价格突破长期盘整区间的上沿——这是最赚钱的信号。","detail":"关键点的本质是多空力量的第二次对决。第一次对决决定趋势方向，第二次对决确认趋势能否延续。盘整时间越长，突破后的爆发力越强。利弗莫尔从不抢跑——他等待价格自己证明方向正确后再入场。","highlights":[{"text":"核心：关键点=多空第二次对决的胜负手","color":"gold"}]},{"t":"关键点确认的三步验证","c":"①价格突破关键点②成交量显著放大（≥20日均量1.5倍）③突破后连续3根K线收盘未跌回。三步全满足=确认有效。","detail":"利弗莫尔受过太多假突破的伤后总结出这套验证流程。假突破的特征是放量后迅速缩量回归——真正的突破应该有持续的量能支撑。宁可错过真突破的前5%，也不冒险赌假突破的100%。","highlights":[{"text":"规则：突破+放量+3K确认=有效关键点","color":"green"}]}]},{"title":"第2章·金字塔式加仓策略","level":"必修","points":[{"t":"精确到数字的加仓规则","c":"初始仓位1单位→价格朝有利方向运行≥3个点后加1单位→再运行≥3点再加1单位→总仓位最多5单位。每次加仓后新止损=倒数第二次加仓价格。","detail":"利弗莫尔用精确的数字取代感觉——这是他从破产中学到的最惨痛教训。他最辉煌的交易都严格遵守这套数字规则，而每一次破产都源于放弃了规则、凭直觉加仓。数字让你无法自欺欺人。","highlights":[{"text":"公式：1→+3点→+1→+3点→+1→最大5","color":"gold"}]},{"t":"回调超过2/3=全平","c":"如果价格从最高点回调超过本轮涨幅的2/3，不管什么原因全部平仓。保护已到手的利润比追逐更多利润重要一百倍。","detail":"这个2/3规则是利弗莫尔风控体系的核心。它意味着：利润必须被保护，不能让它全部回吐。很多人从大赚到大亏的转折点就是没有执行类似的硬止损——总觉得会涨回来。利弗莫尔说：市场从不关心你的成本，它只会朝阻力最小的方向运动。","highlights":[{"text":"规则：回调超2/3全平，不论理由","color":"red"}]}]},{"title":"第3章·价格记录法与趋势感知","level":"推荐","points":[{"t":"六栏记录法","c":"手写表格设六栏：上升趋势、下降趋势、自然回升、自然回撤、次级回升、次级回撤。每日记录价格所属栏位，趋势转变一目了然。","detail":"今天有K线图，为什么还要学手写记录？因为手写的过程强迫你与市场对话——每一笔记录都是一次微型判断。当你亲手写下「从上升趋势转为自然回撤」时，你对趋势转换的敏感度远超看软件图表。","highlights":[{"text":"核心：手写=强制感知，不是记录是对话","color":"gold"}]},{"t":"双价格确认原则","c":"不仅要看收盘价，还要结合日内高低点。如果高低点同时抬高=强势延续，高低点同时下移=趋势反转，高低点方向背离=市场犹豫。","detail":"利弗莫尔的价格记录法最精妙之处在于同时跟踪高点和低点。单看收盘价可能会错过日内反转信号——高低点同时下移往往是趋势变盘的第一声警钟。","highlights":[{"text":"规则：高低点同向=趋势延续，背离=犹豫","color":"green"}]}]},{"title":"第4章·资金管理与交易纪律","level":"必修","points":[{"t":"永不摊平亏损","c":"第一笔交易亏损说明方向判断错误——此时唯一正确的操作是止损出局。加仓摊平=把错误放大，是通往破产的最快路径。","detail":"利弗莫尔用四次破产证明了一个真理：亏损的头寸不会因为你买得更多就变成正确的头寸。市场不会同情你——它只会奖励正确的人。当你的仓位出现亏损，市场已经告诉你：你错了。剩下的事就是认错。","highlights":[{"text":"铁律：亏损仓位永不补仓，只可止损","color":"red"}]},{"t":"利润储备金制度","c":"每次盈利后将50%的利润提取出账户，转入不可动用的储备金。这样即使后续连续亏损，也永远有东山再起的资本。","detail":"这是利弗莫尔用一生血泪换来的教训。他四次从零开始东山再起，但最后一次破产后没有钱再翻身——因为他把全部利润都留在账户里继续加杠杆。如果早建立利润储备金制度，他的人生结局可能完全不同。","highlights":[{"text":"规则：每次盈利提50%利润=永远有退路","color":"green"}]}]}],"knowledge_cards":[{"t":"金字塔加仓精确执行规则","c":"初始仓位为1个交易单位（单笔风险不超过总资金2%）。价格朝有利方向运行≥3个点（约3%）后加仓1单位，再运行≥3点再加1单位，总仓位最多不超过5单位。每次加仓后的新止损价设在倒数第二次加仓的成交价位置。价格从最高点回调超过本轮涨幅的2/3时，不论任何原因，全部仓位立即平掉。这套规则的数学基础是：始终让盈利仓位大于亏损仓位，同时确保任何单笔交易的亏损可控。","type":"formula"},{"t":"关键点识别与确认规则","c":"自然关键点出现在上升趋势中的回调低点，该位置必须是前一次上涨中多空激烈争夺的价格区间。延续关键点出现在价格突破盘整区间上沿时，盘整时间至少需要3周以上才有参考价值。突破确认需同时满足：①收盘价明确突破关键价位②当日成交量超过20日均量的1.5倍③突破后连续3根K线收盘不跌回关键点之下。假突破通常量能不足或迅速回撤，这三种特征能过滤掉70%以上的假信号。","type":"rule"}],"quotes":["投机是一项严肃的事业，而不是赌博。","市场永远不会错，但意见经常会错。"],"practice":["每日手写关键点价格记录","模拟金字塔加仓计算练习"]},{"id":"b20","title":"华尔街幽灵","author":"Arthur Simpson（幽灵）","category":"交易系统","stage":3,"diff":2,"hours":8,"summary":"匿名交易大师以对话体传授的三条幽灵法则。极简至极的三条规则，却直指交易中最本质的防守哲学——不亏比多赚重要一万倍。","chapters":[{"title":"第1章·法则一：只持有正确的仓位","level":"必修","points":[{"t":"未被证明正确=错误","c":"入场后如果在预定时间框架内（如N根K线）价格未朝有利方向运动，不管是否触及止损位，立即平仓。","detail":"这是幽灵法则中最反直觉的一条。传统交易者等止损触发，幽灵说：不赚钱就是错。时间的流逝本身就是一种成本——你的资金被占用了，机会成本在累积。这看似激进，实则是最深刻的对资金效率的尊重。","highlights":[{"text":"核心：不赚钱=错误，时间也是成本","color":"gold"}]},{"t":"时间止损的操作标准","c":"小时图入场后3根K线无利润→平仓。日线图3天未脱离成本区→平仓。周线图2周无方向→平仓。K线数量=你对这笔交易的信心度。","detail":"时间止损迫使你面对一个残酷事实：如果你的判断正确，市场应该很快给你正反馈。拖延本身就是市场在说「你的逻辑可能有问题」。大多数人亏损的根源不是方向错，是方向对了但时间不对——进去太早被洗出来。","highlights":[{"text":"规则：小时图3K不赚=错，日线3天=错","color":"red"}]}]},{"title":"第2章·法则二：正确时加码","level":"必修","points":[{"t":"盈利证实→放大仓位","c":"第一笔仓位出现浮动盈利且趋势确认后，才增加第二笔仓位。每笔加仓独立决策，止损独立设置。亏损仓位绝不对等加码。","detail":"法则二是法则一的自然延伸——既然已经被市场证明正确，为什么不让正确的人干更多活？这与大多数人的本能相反：散户习惯亏损后补仓摊低成本，幽灵教你在盈利后加仓放大收益。前者赌概率，后者顺趋势。","highlights":[{"text":"核心：被市场证明正确后才有资格加仓","color":"gold"}]},{"t":"加仓的时机与节奏","c":"首次加仓=突破关键阻力后回踩站稳。二次加仓=创出新高后缩量回踩前期高点。每次加仓量≤初始仓位，总仓位不超过初始的3倍。","detail":"幽灵的加仓不是冲动追高——每一次加仓都有明确的触发条件。市场必须先证明趋势延续，加仓才有合理性。最重要的是：每笔加仓都自带独立止损，即使最后一次加仓被止损，前两次的利润依然安全。","highlights":[{"text":"规则：每次加仓≤初始量，总仓位≤3倍","color":"green"}]}]},{"title":"第3章·法则三：巨量即出场","level":"必修","points":[{"t":"异常放量=聪明钱在行动","c":"当成交量突然放大至正常水平的2.5倍以上，无论此刻盈亏如何，立即平掉一半仓位。因为你不站在信息优势方。","detail":"巨量代表有大资金在行动——可能是利好前的吸筹，也可能是利空前的出货。作为散户，你永远不知道是哪一种。幽灵的智慧在于：我不需要知道原因，我只知道当大象在跳舞时，蚂蚁最好的策略是退到安全距离。","highlights":[{"text":"核心：巨量=大象跳舞，蚂蚁先撤","color":"gold"}]},{"t":"巨量后的二次入场策略","c":"巨量减半仓后观察：如果量能回归正常且价格维持趋势→补回仓位。如果价格反向突破1ATR→全部平仓。既不错过行情也不承受不确定性。","detail":"法则三不是永远退出——是暂时退到安全位置观察。如果巨量确实是主力的正常换手，量能回归正常后可以重新入场。如果是出货前的巨量假突破，你已经在半仓保护中锁定了大部分利润。进可攻退可守的最优策略。","highlights":[{"text":"规则：量能回归+价格持稳=补回，反向1ATR=全平","color":"green"}]}]},{"title":"第4章·幽灵的交易哲学：行为修正","level":"推荐","points":[{"t":"规则内化=改变本能","c":"三条法则本身不难理解——难的是执行。幽灵强调：不是理解了规则就学会了交易，是规则变成了你的肌肉记忆才算学会。","detail":"幽灵在书中反复强调一个观点：交易最大的敌人不是市场，是你的本能。人类本能是亏损后死扛、盈利后跑得快——刚好与赚钱需要的操作相反。三条法则本质上都是反本能训练，执行100次后才能内化。","highlights":[{"text":"核心：规则要内化成本能，不是懂就够了","color":"gold"}]},{"t":"每日交易复盘五问","c":"①今天有未证实的仓位吗？②盈利仓位加了吗？③遇到巨量处理了吗？④哪笔交易违反了法则？⑤明天如何改进？","detail":"幽灵最推崇的练习不是看图表——是每日复盘。五问直指三条法则的日常执行。坚持下去，你会发现自己违反法则的频率在下降，而盈利在增加。这比任何技术指标都有效。","highlights":[{"text":"规则：每日复盘五问=幽灵的刻意练习","color":"green"}]}]}],"knowledge_cards":[{"t":"时间止损量化规则","c":"根据交易时间框架设定时间止损：小时图交易者入场后3根K线内价格未产生≥0.3倍ATR的有利波动即平仓，5根K线内无明确方向也需退出；日线交易者3个交易日内价格仍未脱离成本区±1%需考虑减仓；周线交易者给予2周观察期。时间止损的本质是承认资金的时间价值和机会成本，防止资金被锁定在一笔不赚不赔的交易中而错过其他更好的机会。这条规则与价格止损互补，形成双重保护。","type":"rule"},{"t":"巨量识别与应对量化标准","c":"异常巨量的判定标准：当前K线成交量≥过去20根K线平均成交量的2.5倍，或超过过去50根K线中的单根最大值。一旦确认巨量信号，立即执行：①先平掉50%仓位锁定部分利润或限制亏损②观察后续1-2根K线，若量能回归正常水平且价格维持原有趋势方向，可重新补回仓位③若价格朝不利方向运行超过1个ATR，立即平掉剩余全部仓位。巨量出货的典型特征是放量后价格无力创新高或快速回落，而正常换手的巨量往往伴随价格继续沿趋势运动。","type":"rule"}],"quotes":["市场永远不会打败你，只有你自己能打败自己。","如果你说不清楚为什么持有这笔仓位，那就立刻平掉它。"],"practice":["每日检查未证实仓位并执行","巨量出现时练习半仓应对"]},{"id":"b21","title":"彼得·林奇的成功投资","author":"Peter Lynch","category":"选股策略","stage":6,"diff":2,"hours":12,"summary":"林奇掌舵麦哲伦基金13年年化29.2%的实战方法论。普通人用日常生活观察即可发现十倍股，六类股票分类法是选股的罗盘。","chapters":[{"title":"第1章·六类股票分类法","level":"必修","points":[{"t":"先分类再投资","c":"缓慢增长型（股息）、稳定增长型（逢低买涨30-50%卖）、快速增长型（最赚钱）、周期型（PE高买低卖）、困境反转型（高赔率）、隐蔽资产型（资产>市值）。","detail":"林奇说买股票前必须明确它属于哪一类——因为不同类型的买卖策略完全不同。用快速增长型的策略操作缓慢增长型=坐过山车后亏钱。类型搞错=策略全错。这是林奇体系的第一课，也是最被忽视的一课。","highlights":[{"text":"核心：不确定类型就不该买入","color":"gold"}]},{"t":"各类股票的买卖信号","c":"快速增长型：增速放缓=卖。周期型：PE最低时=买，PE最高时=卖。困境反转：债务解决=买，恢复正常=卖。","detail":"林奇发现散户亏损的最大原因不是选错股，是选对股后用错了策略。快速增长股的卖出信号不是涨多了——是增长率开始放缓。周期股的卖出信号PE最高时——因为那恰恰是盈利的周期性底部。逆向思维贯穿始终。","highlights":[{"text":"框架：每类股票有完全不同的买卖时钟","color":"gold"}]}]},{"title":"第2章·PEG估值与成长性评估","level":"必修","points":[{"t":"PEG=PE÷盈利增长率","c":"PEG<1=低估，=1=合理，>1.5=偏贵。但增长率必须是未来3-5年的预期增速而非历史增速——这是最大的陷阱。","detail":"30倍PE贵吗？如果公司每年增长15%，PEG=2，确实贵。如果增长40%，PEG=0.75，很便宜。PE本身没有意义——它必须和增长率配对着看。林奇说：任何不考虑增长率的PE分析都是耍流氓。","highlights":[{"text":"公式：PEG=PE÷未来3-5年预期增长率<1","color":"gold"}]},{"t":"增长率的质量验证","c":"真正的好增长=营收增长≈利润增长。如果营收增5%利润增30%=不可持续的成本削减。如果利润增5%营收增30%=扩张期的战略性投入。","detail":"林奇教你区分「真实的增长」和「伪增长」。伪增长常见于：一次性收益、财务技巧、压缩研发费用、变卖资产。这些增长不可持续，PEG再低也不能买。真实增长=营收和利润同步增长，且增长来源于市场需求而非会计魔法。","highlights":[{"text":"规则：营收和利润同步增长才是真增长","color":"green"}]}]},{"title":"第3章·日常生活选股法","level":"推荐","points":[{"t":"在你消费的地方发现牛股","c":"你最喜欢的餐厅、孩子上瘾的游戏、老婆必买的护肤品——你比华尔街分析师更早感知到这些公司的业务爆发。","detail":"林奇最著名的选股方法：从日常生活中发现投资机会。他在陪老婆逛购物中心时发现了The Limited（后来涨了数十倍），在孩子对某款电子游戏上瘾时发现了任天堂。普通消费者往往是产品爆发的第一见证人——比分析师早6-12个月。","highlights":[{"text":"核心：你比华尔街分析师更早感知消费趋势","color":"gold"}]},{"t":"业余投资者的独特优势","c":"基金经理受限于：①只能买大市值②不能集中持仓③季度排名压力④投资委员会限制。而你完全没有这些限制——这是你的不对称优势。","detail":"林奇一直在强调：业余投资者不是专业投资者的弱者——恰恰相反，你的灵活性和不受限制的信息渠道是专业基金经理梦寐以求的。问题是大多数业余投资者在模仿基金经理的玩法而不是发挥自己的优势。","highlights":[{"text":"核心：灵活性+生活感知=业余者的不对称优势","color":"gold"}]}]},{"title":"第4章·财务指标快速检视清单","level":"必修","points":[{"t":"避开危险信号的十个问题","c":"①现金>负债吗？②PEG<1吗？③机构持股<30%吗？④内部人在买吗？⑤负债/权益<50%吗？⑥存货增速<销售增速吗？⑦自由现金流为正吗？⑧应收账款增速<销售增速吗？⑨利润率稳定或上升吗？⑩公司业务乏味吗？","detail":"林奇偏爱「乏味」的业务——殡葬、废品处理、基础零件制造。这些行业没有新竞争者涌入，龙头公司可以持续稳定赚钱。反过来，他对热门行业避之不及：激光、生物科技、AI——因为竞争者太多，没有一家能持续赚到超额利润。","highlights":[{"text":"规则：十问至少七答「是」才考虑买入","color":"green"}]},{"t":"现金头寸的价值","c":"每股净现金=每股现金-每股负债。如果每股净现金占股价的30%以上，等于你买股票打了七折——其余资产和白送的利润等于免费。","detail":"这是林奇最爱用的估值小技巧。一家股价20元的公司如果每股净现金8元，意味着你实际只花了12元买入它的业务。如果这家公司每年还能赚2元，你的实际买入PE只有6倍——安全边际极大。林奇在克莱斯勒上靠这一招赚了数十倍。","highlights":[{"text":"公式：每股净现金/股价>30%=七折买入","color":"gold"}]}]},{"title":"第5章·买卖时机与组合管理","level":"推荐","points":[{"t":"买入前必答五问","c":"①这公司做什么的我能用三句话讲清楚吗？②它属于六类中哪一类？③我准备持有多久？④什么情况下必须卖出？⑤最坏情况下可能亏多少？","detail":"林奇说：如果你不能用蜡笔在三句话内向一个十岁孩子解释清楚这家公司是做什么的，那就不要买。这不是贬低你的智商——是在保护你。无法简单解释的业务=你无法真正理解=无法判断好坏=赌博。","highlights":[{"text":"规则：三句话讲不清楚业务=不买","color":"red"}]},{"t":"组合的动态再平衡","c":"理想组合=3-10只股票，涵盖至少3种不同类型。每季度检视：把表现最差的1只和最该卖出的1只调出，换入2只新的候选标的。","detail":"林奇管理的麦哲伦基金曾持有1400只股票——但他承认那是规模太大导致的不得已。对个人投资者，他强烈建议集中持有3-10只深度研究过的股票。分散化不是目的，深度研究才是。少于3只风险集中，多于10只研究不透。","highlights":[{"text":"规则：3-10只+至少3种类型=最优组合","color":"green"}]}]}],"knowledge_cards":[{"t":"PEG估值三步法","c":"第一步：估算公司未来3-5年盈利复合增长率——必须以营收增长和行业空间为锚，不能用历史数据简单外推，周期股和亏损股不适用PEG。第二步：计算PEG=当前PE÷预期增长率，PEG<0.75=显著低估可重仓，0.75-1.2=合理估值可持有，>1.5=估值偏高应减仓。第三步：交叉验证——确认增长率不是由一次性收益、削减研发或变卖资产驱动的伪增长，营收增速和利润增速应基本同步，且增长率不超过行业天花板的合理上限。","type":"formula"},{"t":"六类股票买卖对照表","c":"缓慢增长型：估值低+股息率>5%买入，基本面恶化或估值泡沫卖出。稳定增长型：PE处于历史低位买入，上涨30-50%分批卖出。快速增长型：PEG<1+增速加速买入，增速放缓至行业均值卖出。周期型：PE处于历史最高分位（盈利底部）买入，PE降至历史最低（盈利高峰）卖出。困境反转型：债务重组方案获批买入，恢复正常盈利后卖出。隐蔽资产型：市值<净现金+固定资产买入，资产价值被市场充分反映后卖出。类型判断错误会导致完全反向的操作——这是林奇体系中最致命的错误。","type":"rule"}],"quotes":["你完全可以在理发的时候发现一只十倍股。","股票投资不是脑外科手术——常识比高深的理论更管用。"],"practice":["用六类分类法分析持仓股","计算持仓每只股票的PEG"]},{"id":"b22","title":"战胜华尔街","author":"Peter Lynch","category":"选股策略","stage":6,"diff":2,"hours":12,"summary":"林奇复盘麦哲伦基金13年年化29.2%的实战记录。21个经典选股案例+25条黄金法则，从克莱斯勒到沃尔沃，揭示业余投资者如何战胜专业机构。","chapters":[{"title":"第1章·25条黄金法则：林奇的投资戒律","level":"必修","points":[{"t":"投资你了解的东西","c":"不买你无法用一句话说清业务模式的公司。你的职业和日常生活就是最好的调研起点。","detail":"林奇强调：业余投资者最大的优势不是更聪明，而是可以只关注自己真正理解的少数领域——而基金经理被迫覆盖几百只股票。你在工作中看到的供应商、在商场里观察到的客流、孩子热衷的品牌，都可能比华尔街分析师更早发现牛股。","highlights":[{"text":"核心：只投能用一句话说清业务的公司","color":"gold"},{"text":"优势：业余投资者可以只聚焦理解的领域","color":"green"}]},{"t":"六类股票不同策略","c":"缓慢增长型吃股息、稳定增长型逢低买、快速增长型最赚钱、周期型PE最高买最低卖、困境反转型高赔率、隐蔽资产型资产>市值。","detail":"最致命的错误是把快速增长型当缓慢增长型持有——坐过山车后回到原点。不同类型的买入和卖出信号完全不同：快速增长型看增长放缓即卖，周期型看PE最高时（利润低谷）才买。类型搞错=策略用错=必亏。","highlights":[{"text":"核心：六类股票=六套完全不同的买卖策略","color":"gold"},{"text":"警示：类型搞错=策略用错=必然亏损","color":"red"}]}]},{"title":"第2章·麦哲伦基金实战：13年29%的秘密","level":"必修","points":[{"t":"高频换手≠投机","c":"林奇年换手率300%但同时持有1400只股票。核心逻辑：不断把资金从确定性低的公司转移到确定性高的公司。","detail":"外界批评林奇换手率太高，但他认为这是资产配置优化的自然结果——每周研究新公司，发现比持仓中某只更好的就替换。重点不是换手率高低，而是每次调仓是否提升了组合质量。他的持仓中有一半以上持有时间超3年。","highlights":[{"text":"核心：换手不是目的，优化组合质量才是","color":"gold"},{"text":"规则：新发现更好的才换，不为换而换","color":"green"}]},{"t":"集中+分散的平衡术","c":"前10大重仓占30%仓位坚定持有，其余1300+只小额试探。重仓=确定性+轻仓=关注列表。","detail":"林奇的天才之处：重仓股是他高度确信的标的（如克莱斯勒、房利美），小额持仓相当于付费观察——持有一点才更有动力深入跟踪。一旦小额持仓证实了自己，就逐步加仓进入重仓梯队。这既保证了集中优势又避免了过早重仓的风险。","highlights":[{"text":"策略：重仓确信+轻仓试探=进可攻退可守","color":"blue"},{"text":"规则：轻仓=付费观察，确认后逐步加仓","color":"green"}]}]},{"title":"第3章·在生活中发现10倍股","level":"必修","points":[{"t":"逛街就是调研","c":"L'eggs丝袜（超市货架发现）、Dunkin' Donuts（咖啡好喝）、沃尔沃（瑞典出差看到满街跑）——都是日常观察找到的牛股。","detail":"林奇最有名的案例之L'eggs：妻子从超市买回丝袜，他发现包装精美且货架被抢购一空。调研后发现这是全美增长最快的丝袜品牌——母公司Hanes股价后来涨了10倍。你不需要彭博终端，逛超市、接送孩子、出差旅行，到处都是调研机会。","highlights":[{"text":"核心：超市货架=最好的选股终端","color":"gold"},{"text":"方法：看到火爆商品→查母公司→研究基本面","color":"green"}]},{"t":"乏味行业出大牛股","c":"殡葬服务（SCI）、垃圾处理（WM）、汽车配件——越乏味越没人关注→越可能被低估→越是牛股温床。","detail":"热门行业吸引大量分析师和竞争者，利润薄、估值高。而殡葬业、废物处理、零配件这些「无聊」行业——没有分析师覆盖、没有媒体炒作、没有新竞争者涌入，龙头公司可以默默提价、稳定增长。林奇说：'如果一个行业让你昏昏欲睡，那可能就是一座金矿。'","highlights":[{"text":"核心：越乏味的行业越可能是牛股温床","color":"gold"},{"text":"反向思考：热门行业=高估值+激烈竞争=陷阱","color":"red"}]}]},{"title":"第4章·买卖时机的艺术","level":"推荐","points":[{"t":"理想买入特征","c":"①公司名字枯燥/业务乏味②分拆上市③机构不持股无分析师覆盖④内部人大量买入⑤公司回购股票。≥3条=强烈买入信号。","detail":"分拆上市是林奇最爱的买入场景——母公司把子公司分拆给股东，华尔街通常不关注这种'小而麻烦'的公司，股价被严重低估。内部人买入和公司回购说明最了解公司的人在用真金白银投票。五种信号叠加意味着：好公司+没人关注+内部人看好。","highlights":[{"text":"核心：五种买入信号叠加=最佳击球区","color":"gold"},{"text":"规则：≥3条信号同时出现=强烈买入","color":"green"}]},{"t":"不同类型的卖出信号","c":"快速增长型：增长放缓即卖。周期型：PE最高(利润低谷)买、PE最低(利润巅峰)卖。困境反转：成功反转后卖。","detail":"林奇强调：没有永远持有的股票，卖点取决于类型。快速增长型公司在增长从50%降到20%时就该卖——即使公司还很好。周期型要在行业最悲观（PE最高时）买、最乐观（PE最低时）卖。最悲剧的是在快速增长型上用周期型的卖出逻辑。","highlights":[{"text":"核心：卖点永远取决于股票类型而非绝对价格","color":"gold"},{"text":"警示：最怕用错类型的卖出逻辑","color":"red"}]}]}],"knowledge_cards":[{"t":"林奇六类股票全矩阵","c":"①缓慢增长型：年增2-4%，吃股息，PE低，涨30-50%卖。②稳定增长型：年增10-12%，逢低买，涨30-50%卖。③快速增长型：年增20-50%，最赚钱，PEG<1买，增长放缓卖。④周期型：PE最高时（利润低谷）买，PE最低时（利润巅峰）卖。⑤困境反转型：高赔率，破产风险解除时买，成功反转后卖。⑥隐蔽资产型：资产>市值，发现即买，价值兑现即卖。类型搞错=策略用错=必亏。","type":"rule"},{"t":"林奇选股五问清单","c":"每笔交易前必须回答：①我能用一句话说清这家公司做什么吗？②它属于六类中的哪一类？③我计划持有多久，什么情况下卖出？④最坏情况可能亏多少？⑤为什么华尔街没有发现这个机会？五问全部答出方可买入，任何一问含糊=不买。这是林奇管理1400只股票而不失控的核心方法。","type":"rule"}],"quotes":["投资你了解的，不了解的股票就像在黑暗中掷飞镖。","股票投资不是脑外科手术，简单的方法往往最有效。"],"practice":["六类股票分类练习","日常生活中的牛股发现训练"]},{"id":"b23","title":"巴菲特致股东的信","author":"Warren Buffett","category":"价值投资","stage":6,"diff":3,"hours":14,"summary":"巴菲特60年投资思想精华集结。护城河、安全边际、浮存金、管理层评估、市场先生——价值投资的完整体系。","chapters":[{"title":"第1章·护城河：持久竞争优势的评估","level":"必修","points":[{"t":"护城河的五大来源","c":"品牌（可口可乐）、专利/特许权（医药）、网络效应（Visa/Mastercard）、规模优势（沃尔玛）、转换成本（微软）。≥2条突出=宽护城河。","detail":"巴菲特说护城河像城堡周围的河——越宽越好，但也要持续加宽。可口可乐的品牌让它在全球180个国家都有忠实消费者。Visa和Mastercard的双边网络效应：商户越多→信用卡越有用→持卡人越多→商户越必须接受→自我强化循环无人能打破。评估方法：想象你有100亿美元能否打败这家公司？答'能'=无护城河。","highlights":[{"text":"核心：护城河=用100亿也打不垮的竞争优势","color":"gold"},{"text":"方法：五来源≥2条突出=宽护城河","color":"green"}]},{"t":"护城河的动态评估","c":"静态护城河终将被填平。关键看企业是否持续加宽护城河——技术变革是最大的护城河杀手。","detail":"巴菲特最惨痛的教训：投资纺织厂伯克希尔——看似有规模优势，但技术变革让海外竞争者轻易跨越护城河。后来他总结：'当一个行业发生剧烈技术变革时，投资的风险极高。'评估护城河必须动态看：5年后这条河是更宽了还是正在被填平？","highlights":[{"text":"核心：护城河必须动态评估，静态=自欺欺人","color":"gold"},{"text":"警示：技术变革是护城河的头号杀手","color":"red"}]}]},{"title":"第2章·能力圈与安全边际","level":"必修","points":[{"t":"能力圈：知道边界比知道内容更重要","c":"巴菲特每天读500页持续扩大能力圈，但绝不踏出圈外半步。'重要的是知道你不知道什么。'","detail":"90年代末科技狂潮中，所有人都嘲笑巴菲特'过时了'。但他说：'我们不懂科技，所以不投。这不是说科技股不好——是我们没有能力评估它们。'宁可错过100个机会也不投一个看不懂的。三年后互联网泡沫破裂，巴菲特的'过时'成了最聪明的策略。","highlights":[{"text":"核心：知道你不知道什么 > 知道你知道什么","color":"gold"},{"text":"规则：宁可错过机会也不要投看不懂的","color":"green"}]},{"t":"安全边际的三层含义","c":"①价格安全边际：内在价值的50%以下买入。②业务安全边际：选业务简单稳定的公司。③管理层安全边际：选诚实能干的管理层。","detail":"很多人以为安全边际只是'买得便宜'，但巴菲
